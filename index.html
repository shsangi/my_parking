<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CSS 2027 · 16‑Hour Schedule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 32px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            padding: 20px 16px 28px;
            transition: all 0.2s;
            border: 1px solid rgba(0,20,40,0.04);
        }
        /* header / live status */
        .live-bar {
            background: #0b1e33;
            color: white;
            border-radius: 60px;
            padding: 16px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .live-activity {
            display: flex;
            flex-direction: column;
            flex: 2 1 180px;
        }
        .live-label {
            font-size: 12px;
            letter-spacing: 0.5px;
            opacity: 0.7;
            text-transform: uppercase;
            font-weight: 500;
        }
        .live-subject {
            font-weight: 700;
            font-size: 1.1rem;
            line-height: 1.3;
            word-break: break-word;
        }
        .live-timer {
            display: flex;
            align-items: baseline;
            gap: 4px;
            background: rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 40px;
            white-space: nowrap;
        }
        .timer-numbers {
            font-feature-settings: "tnum";
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: 1px;
        }
        .timer-unit {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-left: 2px;
        }
        .total-duration {
            background: #eef3f9;
            border-radius: 40px;
            padding: 8px 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #0b1e33;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .total-duration span {
            background: #0b1e33;
            color: white;
            padding: 0 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
            line-height: 1.8;
        }
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }
        .row {
            display: flex;
            align-items: center;
            padding: 8px 10px;
            border-radius: 40px;
            background: #fafcff;
            border: 1px solid #e9edf3;
            transition: 0.1s ease;
            font-size: 0.85rem;
            gap: 6px;
        }
        .row.current {
            background: #d7e6ff;
            border-color: #1d4ed8;
            box-shadow: 0 2px 6px rgba(29,78,216,0.08);
        }
        .row .time {
            font-weight: 600;
            color: #1e293b;
            min-width: 62px;
            font-size: 0.75rem;
            letter-spacing: 0.2px;
        }
        .row .subject {
            flex: 1;
            font-weight: 500;
            color: #0b1e33;
            padding: 0 4px;
        }
        .row .subj-small {
            font-size: 0.7rem;
            opacity: 0.7;
            font-weight: 400;
            margin-left: 4px;
        }
        .row .duration-badge {
            background: #e9edf3;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
        }
        .row.current .duration-badge {
            background: #1d4ed8;
            color: white;
        }
        .break-row {
            background: #f1f5f9;
            border-color: #d9e1ec;
        }
        .break-row .subject {
            font-weight: 500;
            color: #334155;
        }
        .footnote {
            margin-top: 20px;
            font-size: 0.7rem;
            color: #5e6f8d;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 16px;
            letter-spacing: 0.2px;
        }
        .footnote i {
            font-style: normal;
            background: #eef2f6;
            padding: 2px 10px;
            border-radius: 20px;
        }
        @media (max-width: 480px) {
            .card { padding: 14px 10px; }
            .live-bar { flex-direction: column; align-items: stretch; gap: 6px; }
            .live-timer { align-self: flex-start; }
            .row { flex-wrap: wrap; padding: 8px 8px; }
            .row .time { min-width: 54px; }
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 1.6s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .clock-pk {
            background: #eef3f9;
            border-radius: 30px;
            padding: 4px 12px;
            font-weight: 500;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #0b1e33;
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <!-- live header -->
    <div class="live-bar">
        <div class="live-activity">
            <div class="live-label"><span class="status-dot"></span> current activity</div>
            <div class="live-subject" id="currentActivity">Loading …</div>
        </div>
        <div class="live-timer">
            <span class="timer-numbers" id="timerDisplay">--:--</span>
            <span class="timer-unit">left</span>
        </div>
    </div>

    <!-- total duration & pk time -->
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 14px;">
        <div class="total-duration">
            ⏱ total <span id="totalDuration">16h 00m</span>
        </div>
        <div class="clock-pk" id="pkClock">🇵🇰 <span id="pkTime">--:--:--</span></div>
    </div>

    <!-- schedule list -->
    <div class="schedule-grid" id="scheduleContainer"></div>
    <div class="footnote">
        <i>CSS 2027 · 16‑hour coverage</i> &nbsp;|&nbsp; Pakistan time (PKT)
    </div>
</div>
<script>
    (function() {
        // ----- schedule data (based on the document) -----
        const schedule = [
            { from: "05:00", to: "08:00", duration: "3h", subject: "English Essay & Précis", type: "core" },
            { from: "08:00", to: "09:00", duration: "1h", subject: "GSA (General Science & Ability)", type: "compulsory" },
            { from: "09:00", to: "10:00", duration: "1h", subject: "Pakistan Affairs", type: "compulsory" },
            { from: "10:00", to: "11:00", duration: "1h", subject: "Current Affairs", type: "compulsory" },
            { from: "11:00", to: "12:00", duration: "1h", subject: "Islamic Studies / Ethics", type: "compulsory" },
            { from: "12:00", to: "13:00", duration: "1h", subject: "Optional 1 (Pol Sci / IR – Paper I)", type: "optional" },
            { from: "13:00", to: "14:00", duration: "1h", subject: "🕊️ Break · Lunch & Zohr", type: "break" },
            { from: "14:00", to: "15:00", duration: "1h", subject: "Optional 2 (Pol Sci / IR – Paper II)", type: "optional" },
            { from: "15:00", to: "16:00", duration: "1h", subject: "Optional 3 (Public Ad / Governance)", type: "optional" },
            { from: "16:00", to: "17:00", duration: "1h", subject: "Optional 4 (Criminology / History)", type: "optional" },
            { from: "17:00", to: "18:00", duration: "1h", subject: "Optional 5 (Gender / Env Sci)", type: "optional" },
            { from: "18:00", to: "19:00", duration: "1h", subject: "Optional 6 (Sindhi / Intl Law)", type: "optional" },
            { from: "19:00", to: "20:00", duration: "1h", subject: "🕊️ Break · Dinner & Isha", type: "break" },
            { from: "20:00", to: "22:00", duration: "2h", subject: "MPT Practice & Revision (MCQs)", type: "mpt" },
            { from: "22:00", to: "23:00", duration: "1h", subject: "Review · Note consolidation", type: "review" },
            { from: "23:00", to: "05:00", duration: "6h", subject: "🌙 Sleep · Night rest", type: "sleep" }
        ];

        // ----- DOM refs -----
        const container = document.getElementById('scheduleContainer');
        const currentActivityEl = document.getElementById('currentActivity');
        const timerDisplay = document.getElementById('timerDisplay');
        const totalDurationEl = document.getElementById('totalDuration');
        const pkClockEl = document.getElementById('pkTime');

        // ----- helpers (PK time) -----
        function getPakistanTime() {
            const now = new Date();
            // Pakistan Standard Time (UTC+5) no DST
            const pkOffset = 5 * 60; // minutes
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (pkOffset * 60000));
        }

        function formatTime(d) {
            return d.toTimeString().slice(0, 8);
        }

        function formatTimeShort(d) {
            return d.toTimeString().slice(0, 5);
        }

        function getMinutesFromMidnight(d) {
            return d.getHours() * 60 + d.getMinutes();
        }

        // ----- total duration (sum of all durations in minutes) -----
        function calcTotalMinutes() {
            let total = 0;
            for (let s of schedule) {
                const [h, m] = s.duration.replace('h','').split('h').map(Number);
                if (!isNaN(h) && !isNaN(m)) total += (h * 60 + m);
                else if (!isNaN(h)) total += h * 60;
                else if (!isNaN(m)) total += m;
            }
            return total;
        }

        function formatTotal(minutes) {
            const h = Math.floor(minutes / 60);
            const m = minutes % 60;
            return `${h}h ${m.toString().padStart(2,'0')}m`;
        }

        // ----- render schedule rows with current highlight -----
        function renderSchedule(currentIndex) {
            let html = '';
            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const isCurrent = (i === currentIndex);
                const isBreak = s.type === 'break' || s.type === 'sleep';
                let rowClass = 'row';
                if (isCurrent) rowClass += ' current';
                if (isBreak) rowClass += ' break-row';
                // time display
                const timeLabel = `${s.from} – ${s.to}`;
                // subject with optional small label
                let subjectDisplay = s.subject;
                if (s.type === 'core') subjectDisplay += ' <span class="subj-small">✏️</span>';
                else if (s.type === 'mpt') subjectDisplay += ' <span class="subj-small">📝</span>';
                else if (s.type === 'review') subjectDisplay += ' <span class="subj-small">📘</span>';
                else if (s.type === 'sleep') subjectDisplay = '🌙 ' + s.subject;
                else if (s.type === 'break') subjectDisplay = '☕ ' + s.subject;

                html += `<div class="${rowClass}">
                    <span class="time">${timeLabel}</span>
                    <span class="subject">${subjectDisplay}</span>
                    <span class="duration-badge">${s.duration}</span>
                </div>`;
            }
            container.innerHTML = html;
        }

        // ----- determine current activity index and timer -----
        function getCurrentIndexAndRemaining(nowPK) {
            const nowMinutes = getMinutesFromMidnight(nowPK);
            let currentIdx = -1;
            let nextIdx = -1;
            let remainingSeconds = 0;

            // find current or next
            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const fromParts = s.from.split(':').map(Number);
                const toParts = s.to.split(':').map(Number);
                const fromMin = fromParts[0] * 60 + fromParts[1];
                const toMin = toParts[0] * 60 + toParts[1];

                // handle overnight (23:00-05:00)
                let isActive = false;
                let endMin = toMin;
                if (toMin < fromMin) { // overnight
                    if (nowMinutes >= fromMin || nowMinutes < toMin) {
                        isActive = true;
                        endMin = toMin + 1440; // add 24h for calculation
                    }
                } else {
                    if (nowMinutes >= fromMin && nowMinutes < toMin) {
                        isActive = true;
                    }
                }

                if (isActive) {
                    currentIdx = i;
                    // calculate remaining
                    let end = toMin;
                    if (end < fromMin) end += 1440; // overnight
                    let nowAdj = nowMinutes;
                    if (nowAdj < fromMin && toMin < fromMin) nowAdj += 1440; // adjust for overnight
                    const diffMinutes = end - nowAdj;
                    remainingSeconds = Math.max(0, diffMinutes * 60);
                    break;
                }
            }

            // if no current, find the next upcoming (or first if after midnight)
            if (currentIdx === -1) {
                let minDiff = Infinity;
                let candidate = -1;
                for (let i = 0; i < schedule.length; i++) {
                    const s = schedule[i];
                    const fromParts = s.from.split(':').map(Number);
                    const fromMin = fromParts[0] * 60 + fromParts[1];
                    let diff = fromMin - nowMinutes;
                    if (diff < 0) diff += 1440;
                    if (diff < minDiff) {
                        minDiff = diff;
                        candidate = i;
                    }
                }
                if (candidate !== -1) {
                    currentIdx = candidate;
                    // remaining until that session starts
                    const s = schedule[currentIdx];
                    const fromParts = s.from.split(':').map(Number);
                    let fromMin = fromParts[0] * 60 + fromParts[1];
                    let diff = fromMin - nowMinutes;
                    if (diff < 0) diff += 1440;
                    remainingSeconds = diff * 60;
                } else {
                    // fallback
                    currentIdx = 0;
                    remainingSeconds = 0;
                }
            }

            return { currentIdx, remainingSeconds };
        }

        // ----- update UI (activity, timer, clock, total) -----
        function updateUI() {
            const nowPK = getPakistanTime();
            // update clock
            pkClockEl.textContent = formatTime(nowPK);

            const { currentIdx, remainingSeconds } = getCurrentIndexAndRemaining(nowPK);
            const currentItem = schedule[currentIdx] || schedule[0];
            const subject = currentItem.subject;

            // update activity
            let activityText = subject;
            if (currentItem.type === 'break' || currentItem.type === 'sleep') {
                activityText = '🕊️ ' + subject;
            } else {
                // add type hint
                const typeMap = {
                    'core': '📘 ',
                    'compulsory': '📖 ',
                    'optional': '📚 ',
                    'mpt': '📝 ',
                    'review': '📋 '
                };
                const prefix = typeMap[currentItem.type] || '';
                activityText = prefix + subject;
            }
            currentActivityEl.textContent = activityText;

            // timer
            const hrs = Math.floor(remainingSeconds / 3600);
            const mins = Math.floor((remainingSeconds % 3600) / 60);
            const secs = Math.floor(remainingSeconds % 60);
            if (remainingSeconds > 0) {
                timerDisplay.textContent = `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            } else {
                timerDisplay.textContent = '00:00:00';
            }

            // re-render schedule with highlight
            renderSchedule(currentIdx);

            // total duration (fixed)
            const totalMin = calcTotalMinutes();
            totalDurationEl.textContent = formatTotal(totalMin);
        }

        // ----- initial render & interval -----
        function init() {
            updateUI();
            setInterval(updateUI, 1000);
        }

        // set total duration once
        document.addEventListener('DOMContentLoaded', init);
    })();
</script>
</body>
</html>
