<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CSS 2027 · 16‑Hour Schedule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f2f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .card {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 16px 14px 18px;
            border: 1px solid rgba(0,20,40,0.03);
        }

        /* compact banner — no timer */
        .banner {
            background: #0b1e33;
            color: white;
            border-radius: 60px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            min-height: 48px;
        }
        .banner-activity {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }
        .banner-subject {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
            letter-spacing: 0.2px;
            word-break: break-word;
        }

        /* status bar: done | remaining time | remaining count */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 40px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1e293b;
            flex-wrap: wrap;
        }
        .status-bar .done-count {
            color: #1a4b8c;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-bar .done-count span {
            background: #b3d0ff;
            padding: 0 10px;
            border-radius: 20px;
            color: #0b2b5e;
            font-weight: 700;
        }
        .status-bar .remaining-time {
            color: #b91c1c;
            font-weight: 700;
            background: #fee9e7;
            padding: 0 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .status-bar .remaining-time .time-num {
            font-feature-settings: "tnum";
        }
        .status-bar .remaining-count {
            color: #b91c1c;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .status-bar .remaining-count span {
            background: #fee9e7;
            padding: 0 10px;
            border-radius: 20px;
            color: #b91c1c;
            font-weight: 700;
        }

        /* schedule list */
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 4px;
        }
        .row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 40px;
            background: #fafcff;
            border: 1px solid #e9edf3;
            transition: 0.1s ease;
            font-size: 0.82rem;
            gap: 4px;
        }
        .row .srno {
            font-weight: 600;
            color: #475569;
            min-width: 28px;
            font-size: 0.7rem;
            text-align: center;
        }
        .row .time {
            font-weight: 600;
            color: #1e293b;
            min-width: 62px;
            font-size: 0.7rem;
            letter-spacing: 0.2px;
        }
        .row .subject {
            flex: 1;
            font-weight: 500;
            color: #0b1e33;
            padding: 0 4px;
            font-size: 0.8rem;
        }
        .row .duration-badge {
            background: #e9edf3;
            padding: 1px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
        }

        /* status colors */
        .row.done {
            background: #e6f0ff;
            border-color: #b3d0ff;
        }
        .row.done .subject {
            color: #1a4b8c;
        }
        .row.done .duration-badge {
            background: #b3d0ff;
            color: #0b2b5e;
        }

        .row.current {
            background: #fee9e7;
            border-color: #e53e3e;
            box-shadow: 0 2px 8px rgba(229,62,62,0.08);
        }
        .row.current .subject {
            color: #b91c1c;
            font-weight: 600;
        }
        .row.current .duration-badge {
            background: #e53e3e;
            color: white;
        }
        .row.current .srno {
            color: #b91c1c;
        }
        .row.current .time {
            color: #b91c1c;
        }

        .row.upcoming {
            background: #fafcff;
            border-color: #e9edf3;
        }
        .row.break-row {
            background: #f1f5f9;
            border-color: #d9e1ec;
        }
        .row.break-row .subject {
            color: #334155;
        }
        .row.break-row.done {
            background: #e2e8f0;
            border-color: #cbd5e1;
        }
        .row.break-row.current {
            background: #fee9e7;
            border-color: #e53e3e;
        }

        .footer {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #5e6f8d;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .footer .pkt-clock {
            background: #eef2f6;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
            color: #1e293b;
        }
        .footer .exam-dates {
            display: flex;
            gap: 12px;
            font-weight: 500;
            color: #0b1e33;
            flex-wrap: wrap;
        }
        .footer .exam-dates .mpt-date {
            background: #dbeafe;
            padding: 2px 12px;
            border-radius: 20px;
            color: #1a4b8c;
        }
        .footer .exam-dates .written-date {
            background: #fee9e7;
            padding: 2px 12px;
            border-radius: 20px;
            color: #b91c1c;
        }
        .footer .exam-dates .count-days {
            font-weight: 700;
            margin-left: 2px;
        }

        @media (max-width: 480px) {
            .card { padding: 12px 8px; }
            .banner { padding: 6px 14px; min-height: 40px; }
            .banner-subject { font-size: 0.8rem; }
            .row { padding: 5px 6px; font-size: 0.72rem; }
            .row .srno { min-width: 22px; font-size: 0.65rem; }
            .row .time { min-width: 52px; font-size: 0.65rem; }
            .row .duration-badge { font-size: 0.6rem; padding: 0 10px; }
            .row .subject { font-size: 0.7rem; }
            .status-bar { font-size: 0.7rem; padding: 4px 10px; gap: 4px; }
            .status-bar .remaining-time { font-size: 0.75rem; padding: 0 10px; }
            .footer { font-size: 0.6rem; flex-direction: column; align-items: stretch; gap: 4px; }
            .footer .exam-dates { justify-content: center; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <!-- banner: activity only (no timer) -->
    <div class="banner">
        <div class="banner-activity">
            <span class="status-dot"></span>
            <span class="banner-subject" id="currentActivity">Loading …</span>
        </div>
    </div>

    <!-- status bar: done | remaining time (mm:ss) | remaining count -->
    <div class="status-bar">
        <span class="done-count">✅ Done: <span id="doneCount">0</span></span>
        <span class="remaining-time" id="remainingTimeDisplay">⏳ <span class="time-num" id="remainingTimeMinutes">--</span>:<span class="time-num" id="remainingTimeSeconds">--</span></span>
        <span class="remaining-count">⏳ Left: <span id="remainingCount">0</span></span>
    </div>

    <!-- schedule list -->
    <div class="schedule-grid" id="scheduleContainer"></div>

    <!-- footer: exam dates with countdown + PKT clock -->
    <div class="footer">
        <div class="exam-dates">
            <span class="mpt-date">📝 MPT: Sun 27 Sep 2026 <span class="count-days" id="mptDays">--</span>d</span>
            <span class="written-date">✍️ Written: 27 Jan 2027 <span class="count-days" id="writtenDays">--</span>d</span>
        </div>
        <span class="pkt-clock">🇵🇰 <span id="pkTime">--:-- --</span></span>
    </div>
</div>
<script>
    (function() {
        // ----- schedule data -----
        const schedule = [
            { from: "05:00", to: "08:00", duration: "3h", subject: "English Essay & Précis", type: "core" },
            { from: "08:00", to: "09:00", duration: "1h", subject: "GSA (General Science & Ability)", type: "compulsory" },
            { from: "09:00", to: "10:00", duration: "1h", subject: "Pakistan Affairs", type: "compulsory" },
            { from: "10:00", to: "11:00", duration: "1h", subject: "Current Affairs", type: "compulsory" },
            { from: "11:00", to: "12:00", duration: "1h", subject: "Islamic Studies / Ethics", type: "compulsory" },
            { from: "12:00", to: "13:00", duration: "1h", subject: "Optional 1 (Pol Sci / IR – Paper I)", type: "optional" },
            { from: "13:00", to: "14:00", duration: "1h", subject: "☕ Break · Lunch & Zohr", type: "break" },
            { from: "14:00", to: "15:00", duration: "1h", subject: "Optional 2 (Pol Sci / IR – Paper II)", type: "optional" },
            { from: "15:00", to: "16:00", duration: "1h", subject: "Optional 3 (Public Ad / Governance)", type: "optional" },
            { from: "16:00", to: "17:00", duration: "1h", subject: "Optional 4 (Criminology / History)", type: "optional" },
            { from: "17:00", to: "18:00", duration: "1h", subject: "Optional 5 (Gender / Env Sci)", type: "optional" },
            { from: "18:00", to: "19:00", duration: "1h", subject: "Optional 6 (Sindhi / Intl Law)", type: "optional" },
            { from: "19:00", to: "20:00", duration: "1h", subject: "☕ Break · Dinner & Isha", type: "break" },
            { from: "20:00", to: "22:00", duration: "2h", subject: "MPT Practice & Revision (MCQs)", type: "mpt" },
            { from: "22:00", to: "23:00", duration: "1h", subject: "Review · Note consolidation", type: "review" },
            { from: "23:00", to: "05:00", duration: "6h", subject: "🌙 Sleep · Night rest", type: "sleep" }
        ];

        // ----- DOM refs -----
        const container = document.getElementById('scheduleContainer');
        const currentActivityEl = document.getElementById('currentActivity');
        const remainingTimeMinutesEl = document.getElementById('remainingTimeMinutes');
        const remainingTimeSecondsEl = document.getElementById('remainingTimeSeconds');
        const pkTimeEl = document.getElementById('pkTime');
        const doneCountEl = document.getElementById('doneCount');
        const remainingCountEl = document.getElementById('remainingCount');
        const mptDaysEl = document.getElementById('mptDays');
        const writtenDaysEl = document.getElementById('writtenDays');

        // ----- exam dates -----
        const MPT_DATE = new Date(2026, 8, 27); // Sep 27, 2026
        const WRITTEN_DATE = new Date(2027, 0, 27); // Jan 27, 2027

        // ----- helpers (PK time) -----
        function getPakistanTime() {
            const now = new Date();
            const pkOffset = 5 * 60;
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (pkOffset * 60000));
        }

        function formatTime12(d) {
            let hours = d.getHours();
            const minutes = d.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function getMinutesFromMidnight(d) {
            return d.getHours() * 60 + d.getMinutes();
        }

        function getDaysUntil(targetDate, nowPK) {
            const target = new Date(targetDate);
            target.setHours(0, 0, 0, 0);
            const now = new Date(nowPK);
            now.setHours(0, 0, 0, 0);
            const diffTime = target.getTime() - now.getTime();
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        }

        // ----- get current index & remaining seconds (UPDATED: seconds run down) -----
        function getCurrentIndexAndRemaining(nowPK) {
            const nowMinutes = getMinutesFromMidnight(nowPK);
            let currentIdx = -1;
            let remainingSeconds = 0;

            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const fromParts = s.from.split(':').map(Number);
                const toParts = s.to.split(':').map(Number);
                const fromMin = fromParts[0] * 60 + fromParts[1];
                const toMin = toParts[0] * 60 + toParts[1];

                let isActive = false;
                let endMin = toMin;
                if (toMin < fromMin) {
                    // crosses midnight
                    if (nowMinutes >= fromMin || nowMinutes < toMin) {
                        isActive = true;
                        endMin = toMin + 1440;
                    }
                } else {
                    if (nowMinutes >= fromMin && nowMinutes < toMin) {
                        isActive = true;
                    }
                }

                if (isActive) {
                    currentIdx = i;
                    let end = toMin;
                    if (end < fromMin) end += 1440;
                    let nowAdj = nowMinutes;
                    if (nowAdj < fromMin && toMin < fromMin) nowAdj += 1440;
                    const diffMinutes = end - nowAdj;
                    remainingSeconds = Math.max(0, diffMinutes * 60);
                    break;
                }
            }

            // if no current, find next upcoming (and set remaining seconds until start)
            if (currentIdx === -1) {
                let minDiff = Infinity;
                let candidate = -1;
                for (let i = 0; i < schedule.length; i++) {
                    const s = schedule[i];
                    const fromParts = s.from.split(':').map(Number);
                    const fromMin = fromParts[0] * 60 + fromParts[1];
                    let diff = fromMin - nowMinutes;
                    if (diff < 0) diff += 1440;
                    if (diff < minDiff) {
                        minDiff = diff;
                        candidate = i;
                    }
                }
                if (candidate !== -1) {
                    currentIdx = candidate;
                    const s = schedule[currentIdx];
                    const fromParts = s.from.split(':').map(Number);
                    let fromMin = fromParts[0] * 60 + fromParts[1];
                    let diff = fromMin - nowMinutes;
                    if (diff < 0) diff += 1440;
                    remainingSeconds = diff * 60;
                } else {
                    currentIdx = 0;
                    remainingSeconds = 0;
                }
            }
            return { currentIdx, remainingSeconds };
        }

        // ----- render schedule with srno, time, subject, duration & color status -----
        function renderSchedule(currentIdx) {
            let html = '';
            let doneCount = 0;
            let remainingCount = 0;

            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const isBreak = s.type === 'break' || s.type === 'sleep';
                let rowClass = 'row';

                let status = 'upcoming';
                if (i < currentIdx) status = 'done';
                else if (i === currentIdx) status = 'current';

                if (status === 'done') {
                    rowClass += ' done';
                    doneCount++;
                } else if (status === 'current') {
                    rowClass += ' current';
                    remainingCount++;
                } else {
                    remainingCount++;
                }
                if (isBreak) rowClass += ' break-row';

                const srno = i + 1;
                const timeLabel = `${s.from} – ${s.to}`;
                let subjectDisplay = s.subject;
                if (s.type === 'break') subjectDisplay = s.subject.replace('☕ ', '');
                else if (s.type === 'sleep') subjectDisplay = s.subject.replace('🌙 ', '');

                // small emoji for type
                if (s.type === 'core') subjectDisplay += ' ✏️';
                else if (s.type === 'mpt') subjectDisplay += ' 📝';
                else if (s.type === 'review') subjectDisplay += ' 📘';
                else if (s.type === 'optional') subjectDisplay += ' 📚';
                else if (s.type === 'compulsory') subjectDisplay += ' 📖';

                html += `<div class="${rowClass}">
                    <span class="srno">${srno}</span>
                    <span class="time">${timeLabel}</span>
                    <span class="subject">${subjectDisplay}</span>
                    <span class="duration-badge">${s.duration}</span>
                </div>`;
            }

            container.innerHTML = html;
            doneCountEl.textContent = doneCount;
            remainingCountEl.textContent = remainingCount;
        }

        // ----- update UI (called every second) -----
        function updateUI() {
            const nowPK = getPakistanTime();
            pkTimeEl.textContent = formatTime12(nowPK);

            // Update exam day counts
            const mptDays = getDaysUntil(MPT_DATE, nowPK);
            const writtenDays = getDaysUntil(WRITTEN_DATE, nowPK);
            mptDaysEl.textContent = mptDays >= 0 ? mptDays : '0';
            writtenDaysEl.textContent = writtenDays >= 0 ? writtenDays : '0';

            const { currentIdx, remainingSeconds } = getCurrentIndexAndRemaining(nowPK);
            const currentItem = schedule[currentIdx] || schedule[0];

            // activity text (banner)
            let activityText = currentItem.subject;
            if (currentItem.type === 'break' || currentItem.type === 'sleep') {
                activityText = '☕ ' + currentItem.subject.replace('☕ ', '');
            } else {
                const prefixMap = {
                    'core': '📘 ',
                    'compulsory': '📖 ',
                    'optional': '📚 ',
                    'mpt': '📝 ',
                    'review': '📋 '
                };
                const prefix = prefixMap[currentItem.type] || '';
                activityText = prefix + currentItem.subject;
            }
            currentActivityEl.textContent = activityText;

            // remaining time in status bar (mm:ss)
            const mins = Math.floor(remainingSeconds / 60);
            const secs = Math.floor(remainingSeconds % 60);
            remainingTimeMinutesEl.textContent = String(mins).padStart(2, '0');
            remainingTimeSecondsEl.textContent = String(secs).padStart(2, '0');

            // render schedule with status
            renderSchedule(currentIdx);
        }

        // ----- init -----
        function init() {
            updateUI();
            setInterval(updateUI, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
</script>
</body>
</html>
