<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>CSS 2027 · 16‑Hour Schedule</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f2f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .card {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 16px 14px 22px;
            border: 1px solid rgba(0,20,40,0.03);
        }

        /* compact banner */
        .banner {
            background: #0b1e33;
            color: white;
            border-radius: 60px;
            padding: 8px 16px 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px 10px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        .banner-activity {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1 1 140px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(0.95); }
        }
        .banner-subject {
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.3;
            letter-spacing: 0.2px;
            word-break: break-word;
        }
        .banner-timer {
            background: rgba(255,255,255,0.08);
            padding: 4px 14px;
            border-radius: 40px;
            display: flex;
            align-items: baseline;
            gap: 3px;
            white-space: nowrap;
            font-feature-settings: "tnum";
            font-weight: 600;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }
        .timer-seconds {
            font-weight: 400;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-left: 2px;
        }
        .banner-clock {
            background: rgba(255,255,255,0.06);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* schedule grid */
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 6px;
        }
        .row {
            display: flex;
            align-items: center;
            padding: 6px 10px;
            border-radius: 40px;
            background: #fafcff;
            border: 1px solid #e9edf3;
            transition: 0.1s ease;
            font-size: 0.82rem;
            gap: 6px;
        }
        /* current (active) = blue */
        .row.current {
            background: #dbeafe;
            border-color: #2563eb;
            box-shadow: 0 2px 6px rgba(37,99,235,0.06);
        }
        /* done = blue (soft) */
        .row.done {
            background: #e6f0ff;
            border-color: #93b5e8;
            opacity: 0.85;
        }
        .row.done .subject {
            color: #1a4b8c;
        }
        /* remaining = red */
        .row.remaining {
            background: #ffeaea;
            border-color: #f8a3a3;
        }
        .row.remaining .subject {
            color: #a11f1f;
        }
        .row .time {
            font-weight: 600;
            color: #1e293b;
            min-width: 58px;
            font-size: 0.7rem;
            letter-spacing: 0.2px;
        }
        .row .subject {
            flex: 1;
            font-weight: 500;
            color: #0b1e33;
            padding: 0 4px;
        }
        .row .subj-small {
            font-size: 0.65rem;
            opacity: 0.6;
            font-weight: 400;
            margin-left: 4px;
        }
        .row .duration-badge {
            background: #e9edf3;
            padding: 1px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            color: #1e293b;
            white-space: nowrap;
        }
        .row.current .duration-badge {
            background: #2563eb;
            color: white;
        }
        .row.done .duration-badge {
            background: #b3cff5;
            color: #0f3b6e;
        }
        .row.remaining .duration-badge {
            background: #f7c8c8;
            color: #8f1f1f;
        }
        .break-row {
            background: #f1f5f9;
            border-color: #d9e1ec;
        }
        .break-row .subject {
            color: #334155;
        }
        /* override for break rows: keep neutral */
        .break-row.done, .break-row.remaining {
            background: #f1f5f9 !important;
            border-color: #d9e1ec !important;
        }
        .break-row.done .subject, .break-row.remaining .subject {
            color: #334155 !important;
        }
        .break-row.done .duration-badge, .break-row.remaining .duration-badge {
            background: #e9edf3 !important;
            color: #1e293b !important;
        }

        .footnote {
            margin-top: 16px;
            font-size: 0.65rem;
            color: #5e6f8d;
            text-align: center;
            border-top: 1px solid #e2e8f0;
            padding-top: 14px;
            letter-spacing: 0.2px;
        }
        .footnote i {
            font-style: normal;
            background: #eef2f6;
            padding: 2px 10px;
            border-radius: 20px;
        }
        @media (max-width: 480px) {
            .card { padding: 12px 8px; }
            .banner { padding: 6px 12px; gap: 4px; }
            .banner-subject { font-size: 0.8rem; }
            .banner-timer { font-size: 1rem; padding: 2px 10px; }
            .banner-clock { font-size: 0.7rem; padding: 2px 8px; }
            .row { padding: 5px 6px; font-size: 0.75rem; }
            .row .time { min-width: 50px; font-size: 0.65rem; }
            .row .duration-badge { font-size: 0.6rem; padding: 0 10px; }
        }
    </style>
</head>
<body>
<div class="card" id="app">
    <!-- compact banner -->
    <div class="banner">
        <div class="banner-activity">
            <span class="status-dot"></span>
            <span class="banner-subject" id="currentActivity">Loading …</span>
        </div>
        <div class="banner-timer" id="timerDisplay">
            <span id="timerMinutes">--</span>:<span id="timerSeconds">--</span>
            <span class="timer-seconds">left</span>
        </div>
        <div class="banner-clock" id="pkClock">
            🇵🇰 <span id="pkTime">--:-- --</span>
        </div>
    </div>

    <!-- schedule list -->
    <div class="schedule-grid" id="scheduleContainer"></div>
    <div class="footnote">
        <i>CSS 2027 · 16‑hour coverage</i> &nbsp;·&nbsp; <span style="color:#a11f1f;">● remaining</span> &nbsp; <span style="color:#1a4b8c;">● done</span> &nbsp; <span style="color:#2563eb;">● active</span>
    </div>
</div>
<script>
    (function() {
        // ----- schedule data (based on document) -----
        const schedule = [
            { from: "05:00", to: "08:00", duration: "3h", subject: "English Essay & Précis", type: "core" },
            { from: "08:00", to: "09:00", duration: "1h", subject: "GSA (General Science & Ability)", type: "compulsory" },
            { from: "09:00", to: "10:00", duration: "1h", subject: "Pakistan Affairs", type: "compulsory" },
            { from: "10:00", to: "11:00", duration: "1h", subject: "Current Affairs", type: "compulsory" },
            { from: "11:00", to: "12:00", duration: "1h", subject: "Islamic Studies / Ethics", type: "compulsory" },
            { from: "12:00", to: "13:00", duration: "1h", subject: "Optional 1 (Pol Sci / IR – Paper I)", type: "optional" },
            { from: "13:00", to: "14:00", duration: "1h", subject: "☕ Break · Lunch & Zohr", type: "break" },
            { from: "14:00", to: "15:00", duration: "1h", subject: "Optional 2 (Pol Sci / IR – Paper II)", type: "optional" },
            { from: "15:00", to: "16:00", duration: "1h", subject: "Optional 3 (Public Ad / Governance)", type: "optional" },
            { from: "16:00", to: "17:00", duration: "1h", subject: "Optional 4 (Criminology / History)", type: "optional" },
            { from: "17:00", to: "18:00", duration: "1h", subject: "Optional 5 (Gender / Env Sci)", type: "optional" },
            { from: "18:00", to: "19:00", duration: "1h", subject: "Optional 6 (Sindhi / Intl Law)", type: "optional" },
            { from: "19:00", to: "20:00", duration: "1h", subject: "☕ Break · Dinner & Isha", type: "break" },
            { from: "20:00", to: "22:00", duration: "2h", subject: "MPT Practice & Revision (MCQs)", type: "mpt" },
            { from: "22:00", to: "23:00", duration: "1h", subject: "Review · Note consolidation", type: "review" },
            { from: "23:00", to: "05:00", duration: "6h", subject: "🌙 Sleep · Night rest", type: "sleep" }
        ];

        // ----- DOM refs -----
        const container = document.getElementById('scheduleContainer');
        const currentActivityEl = document.getElementById('currentActivity');
        const timerMinutesEl = document.getElementById('timerMinutes');
        const timerSecondsEl = document.getElementById('timerSeconds');
        const pkTimeEl = document.getElementById('pkTime');

        // ----- helpers (PK time) -----
        function getPakistanTime() {
            const now = new Date();
            const pkOffset = 5 * 60; // UTC+5
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (pkOffset * 60000));
        }

        function formatTime12(d) {
            let hours = d.getHours();
            const minutes = d.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            return `${hours}:${minutes} ${ampm}`;
        }

        function getMinutesFromMidnight(d) {
            return d.getHours() * 60 + d.getMinutes();
        }

        // ----- determine which items are done, current, remaining -----
        function getItemStates(nowPK) {
            const nowMinutes = getMinutesFromMidnight(nowPK);
            const states = [];
            let foundCurrent = false;
            let currentIdx = -1;

            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const fromParts = s.from.split(':').map(Number);
                const toParts = s.to.split(':').map(Number);
                const fromMin = fromParts[0] * 60 + fromParts[1];
                const toMin = toParts[0] * 60 + toParts[1];

                let isActive = false;
                let endMin = toMin;
                if (toMin < fromMin) { // overnight
                    if (nowMinutes >= fromMin || nowMinutes < toMin) {
                        isActive = true;
                        endMin = toMin + 1440;
                    }
                } else {
                    if (nowMinutes >= fromMin && nowMinutes < toMin) {
                        isActive = true;
                    }
                }

                let state = 'remaining'; // default
                if (isActive) {
                    state = 'current';
                    foundCurrent = true;
                    currentIdx = i;
                } else {
                    // if current not found yet, and we are past this item's end time → done
                    // but careful with overnight: we consider "done" if the item ended before now
                    let itemEnd = toMin;
                    if (itemEnd < fromMin) itemEnd += 1440; // overnight end
                    let nowAdj = nowMinutes;
                    if (nowAdj < fromMin && toMin < fromMin) nowAdj += 1440;

                    if (nowAdj >= itemEnd) {
                        state = 'done';
                    } else {
                        state = 'remaining';
                    }
                }
                states.push({ state, index: i, isBreak: (s.type === 'break' || s.type === 'sleep') });
            }

            // special: if no current found, find the next upcoming and mark as 'current' (but we use state 'current' for active only)
            // however we want to show blue for current, red for remaining, blue for done.
            // if no current, all before next are done, next is current? but we prefer to keep 'current' only if active.
            // if no active, we treat the next upcoming as 'current' to highlight it.
            if (!foundCurrent) {
                let minDiff = Infinity;
                let candidate = -1;
                for (let i = 0; i < schedule.length; i++) {
                    const s = schedule[i];
                    const fromParts = s.from.split(':').map(Number);
                    const fromMin = fromParts[0] * 60 + fromParts[1];
                    let diff = fromMin - nowMinutes;
                    if (diff < 0) diff += 1440;
                    if (diff < minDiff) {
                        minDiff = diff;
                        candidate = i;
                    }
                }
                if (candidate !== -1) {
                    // mark candidate as 'current' (so it gets blue highlight)
                    states[candidate].state = 'current';
                    currentIdx = candidate;
                }
            }

            return { states, currentIdx };
        }

        // ----- render schedule with done/remaining colors -----
        function renderSchedule(states, currentIdx) {
            let html = '';
            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                const state = states[i].state;
                const isBreak = states[i].isBreak;

                let rowClass = 'row';
                if (isBreak) rowClass += ' break-row';
                if (state === 'current') rowClass += ' current';
                else if (state === 'done') rowClass += ' done';
                else if (state === 'remaining') rowClass += ' remaining';

                const timeLabel = `${s.from} – ${s.to}`;
                let subjectDisplay = s.subject;
                if (s.type === 'core') subjectDisplay += ' <span class="subj-small">✏️</span>';
                else if (s.type === 'mpt') subjectDisplay += ' <span class="subj-small">📝</span>';
                else if (s.type === 'review') subjectDisplay += ' <span class="subj-small">📘</span>';
                else if (s.type === 'sleep') subjectDisplay = '🌙 ' + s.subject;
                else if (s.type === 'break') subjectDisplay = '☕ ' + s.subject.replace('☕ ', '');

                html += `<div class="${rowClass}">
                    <span class="time">${timeLabel}</span>
                    <span class="subject">${subjectDisplay}</span>
                    <span class="duration-badge">${s.duration}</span>
                </div>`;
            }
            container.innerHTML = html;
        }

        // ----- get remaining seconds for current activity -----
        function getRemainingSeconds(nowPK, currentIdx) {
            if (currentIdx === -1) return 0;
            const s = schedule[currentIdx];
            const fromParts = s.from.split(':').map(Number);
            const toParts = s.to.split(':').map(Number);
            const fromMin = fromParts[0] * 60 + fromParts[1];
            const toMin = toParts[0] * 60 + toParts[1];
            const nowMinutes = getMinutesFromMidnight(nowPK);

            let endMin = toMin;
            if (toMin < fromMin) endMin += 1440;
            let nowAdj = nowMinutes;
            if (nowAdj < fromMin && toMin < fromMin) nowAdj += 1440;
            const diffMinutes = endMin - nowAdj;
            return Math.max(0, diffMinutes * 60);
        }

        // ----- update UI -----
        function updateUI() {
            const nowPK = getPakistanTime();
            pkTimeEl.textContent = formatTime12(nowPK);

            const { states, currentIdx } = getItemStates(nowPK);
            const currentItem = (currentIdx !== -1) ? schedule[currentIdx] : schedule[0];

            // activity text
            let activityText = currentItem ? currentItem.subject : '—';
            if (currentItem) {
                if (currentItem.type === 'break' || currentItem.type === 'sleep') {
                    activityText = '☕ ' + currentItem.subject.replace('☕ ', '');
                } else {
                    const prefixMap = {
                        'core': '📘 ',
                        'compulsory': '📖 ',
                        'optional': '📚 ',
                        'mpt': '📝 ',
                        'review': '📋 '
                    };
                    const prefix = prefixMap[currentItem.type] || '';
                    activityText = prefix + currentItem.subject;
                }
            }
            currentActivityEl.textContent = activityText;

            // timer
            const remainingSec = getRemainingSeconds(nowPK, currentIdx);
            const mins = Math.floor(remainingSec / 60);
            const secs = Math.floor(remainingSec % 60);
            timerMinutesEl.textContent = String(mins).padStart(2, '0');
            timerSecondsEl.textContent = String(secs).padStart(2, '0');

            // render schedule with states
            renderSchedule(states, currentIdx);
        }

        // ----- init -----
        function init() {
            updateUI();
            setInterval(updateUI, 1000);
        }

        document.addEventListener('DOMContentLoaded', init);
    })();
</script>
</body>
</html>
