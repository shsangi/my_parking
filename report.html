<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Receipts</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; padding: 12px 0; background: #eef1f5; color: #1a1a1a;
    font-size: 14px;
    overflow-x: hidden;
  }

  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 12px;
    gap: 12px;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 calc(100% - 24px);
    max-width: 480px;
    scroll-snap-align: center;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .page.highlight {
    border-color: #1e88e5;
    box-shadow: 0 6px 22px rgba(30,136,229,0.25);
  }
  .page.highlight.curr {
    border-color: #43a047;
    box-shadow: 0 6px 22px rgba(67,160,71,0.25);
  }

  /* Dots */
  .dots {
    display: flex; justify-content: center; gap: 6px;
    padding: 12px 0 4px;
    flex-wrap: wrap;
  }
  .dots .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #c8d0da; transition: all 0.2s;
  }
  .dots .dot.active {
    background: #1e88e5; width: 22px; border-radius: 4px;
  }
  .dots .dot.highlight { background: #66bb6a; }
  .dots .dot.highlight.active { background: #43a047; }

  /* Card */
  .rc-head {
    background: linear-gradient(135deg, #546e7a, #37474f);
    color: #fff; padding: 14px; text-align: center;
  }
  .page.highlight .rc-head {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
  }
  .page.highlight.curr .rc-head {
    background: linear-gradient(135deg, #43a047, #2e7d32);
  }
  .rc-head h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .rc-head p { margin: 3px 0 0; font-size: 12px; opacity: 0.9; }
  .rc-head .badge {
    display: inline-block; margin-top: 6px;
    font-size: 10px; font-weight: 700;
    padding: 2px 8px; border-radius: 10px;
    background: rgba(255,255,255,0.25);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* Person count */
  .counts {
    background: #f7f9fc; padding: 10px; text-align: center;
    border-bottom: 1px solid #e0e4ea;
  }
  .counts .num { font-size: 22px; font-weight: 800; line-height: 1; color: #1565c0; }
  .page.highlight.curr .counts .num { color: #2e7d32; }
  .counts .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  /* Header row */
  .months {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    background: #f7f9fc; border-bottom: 2px solid #e0e4ea;
    position: sticky; top: 0; z-index: 5;
    font-size: 11px; font-weight: 700;
  }
  .months .hd {
    padding: 9px 6px; text-align: center;
    border-right: 1px solid #e0e4ea;
    color: #666;
  }
  .months .hd:last-child { border-right: none; }
  .months .sr-h { color: #999; font-size: 11px; }

  .sec {
    padding: 6px 12px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    border-top: 1px solid #e0e4ea;
    border-bottom: 1px solid #e0e4ea;
  }
  .sec.ok   { background: #e8f5e9; color: #2e7d32; }
  .sec.warn { background: #fff3e0; color: #e65100; }

  .item {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    border-bottom: 1px dashed #e5e8ee;
    background: #fff;
  }
  .item > div {
    padding: 8px 7px; min-height: 46px;
    display: flex; flex-direction: column; justify-content: center;
    border-right: 1px solid #f0f2f6;
    overflow: hidden;
  }
  .item > div:last-child { border-right: none; }

  .sr-cell {
    font-size: 11px; font-weight: 700; color: #6b7280;
    text-align: center; background: #f4f6f9;
  }

  .name-line {
    display: flex; align-items: baseline; gap: 4px;
    font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden;
  }
  .name-line .nm { overflow: hidden; text-overflow: ellipsis; }
  .amt { font-size: 14px; font-weight: 700; margin-top: 2px; color: #1565c0; }

  .missing {
    color: #cbd0d8; font-style: italic; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Subtotal with month name + count */
  .total-row {
    display: grid;
    grid-template-columns: 34px 1fr;
    background: #f7f9fc; border-top: 2px solid #e0e4ea;
    font-weight: 700;
  }
  .total-row > div {
    padding: 12px 10px; text-align: center;
  }
  .total-row .sr-blank { background: #f4f6f9; }
  .total-row .mname {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: #1565c0;
  }
  .page.highlight.curr .total-row .mname { color: #2e7d32; }
  .total-row .val { font-size: 18px; margin-top: 3px; color: #1565c0; }
  .page.highlight.curr .total-row .val { color: #2e7d32; }
  .total-row .cnt { font-size: 11px; color: #777; font-weight: 500; margin-top: 2px; }

  /* Grand total bar */
  .grand {
    background: linear-gradient(135deg, #263238, #37474f);
    color: #fff; padding: 14px; text-align: center;
  }
  .grand .lbl { font-size: 10px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.6px; }
  .grand .val { font-size: 24px; font-weight: 800; margin-top: 4px; }

  .status { text-align: center; padding: 40px 20px; color: #777; font-size: 14px; }

  .legend {
    display: flex; justify-content: center; gap: 16px;
    font-size: 11px; color: #666; padding: 6px 0 0;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .chip { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<div id="status" class="status">Loading data…</div>

<div class="carousel" id="carousel" style="display:none;"></div>
<div class="dots" id="dots" style="display:none;"></div>
<div class="legend" id="legend" style="display:none;">
  <span><i class="chip" style="background:#43a047;"></i> Current Month</span>
  <span><i class="chip" style="background:#1e88e5;"></i> Previous Month</span>
  <span><i class="chip" style="background:#90a4ae;"></i> Older</span>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHEET1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREo2Dzmu7_NM9xgM_xdNzb1TqpgSTn_dj5bgJT2l7WEgzykoT5zNHTOFxrS7UMN08eb2VOLEnaCLV4/pub?output=csv";
const SHEET2_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1452200885";

const COL = {
  name:   ["name/item", "name", "item", "person", "party"],
  amount: ["amount", "amt", "value"],
  month:  ["month", "mnth"],
  year:   ["year", "yr"]
};

function parseCSV(text) {
  const rows = [];
  let cur = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(field); field = ""; }
      else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ""; }
      else if (c === '\r') { }
      else field += c;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function findCol(headers, names) {
  for (let i = 0; i < headers.length; i++) {
    const h = (headers[i] || "").trim().toLowerCase().replace(/\s+/g, " ");
    for (const n of names) if (h === n.toLowerCase()) return i;
  }
  return -1;
}

function normalizeRecords(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    name:   findCol(headers, COL.name),
    amount: findCol(headers, COL.amount),
    month:  findCol(headers, COL.month),
    year:   findCol(headers, COL.year)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = (r[idx.name] || "").trim();
    if (!name) continue;
    const amtRaw = (r[idx.amount] || "0").toString().replace(/[^0-9.\-]/g, "");
    out.push({
      name,
      amount: parseFloat(amtRaw) || 0,
      month:  idx.month >= 0 ? (r[idx.month] || "").trim() : "",
      year:   idx.year  >= 0 ? (r[idx.year]  || "").trim() : ""
    });
  }
  return out;
}

const MONTH_NUM = {
  jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4,
  may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8, sep:9, sept:9,
  september:9, oct:10, october:10, nov:11, november:11, dec:12, december:12
};
function monthKey(rec) {
  const m = MONTH_NUM[rec.month.toLowerCase()] || 0;
  const y = parseInt(rec.year) || 0;
  return y * 100 + m;
}

async function loadAll() {
  let all = [];
  for (const u of [SHEET1_CSV, SHEET2_CSV]) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      all = all.concat(normalizeRecords(parseCSV(txt)));
    } catch (e) { console.warn("Fetch failed:", u, e); }
  }
  return all;
}

function fmt(n) {
  const sign = n < 0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function nameKey(name) {
  return name.toLowerCase().replace(/[^a-z0-9]/g, "");
}

/* ============================================================
   BUILD ONE MONTH PAGE
   ============================================================ */
function buildMonthPage(monthRecords, monthLabel, highlightType) {
  /* highlightType: "curr" | "prev" | "none" */

  /* Group by name */
  const map = new Map();
  monthRecords.forEach(r => {
    const k = nameKey(r.name);
    if (!map.has(k)) map.set(k, { name: r.name, amount: 0 });
    map.get(k).amount += r.amount;
  });

  const entries = [...map.values()];
  const count = entries.length;
  const total = entries.reduce((s, e) => s + e.amount, 0);

  const page = document.createElement("div");
  page.className = "page";
  if (highlightType === "curr") page.classList.add("highlight", "curr");
  else if (highlightType === "prev") page.classList.add("highlight");

  /* Header */
  let badge = "";
  if (highlightType === "curr") badge = `<div class="badge">Current Month</div>`;
  else if (highlightType === "prev") badge = `<div class="badge">Previous Month</div>`;

  page.innerHTML = `
    <div class="rc-head">
      <h1>${esc(monthLabel)}</h1>
      <p>Monthly Receipt</p>
      ${badge}
    </div>
    <div class="counts">
      <div class="num">${count}</div>
      <div class="lbl">Total Persons</div>
    </div>
    <div class="months">
      <div class="hd sr-h">#</div>
      <div class="hd" style="grid-column: 2 / 4;">Name / Item &amp; Amount</div>
    </div>
  `;

  const body = document.createElement("div");

  if (!entries.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:30px;text-align:center;color:#999;font-size:13px;";
    empty.textContent = "No records for this month.";
    body.appendChild(empty);
  } else {
    entries.forEach((e, i) => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <div class="sr-cell">${i + 1}</div>
        <div class="m1-cell" style="grid-column: 2 / 4;">
          <div class="name-line"><span class="nm">${esc(e.name)}</span></div>
          <div class="amt">${fmt(e.amount)}</div>
        </div>
      `;
      body.appendChild(row);
    });
  }

  /* Subtotal with month name + count */
  const totals = document.createElement("div");
  totals.className = "total-row";
  totals.innerHTML = `
    <div class="sr-blank"></div>
    <div>
      <div class="mname">Subtotal — ${esc(monthLabel)}</div>
      <div class="val">${fmt(total)}</div>
      <div class="cnt">${count} person${count === 1 ? "" : "s"}</div>
    </div>
  `;
  body.appendChild(totals);

  /* Grand total bar */
  const grand = document.createElement("div");
  grand.className = "grand";
  grand.innerHTML = `
    <div class="lbl">Total — ${esc(monthLabel)}</div>
    <div class="val">${fmt(total)}</div>
  `;
  body.appendChild(grand);

  page.appendChild(body);
  return page;
}

/* ============================================================
   RENDER — one page per month, latest two highlighted
   ============================================================ */
function render(records) {
  const statusEl = document.getElementById("status");
  if (!records.length) {
    statusEl.textContent = "No data available. Please make sure the sheets are published as CSV.";
    return;
  }

  const keys = [...new Set(records.map(monthKey))].filter(k => k > 0).sort((a,b) => a-b);
  if (!keys.length) {
    statusEl.textContent = "No month data found.";
    return;
  }

  const limitedKeys = keys.slice(-12); // last 12 months max
  const currKey = limitedKeys[limitedKeys.length - 1];
  const prevKey = limitedKeys[limitedKeys.length - 2]; // may be undefined

  /* Bucket records by month */
  const byMonth = new Map();
  records.forEach(r => {
    const k = monthKey(r);
    if (!byMonth.has(k)) byMonth.set(k, []);
    byMonth.get(k).push(r);
  });

  const carousel = document.getElementById("carousel");
  const dotsEl = document.getElementById("dots");
  carousel.innerHTML = "";
  dotsEl.innerHTML = "";

  limitedKeys.forEach((k, idx) => {
    const recs = byMonth.get(k) || [];
    const label = recs.length ? `${recs[0].month} ${recs[0].year}`.trim() : String(k);

    let type = "none";
    if (k === currKey) type = "curr";
    else if (k === prevKey) type = "prev";

    carousel.appendChild(buildMonthPage(recs, label, type));

    const dot = document.createElement("div");
    dot.className = "dot";
    if (type === "curr" || type === "prev") dot.classList.add("highlight");
    if (idx === limitedKeys.length - 1) dot.classList.add("active");
    dot.dataset.idx = idx;
    dot.addEventListener("click", () => {
      const pageEl = carousel.querySelectorAll(".page")[idx];
      carousel.scrollTo({
        left: pageEl.offsetLeft - 12,
        behavior: "smooth"
      });
    });
    dotsEl.appendChild(dot);
  });

  /* Auto-scroll to the LAST (current) page on load */
  requestAnimationFrame(() => {
    const pages = carousel.querySelectorAll(".page");
    const lastPage = pages[pages.length - 1];
    if (lastPage) {
      carousel.scrollTo({
        left: lastPage.offsetLeft - 12,
        behavior: "auto"
      });
    }
  });

  /* Update dots on scroll */
  carousel.addEventListener("scroll", () => {
    const pages = carousel.querySelectorAll(".page");
    if (!pages.length) return;
    const carouselLeft = carousel.scrollLeft;
    let bestIdx = 0, bestDist = Infinity;
    pages.forEach((p, i) => {
      const d = Math.abs(p.offsetLeft - 12 - carouselLeft);
      if (d < bestDist) { bestDist = d; bestIdx = i; }
    });
    dotsEl.querySelectorAll(".dot").forEach((d, i) => {
      d.classList.toggle("active", i === bestIdx);
    });
  }, { passive: true });

  statusEl.style.display = "none";
  carousel.style.display = "flex";
  dotsEl.style.display = "flex";
  document.getElementById("legend").style.display = "flex";
}

loadAll().then(render).catch(e => {
  document.getElementById("status").textContent = "Error: " + e.message;
  console.error(e);
});
</script>
</body>
</html>
