<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Comparison Receipt</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; padding: 12px; background: #eef1f5; color: #1a1a1a;
    font-size: 14px;
  }

  .receipt {
    max-width: 480px; margin: 0 auto;
    background: #fff; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* Header */
  .rc-head {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff; padding: 16px; text-align: center;
  }
  .rc-head h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.3px; }
  .rc-head p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }

  /* Person count summary */
  .counts {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #f7f9fc; border-bottom: 1px solid #e0e4ea;
  }
  .counts > div {
    padding: 10px 8px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .counts > div:last-child { border-right: none; }
  .counts .num { font-size: 20px; font-weight: 800; line-height: 1.1; }
  .counts .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .counts .c1 { color: #1565c0; }
  .counts .c2 { color: #2e7d32; }

  /* Month headers (sticky top) */
  .months {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #f7f9fc; border-bottom: 2px solid #e0e4ea;
    position: sticky; top: 0; z-index: 5;
  }
  .months div {
    padding: 10px 8px; text-align: center;
    font-weight: 700; font-size: 13px;
    border-right: 1px solid #e0e4ea;
  }
  .months div:last-child { border-right: none; }
  .months .m1 { color: #1565c0; }
  .months .m2 { color: #2e7d32; }

  /* Section divider */
  .sec {
    background: #eef1f5; padding: 6px 12px;
    font-size: 11px; font-weight: 700; color: #666;
    text-transform: uppercase; letter-spacing: 0.6px;
    border-top: 1px solid #e0e4ea;
    border-bottom: 1px solid #e0e4ea;
  }
  .sec.ok  { background: #e8f5e9; color: #2e7d32; }
  .sec.warn{ background: #fff3e0; color: #e65100; }

  /* Item row */
  .item {
    display: grid; grid-template-columns: 1fr 1fr;
    border-bottom: 1px dashed #e5e8ee;
  }
  .item > div {
    padding: 9px 10px; min-height: 50px;
    display: flex; flex-direction: column; justify-content: center;
    border-right: 1px solid #f0f2f6;
    overflow: hidden;
  }
  .item > div:last-child { border-right: none; }

  .name-line {
    display: flex; align-items: baseline; gap: 5px;
    font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .name-line .nm { overflow: hidden; text-overflow: ellipsis; }
  .amt { font-size: 15px; font-weight: 700; margin-top: 3px; }
  .m1 .amt { color: #1565c0; }
  .m2 .amt { color: #2e7d32; }

  .missing {
    color: #b0b8c4; font-style: italic; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Diff badge on matched row */
  .diff-badge {
    font-size: 10px; font-weight: 700;
    padding: 1px 5px; border-radius: 4px; margin-left: auto;
    flex-shrink: 0;
  }
  .diff-badge.up { background: #e8f5e9; color: #2e7d32; }
  .diff-badge.down { background: #ffebee; color: #c62828; }
  .diff-badge.same { background: #f0f2f6; color: #666; }

  /* Totals */
  .total-row {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #f7f9fc; border-top: 2px solid #e0e4ea;
    font-weight: 700;
  }
  .total-row > div {
    padding: 12px 10px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .total-row > div:last-child { border-right: none; }
  .total-row .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
  .total-row .val { font-size: 16px; margin-top: 3px; }
  .total-row .v1 { color: #1565c0; }
  .total-row .v2 { color: #2e7d32; }

  /* Grand total */
  .grand {
    background: linear-gradient(135deg, #263238, #37474f);
    color: #fff; padding: 16px; text-align: center;
  }
  .grand .lbl { font-size: 11px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.6px; }
  .grand .val { font-size: 26px; font-weight: 800; margin-top: 4px; letter-spacing: 0.5px; }
  .grand .cnt { font-size: 11px; opacity: 0.85; margin-top: 6px; }

  /* Difference pill */
  .diffbar {
    margin: 10px 12px 14px; padding: 10px 14px;
    border-radius: 10px; display: flex;
    justify-content: space-between; align-items: center;
    font-weight: 700; font-size: 14px;
  }
  .diffbar.pos { background: #e8f5e9; color: #2e7d32; }
  .diffbar.neg { background: #ffebee; color: #c62828; }
  .diffbar.zero { background: #f0f2f6; color: #555; }

  .status { text-align: center; padding: 40px 20px; color: #777; font-size: 14px; }
</style>
</head>
<body>

<div class="receipt" id="receipt" style="display:none;">
  <div class="rc-head">
    <h1>Monthly Comparison</h1>
    <p id="subtitle">Last two months</p>
  </div>

  <div class="counts">
    <div>
      <div class="num c1" id="cnt1">0</div>
      <div class="lbl">Persons (Month 1)</div>
    </div>
    <div>
      <div class="num c2" id="cnt2">0</div>
      <div class="lbl">Persons (Month 2)</div>
    </div>
  </div>

  <div class="months">
    <div class="m1" id="h1">—</div>
    <div class="m2" id="h2">—</div>
  </div>

  <div id="body"></div>

  <div class="diffbar" id="diffbar">—</div>
</div>

<div class="status" id="status">Loading data…</div>

<script>
/* ============================================================
   CONFIG — paste your CSV export URLs here
   ============================================================ */
const SHEET1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREo2Dzmu7_NM9xgM_xdNzb1TqpgSTn_dj5bgJT2l7WEgzykoT5zNHTOFxrS7UMN08eb2VOLEnaCLV4/pub?output=csv";
const SHEET2_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1452200885";

/* Column header aliases */
const COL = {
  name:   ["name/item", "name", "item", "person", "party"],
  amount: ["amount", "amt", "value"],
  month:  ["month", "mnth"],
  year:   ["year", "yr"]
};

/* ============================================================
   CSV PARSER
   ============================================================ */
function parseCSV(text) {
  const rows = [];
  let cur = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(field); field = ""; }
      else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ""; }
      else if (c === '\r') { /* skip */ }
      else field += c;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function findCol(headers, names) {
  for (let i = 0; i < headers.length; i++) {
    const h = (headers[i] || "").trim().toLowerCase().replace(/\s+/g, " ");
    for (const n of names) if (h === n.toLowerCase()) return i;
  }
  return -1;
}

function normalizeRecords(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    name:   findCol(headers, COL.name),
    amount: findCol(headers, COL.amount),
    month:  findCol(headers, COL.month),
    year:   findCol(headers, COL.year)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = (r[idx.name] || "").trim();
    if (!name) continue;
    const amtRaw = (r[idx.amount] || "0").toString().replace(/[^0-9.\-]/g, "");
    out.push({
      name,
      amount: parseFloat(amtRaw) || 0,
      month:  idx.month >= 0 ? (r[idx.month] || "").trim() : "",
      year:   idx.year  >= 0 ? (r[idx.year]  || "").trim() : ""
    });
  }
  return out;
}

/* ============================================================
   MONTH HELPERS
   ============================================================ */
const MONTH_NUM = {
  jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4,
  may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8, sep:9, sept:9,
  september:9, oct:10, october:10, nov:11, november:11, dec:12, december:12
};
function monthKey(rec) {
  const m = MONTH_NUM[rec.month.toLowerCase()] || 0;
  const y = parseInt(rec.year) || 0;
  return y * 100 + m;
}
function monthLabel(rec) {
  if (!rec) return "—";
  return `${rec.month} ${rec.year}`.trim();
}
function nameKey(name) {
  return name.toLowerCase().replace(/[^a-z0-9]/g, "");
}

/* ============================================================
   LOAD + RENDER
   ============================================================ */
async function loadAll() {
  let all = [];
  for (const u of [SHEET1_CSV, SHEET2_CSV]) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      all = all.concat(normalizeRecords(parseCSV(txt)));
    } catch (e) {
      console.warn("Fetch failed:", u, e);
    }
  }
  return all;
}

function fmt(n) {
  const sign = n < 0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function render(records) {
  const statusEl = document.getElementById("status");
  if (!records.length) {
    statusEl.textContent = "No data available. Please make sure the sheets are published as CSV.";
    return;
  }

  const keys = [...new Set(records.map(monthKey))].filter(k => k > 0).sort((a,b) => a-b);
  if (keys.length < 2) {
    statusEl.textContent = "Need at least two months of data to compare.";
    return;
  }
  const kPrev = keys[keys.length - 2];
  const kCurr = keys[keys.length - 1];

  const prevRecs = records.filter(r => monthKey(r) === kPrev);
  const currRecs = records.filter(r => monthKey(r) === kCurr);

  document.getElementById("h1").textContent = monthLabel(prevRecs[0]);
  document.getElementById("h2").textContent = monthLabel(currRecs[0]);

  /* Group by name, sum amounts */
  const mapPrev = new Map();
  prevRecs.forEach(r => {
    const k = nameKey(r.name);
    if (!mapPrev.has(k)) mapPrev.set(k, { name: r.name, amount: 0 });
    mapPrev.get(k).amount += r.amount;
  });
  const mapCurr = new Map();
  currRecs.forEach(r => {
    const k = nameKey(r.name);
    if (!mapCurr.has(k)) mapCurr.set(k, { name: r.name, amount: 0 });
    mapCurr.get(k).amount += r.amount;
  });

  /* Person counts */
  const cntPrev = mapPrev.size;
  const cntCurr = mapCurr.size;

  /* Order: matched first, then unmatched */
  const matchedKeys = [];
  const onlyPrev    = [];
  const onlyCurr    = [];
  const seen = new Set();

  mapPrev.forEach((v, k) => {
    if (seen.has(k)) return;
    seen.add(k);
    if (mapCurr.has(k)) matchedKeys.push(k);
    else onlyPrev.push(k);
  });
  mapCurr.forEach((v, k) => {
    if (seen.has(k)) return;
    seen.add(k);
    onlyCurr.push(k);
  });

  /* Build HTML */
  const body = document.getElementById("body");
  body.innerHTML = "";

  let subPrev = 0, subCurr = 0;

  const buildRow = (p, c, showDiff) => {
    const left = p
      ? `<div class="m1">
           <div class="name-line"><span class="nm">${esc(p.name)}</span></div>
           <div class="amt">${fmt(p.amount)}</div>
         </div>`
      : `<div class="m1"><div class="missing">— not present —</div></div>`;

    let rightName = "";
    if (c) {
      let badge = "";
      if (showDiff && p) {
        const d = c.amount - p.amount;
        if (Math.abs(d) < 0.005) badge = `<span class="diff-badge same">same</span>`;
        else if (d > 0)           badge = `<span class="diff-badge up">▲ ${fmt(d)}</span>`;
        else                      badge = `<span class="diff-badge down">▼ ${fmt(Math.abs(d))}</span>`;
      }
      rightName = `<div class="name-line"><span class="nm">${esc(c.name)}</span>${badge}</div>`;
    }

    const right = c
      ? `<div class="m2">${rightName}<div class="amt">${fmt(c.amount)}</div></div>`
      : `<div class="m2"><div class="missing">— not present —</div></div>`;

    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = left + right;
    return row;
  };

  /* Matched */
  if (matchedKeys.length) {
    const sec = document.createElement("div");
    sec.className = "sec ok";
    sec.textContent = `✓ Matched Persons (${matchedKeys.length})`;
    body.appendChild(sec);
    matchedKeys.forEach(k => {
      const p = mapPrev.get(k), c = mapCurr.get(k);
      subPrev += p.amount;
      subCurr += c.amount;
      body.appendChild(buildRow(p, c, true));
    });
  }

  /* Unmatched */
  if (onlyPrev.length || onlyCurr.length) {
    const sec = document.createElement("div");
    sec.className = "sec warn";
    sec.textContent = `⚠ Unmatched Persons (${onlyPrev.length + onlyCurr.length})`;
    body.appendChild(sec);
    const allUnmatched = [...onlyPrev, ...onlyCurr];
    allUnmatched.forEach(k => {
      const p = mapPrev.get(k) || null;
      const c = mapCurr.get(k) || null;
      if (p) subPrev += p.amount;
      if (c) subCurr += c.amount;
      body.appendChild(buildRow(p, c, false));
    });
  }

  /* Subtotal row */
  const totals = document.createElement("div");
  totals.className = "total-row";
  totals.innerHTML = `
    <div><div class="lbl">Subtotal</div><div class="val v1">${fmt(subPrev)}</div></div>
    <div><div class="lbl">Subtotal</div><div class="val v2">${fmt(subCurr)}</div></div>
  `;
  body.appendChild(totals);

  /* Grand total */
  const grand = document.createElement("div");
  grand.className = "grand";
  grand.innerHTML = `
    <div class="lbl">Grand Total (Both Months)</div>
    <div class="val">${fmt(subPrev + subCurr)}</div>
    <div class="cnt">Matched: ${matchedKeys.length} &nbsp;•&nbsp; Only Month 1: ${onlyPrev.length} &nbsp;•&nbsp; Only Month 2: ${onlyCurr.length}</div>
  `;
  body.appendChild(grand);

  /* Difference bar */
  const diff = subCurr - subPrev;
  const diffEl = document.getElementById("diffbar");
  diffEl.className = "diffbar " + (diff > 0 ? "pos" : diff < 0 ? "neg" : "zero");
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "=";
  const sign  = diff > 0 ? "+" : "";
  diffEl.innerHTML = `
    <span>Monthly Difference</span>
    <span>${arrow} ${sign}${fmt(diff)}</span>
  `;

  /* Counts header */
  document.getElementById("cnt1").textContent = cntPrev;
  document.getElementById("cnt2").textContent = cntCurr;

  statusEl.style.display = "none";
  document.getElementById("receipt").style.display = "block";
  document.getElementById("subtitle").textContent =
    `${monthLabel(prevRecs[0])}  vs  ${monthLabel(currRecs[0])}`;
}

loadAll()
  .then(render)
  .catch(e => {
    document.getElementById("status").textContent = "Error: " + e.message;
    console.error(e);
  });
</script>
</body>
</html>
