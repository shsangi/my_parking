<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Reports</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; padding: 12px 0 20px; background: #eef1f5; color: #1a1a1a;
    font-size: 14px;
    overflow-x: hidden;
  }

  .tab-bar {
    max-width: 480px; margin: 0 auto 12px;
    background: #fff; border-radius: 12px;
    padding: 6px; display: flex; gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .tab-bar button {
    flex: 1; padding: 10px 6px; border: none;
    background: transparent; color: #666;
    font-size: 12.5px; font-weight: 600;
    border-radius: 8px; cursor: pointer;
    font-family: inherit; transition: all 0.18s;
    white-space: nowrap;
  }
  .tab-bar button.active {
    background: #1e88e5; color: #fff;
    box-shadow: 0 2px 6px rgba(30,136,229,0.4);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .carousel {
    display: flex; overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 12px; gap: 12px;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 calc(100% - 24px);
    max-width: 480px; scroll-snap-align: center;
    background: #fff; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .rc-head {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff; padding: 14px; text-align: center;
  }
  .rc-head h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .rc-head p { margin: 3px 0 0; font-size: 12px; opacity: 0.9; }

  .counts {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #f7f9fc; border-bottom: 1px solid #e0e4ea;
  }
  .counts > div {
    padding: 10px 8px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .counts > div:last-child { border-right: none; }
  .counts .num { font-size: 20px; font-weight: 800; line-height: 1.1; }
  .counts .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .counts .c1 { color: #1565c0; }
  .counts .c2 { color: #2e7d32; }

  .months {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    background: #f7f9fc; border-bottom: 2px solid #e0e4ea;
    font-size: 12px; font-weight: 700;
  }
  .months .hd {
    padding: 9px 6px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .months .hd:last-child { border-right: none; }
  .months .m1 { color: #1565c0; }
  .months .m2 { color: #2e7d32; }
  .months .sr-h { color: #999; font-size: 11px; }

  .sec {
    padding: 6px 12px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    border-top: 1px solid #e0e4ea;
    border-bottom: 1px solid #e0e4ea;
  }
  .sec.ok   { background: #e8f5e9; color: #2e7d32; }
  .sec.warn { background: #fff3e0; color: #e65100; }

  .item {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    border-bottom: 1px dashed #e5e8ee;
    background: #fff;
  }
  .item > div {
    padding: 8px 7px; min-height: 46px;
    display: flex; flex-direction: column; justify-content: center;
    border-right: 1px solid #f0f2f6;
    overflow: hidden;
  }
  .item > div:last-child { border-right: none; }

  .sr-cell {
    font-size: 11px; font-weight: 700; color: #6b7280;
    text-align: center; background: #f4f6f9;
  }

  .name-line {
    display: flex; align-items: baseline; gap: 4px;
    font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden;
  }
  .name-line .nm { overflow: hidden; text-overflow: ellipsis; }
  .amt { font-size: 14px; font-weight: 700; margin-top: 2px; }
  .m1-cell .amt { color: #1565c0; }
  .m2-cell .amt { color: #2e7d32; }

  .missing {
    color: #cbd0d8; font-style: italic; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }

  .diff-badge {
    font-size: 9px; font-weight: 700;
    padding: 1px 4px; border-radius: 4px; margin-left: auto;
    flex-shrink: 0;
  }
  .diff-badge.up { background: #e8f5e9; color: #2e7d32; }
  .diff-badge.down { background: #ffebee; color: #c62828; }
  .diff-badge.same { background: #f0f2f6; color: #666; }

  .total-row {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    background: #f7f9fc; border-top: 2px solid #e0e4ea;
    font-weight: 700;
  }
  .total-row > div {
    padding: 10px 6px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .total-row > div:last-child { border-right: none; }
  .total-row .mname {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .total-row .mname.v1 { color: #1565c0; }
  .total-row .mname.v2 { color: #2e7d32; }
  .total-row .val { font-size: 15px; margin-top: 3px; }
  .total-row .val.v1 { color: #1565c0; }
  .total-row .val.v2 { color: #2e7d32; }
  .total-row .cnt { font-size: 10px; color: #777; font-weight: 500; margin-top: 2px; }
  .total-row .sr-blank { background: #f4f6f9; }

  .grand {
    background: linear-gradient(135deg, #263238, #37474f);
    color: #fff; padding: 14px; text-align: center;
  }
  .grand .lbl { font-size: 11px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.6px; }
  .grand .val { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .grand .cnt { font-size: 11px; opacity: 0.85; margin-top: 6px; }

  .diffbar {
    margin: 10px 12px 14px; padding: 10px 14px;
    border-radius: 10px; display: flex;
    justify-content: space-between; align-items: center;
    font-weight: 700; font-size: 14px;
  }
  .diffbar.pos { background: #e8f5e9; color: #2e7d32; }
  .diffbar.neg { background: #ffebee; color: #c62828; }
  .diffbar.zero { background: #f0f2f6; color: #555; }

  /* ---- Sheet total strips in Last 2 Months ---- */
  .sheet-totals-wrap {
    padding: 10px 12px 14px;
    background: #f7f9fc;
    border-top: 2px solid #e0e4ea;
  }
  .sheet-totals-title {
    font-size: 10px;
    color: #6a1b9a;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 800;
    margin-bottom: 8px;
    text-align: center;
  }
  .sheet-totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .sheet-total-cell {
    background: linear-gradient(135deg, #f3e5f5 0%, #ede7f6 100%);
    border-radius: 8px;
    padding: 10px;
    border-left: 3px solid #8e24aa;
    text-align: center;
  }
  .sheet-total-cell .st-month {
    font-size: 11px;
    color: #6a1b9a;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 800;
  }
  .sheet-total-cell .st-val {
    font-size: 17px;
    font-weight: 800;
    color: #6a1b9a;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .sheet-total-cell .st-sub {
    font-size: 10px;
    color: #8e24aa;
    font-weight: 600;
    margin-top: 3px;
  }

  .table-wrap {
    max-width: 100%; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 12px 12px;
  }
  .table-wrap::-webkit-scrollbar { height: 6px; }
  .table-wrap::-webkit-scrollbar-thumb { background: #c8d0da; border-radius: 3px; }

  .mtable {
    display: inline-grid; grid-auto-flow: column;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    background: #fff; min-width: 100%;
  }

  .mcol {
    display: flex; flex-direction: column;
    border-right: 1px solid #e0e4ea;
    min-width: 140px; max-width: 140px;
  }
  .mcol:last-child { border-right: none; }

  .mcol-head {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff; padding: 10px 8px; text-align: center;
    font-weight: 700; font-size: 13px;
  }
  .mcol:nth-child(even) .mcol-head {
    background: linear-gradient(135deg, #43a047, #2e7d32);
  }
  .mcol-head .mname { font-size: 13px; }
  .mcol-head .mcount {
    font-size: 10px; opacity: 0.9; margin-top: 3px; font-weight: 500;
  }
  .mcol-body { flex: 1; }

  .mrow {
    display: flex; flex-direction: column;
    padding: 7px 9px; border-bottom: 1px dashed #e5e8ee;
    min-height: 50px; justify-content: center;
  }
  .mrow .top {
    display: flex; align-items: center; gap: 5px;
    font-weight: 600; font-size: 12.5px;
    white-space: nowrap; overflow: hidden;
  }
  .mrow .top .srn {
    font-size: 10px; color: #9aa3af; font-weight: 700;
    background: #f0f2f6; padding: 1px 5px; border-radius: 4px;
    flex-shrink: 0;
  }
  .mrow .top .nm { overflow: hidden; text-overflow: ellipsis; }
  .mrow .amt { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .mcol:nth-child(odd) .mrow .amt { color: #1565c0; }
  .mcol:nth-child(even) .mrow .amt { color: #2e7d32; }

  .mcol-total {
    background: #f7f9fc; border-top: 2px solid #e0e4ea;
    padding: 10px 8px; text-align: center;
  }
  .mcol-total .lbl {
    font-size: 10px; color: #666; text-transform: uppercase;
    letter-spacing: 0.4px; font-weight: 700;
  }
  .mcol-total .val { font-size: 15px; font-weight: 800; margin-top: 3px; }
  .mcol:nth-child(odd) .mcol-total .val { color: #1565c0; }
  .mcol:nth-child(even) .mcol-total .val { color: #2e7d32; }
  .mcol-total .cnt { font-size: 10px; color: #777; font-weight: 500; margin-top: 2px; }

  .mcol-grand {
    display: flex; flex-direction: column;
    min-width: 150px; max-width: 150px;
    background: #263238; color: #fff;
    border-left: 3px solid #ffb300;
  }
  .mcol-grand .mcol-head { background: linear-gradient(135deg, #ffa726, #ef6c00); }
  .mcol-grand .mcol-body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 14px 10px; text-align: center; flex: 1;
  }
  .mcol-grand .big-lbl { font-size: 10px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
  .mcol-grand .big-val { font-size: 20px; font-weight: 800; margin-top: 6px; color: #ffd54f; }
  .mcol-grand .sub { font-size: 10px; opacity: 0.85; margin-top: 8px; }
  .mcol-grand .divider { height: 1px; background: rgba(255,255,255,0.2); margin: 10px 0; }
  .mcol-grand .avg-lbl { font-size: 9px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
  .mcol-grand .avg-val { font-size: 13px; font-weight: 700; margin-top: 3px; }
  .mcol-grand .mcol-total { background: #1a232a; border-top: 2px solid #ffb300; }
  .mcol-grand .mcol-total .val { color: #ffd54f; }

  /* ============ REPORT ============ */
  .report-wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 12px 20px;
  }

  .overall-card {
    background: linear-gradient(180deg, #eef1f6 0%, #e3e8ef 100%);
    border-radius: 16px;
    padding: 4px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.10);
    margin-bottom: 18px;
  }
  .oc-inner {
    background: #f8fafc;
    border-radius: 12px;
    padding: 20px 18px 18px;
    border: 1px solid #e5eaf1;
  }
  .oc-title {
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    color: #1e3a5f;
    line-height: 1.2;
    margin-bottom: 18px;
    letter-spacing: -0.3px;
  }
  .oc-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .oc-table tr { border-bottom: 1px solid #e2e8f0; }
  .oc-table tr:last-child { border-bottom: none; }
  .oc-table td { padding: 12px 2px; vertical-align: middle; }
  .oc-table td.metric {
    font-weight: 700; color: #1e3a5f;
    width: 45%; font-size: 15px; line-height: 1.25;
  }
  .oc-table td.detail {
    color: #1f2937; font-weight: 600;
    text-align: left; font-size: 15px;
  }
  .oc-table td.detail.highlight {
    font-weight: 800; color: #0d47a1; font-size: 16px;
  }

  /* NEW: Combined row inside overall card */
  .oc-row-combined {
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 8px -18px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-left: 4px solid #2e7d32;
  }
  .oc-row-combined .cb-k {
    font-size: 13px;
    font-weight: 800;
    color: #1b5e20;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .oc-row-combined .cb-sub {
    font-size: 10px;
    color: #2e7d32;
    font-weight: 600;
    margin-top: 2px;
  }
  .oc-row-combined .cb-v {
    font-size: 20px;
    font-weight: 800;
    color: #1b5e20;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .section-label {
    font-size: 12px;
    font-weight: 800;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 14px 4px 10px;
  }
  .section-label:first-child { padding-top: 0; }

  .month-list, .period-list {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.07);
    overflow: hidden;
    border: 1px solid #eef1f5;
    margin-bottom: 6px;
  }

  .month-row, .period-row {
    padding: 12px 14px;
    border-bottom: 1px solid #eef1f5;
    display: grid;
    grid-template-columns: 26px 1fr;
    gap: 10px;
    align-items: start;
  }
  .month-row:last-child, .period-row:last-child { border-bottom: none; }

  .month-row.current {
    background: linear-gradient(180deg, #fff8e1 0%, #fffdf7 100%);
    border-left: 3px solid #ffa726;
  }

  .row-sr {
    font-size: 12px;
    font-weight: 800;
    color: #94a3b8;
    text-align: center;
    background: #f1f5f9;
    border-radius: 6px;
    padding: 3px 0;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .mr-head, .pr-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .mr-title {
    font-size: 14px;
    font-weight: 800;
    color: #1e3a5f;
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .mr-badge {
    background: #ffa726;
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 8px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }
  .mr-range {
    font-size: 11px;
    color: #64748b;
    font-weight: 600;
    margin-top: 2px;
  }

  .pr-range {
    font-size: 13px;
    font-weight: 700;
    color: #1e3a5f;
    line-height: 1.3;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .mr-days, .pr-days {
    background: #e3f2fd;
    color: #0d47a1;
    padding: 3px 9px;
    border-radius: 10px;
    font-size: 10.5px;
    font-weight: 800;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .mr-metrics, .pr-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }
  .mr-metric, .pr-metric {
    text-align: center;
    padding: 6px 2px;
    border-radius: 8px;
    background: #f8fafc;
    min-width: 0;
  }
  .mr-metric .lbl, .pr-metric .lbl {
    font-size: 9px;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mr-metric .val, .pr-metric .val {
    font-size: 12.5px;
    font-weight: 800;
    margin-top: 3px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .mr-metric.credit .val, .pr-metric.credit .val { color: #2e7d32; }
  .mr-metric.exp .val, .pr-metric.exp .val       { color: #c62828; }
  .mr-metric.gross .val, .pr-metric.gross .val   { color: #1565c0; }
  .mr-metric.avg, .pr-metric.avg                 { background: #e8f0fe; }
  .mr-metric.avg .val, .pr-metric.avg .val       { color: #0d47a1; }

  .mr-sheet-strip {
    margin-top: 8px;
    padding: 8px 10px;
    background: linear-gradient(135deg, #f3e5f5 0%, #ede7f6 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-left: 3px solid #8e24aa;
  }
  .mr-sheet-strip .sheet-lbl {
    font-size: 10px;
    color: #6a1b9a;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 800;
  }
  .mr-sheet-strip .sheet-sub {
    font-size: 9px;
    color: #8e24aa;
    font-weight: 600;
    margin-top: 1px;
  }
  .mr-sheet-strip .sheet-val {
    font-size: 15px;
    font-weight: 800;
    color: #6a1b9a;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .mr-sheet-strip .sheet-cnt {
    font-size: 10px;
    color: #8e24aa;
    font-weight: 600;
    text-align: right;
    margin-top: 1px;
  }

  .mr-combined-strip {
    margin-top: 6px;
    padding: 10px 12px;
    background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    border-left: 3px solid #2e7d32;
  }
  .mr-combined-strip .c-lbl {
    font-size: 10px;
    color: #1b5e20;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 800;
  }
  .mr-combined-strip .c-sub {
    font-size: 9px;
    color: #2e7d32;
    font-weight: 600;
    margin-top: 2px;
  }
  .mr-combined-strip .c-val {
    font-size: 17px;
    font-weight: 800;
    color: #1b5e20;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .daily-section-title {
    font-size: 13px; font-weight: 700; color: #263238;
    padding: 12px 4px 10px;
    letter-spacing: 0.3px;
    display: flex; align-items: center; gap: 8px;
  }
  .daily-section-title::before {
    content: ''; width: 4px; height: 16px;
    background: #1e88e5; border-radius: 2px;
  }

  .table-scroll {
    max-width: 100%; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    background: #fff;
  }
  .table-scroll::-webkit-scrollbar { height: 6px; }
  .table-scroll::-webkit-scrollbar-thumb { background: #c8d0da; border-radius: 3px; }

  .data-table {
    width: 100%; min-width: 620px;
    border-collapse: collapse; font-size: 13px;
  }
  .data-table thead th {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff; padding: 12px 10px;
    text-align: left; font-weight: 700;
    font-size: 12px; letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .data-table thead th.num { text-align: right; }
  .data-table tbody td {
    padding: 10px;
    border-bottom: 1px solid #eef1f5;
    white-space: nowrap;
  }
  .data-table tbody td.num {
    text-align: right; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .data-table tbody td.date { color: #555; font-size: 12px; }
  .data-table tbody tr:nth-child(even) { background: #fafbfd; }
  .data-table td.gross { color: #1565c0; }
  .data-table td.exp   { color: #c62828; }

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHEET1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREo2Dzmu7_NM9xgM_xdNzb1TqpgSTn_dj5bgJT2l7WEgzykoT5zNHTOFxrS7UMN08eb2VOLEnaCLV4/pub?output=csv";
const SHEET2_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1452200885";
const SHEET_DAILY_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1810247989";

const COL = {
  name:   ["name/item", "name", "item", "person", "party"],
  amount: ["amount", "amt", "value"],
  month:  ["month", "mnth"],
  year:   ["year", "yr"]
};

const DAILY_COL = {
  startDate: ["start date", "startdate", "from", "from date"],
  endDate:   ["end date", "enddate", "to", "to date"],
  gross:     ["total gross amount (pkr)", "total gross amount", "gross amount", "gross"],
  expenses:  ["total expenses (pkr)", "total expenses", "expenses", "expense"],
  net:       ["total net amount credited (pkr)", "total net amount credited", "net amount credited", "net amount", "net"]
};

/* ============================================================
   CSV UTIL
   ============================================================ */
function parseCSV(text) {
  const rows = [];
  let cur = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(field); field = ""; }
      else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ""; }
      else if (c === '\r') { }
      else field += c;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function findCol(headers, names) {
  for (let i = 0; i < headers.length; i++) {
    const h = (headers[i] || "").trim().toLowerCase().replace(/\s+/g, " ");
    for (const n of names) if (h === n.toLowerCase()) return i;
  }
  return -1;
}

function normalizeRecords(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    name:   findCol(headers, COL.name),
    amount: findCol(headers, COL.amount),
    month:  findCol(headers, COL.month),
    year:   findCol(headers, COL.year)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = (r[idx.name] || "").trim();
    if (!name) continue;
    const amtRaw = (r[idx.amount] || "0").toString().replace(/[^0-9.\-]/g, "");
    out.push({
      name,
      amount: parseFloat(amtRaw) || 0,
      month:  idx.month >= 0 ? (r[idx.month] || "").trim() : "",
      year:   idx.year  >= 0 ? (r[idx.year]  || "").trim() : ""
    });
  }
  return out;
}

function normalizeDaily(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    startDate: findCol(headers, DAILY_COL.startDate),
    endDate:   findCol(headers, DAILY_COL.endDate),
    gross:     findCol(headers, DAILY_COL.gross),
    expenses:  findCol(headers, DAILY_COL.expenses),
    net:       findCol(headers, DAILY_COL.net)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r.some(c => (c || "").trim() !== "")) continue;

    const startDate = idx.startDate >= 0 ? (r[idx.startDate] || "").trim() : "";
    const endDate   = idx.endDate   >= 0 ? (r[idx.endDate]   || "").trim() : "";
    const gross     = idx.gross     >= 0 ? parseNum(r[idx.gross])     : 0;
    const expenses  = idx.expenses  >= 0 ? parseNum(r[idx.expenses])  : 0;
    const net       = idx.net       >= 0 ? parseNum(r[idx.net])       : 0;

    if (!startDate && !endDate && !gross && !expenses && !net) continue;

    out.push({ startDate, endDate, gross, expenses, net });
  }
  return out;
}

function parseNum(v) {
  if (v == null) return 0;
  const s = v.toString().replace(/[^0-9.\-]/g, "");
  return parseFloat(s) || 0;
}

/* ============================================================
   HELPERS
   ============================================================ */
const MONTH_NUM = {
  jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4,
  may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8, sep:9, sept:9,
  september:9, oct:10, october:10, nov:11, november:11, dec:12, december:12
};
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_LONG  = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function monthKey(rec) {
  const m = MONTH_NUM[rec.month.toLowerCase()] || 0;
  const y = parseInt(rec.year) || 0;
  return y * 100 + m;
}
function monthLabel(rec) {
  if (!rec) return "—";
  return `${rec.month} ${rec.year}`.trim();
}
function nameKey(name) { return name.toLowerCase().replace(/[^a-z0-9]/g, ""); }
function groupByName(recs) {
  const m = new Map();
  recs.forEach(r => {
    const k = nameKey(r.name);
    if (!m.has(k)) m.set(k, { name: r.name, amount: 0 });
    m.get(k).amount += r.amount;
  });
  return m;
}
function fmt(n) {
  const sign = n < 0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function fmtInt(n) { return Math.round(n).toLocaleString(); }
function fmtDec2(n) {
  return n.toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ============================================================
   DATE PARSING
   ============================================================ */
function parseDateParts(s) {
  if (!s) return null;
  const str = s.toString().trim();
  if (!str) return null;

  let m = str.match(/^([A-Za-z]+)\s+(\d{1,2})(?:,)?\s+(\d{4})$/);
  if (m) {
    const mo = MONTH_NUM[m[1].toLowerCase()];
    if (mo) return { y: +m[3], m: mo, d: +m[2] };
  }
  m = str.match(/^(\d{1,2})\s+([A-Za-z]+)(?:,)?\s+(\d{4})$/);
  if (m) {
    const mo = MONTH_NUM[m[2].toLowerCase()];
    if (mo) return { y: +m[3], m: mo, d: +m[1] };
  }
  m = str.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return { y: +m[1], m: +m[2], d: +m[3] };

  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3];
    if (y < 100) y += 2000;
    if (a > 12) return { y, m: b, d: a };
    if (b > 12) return { y, m: a, d: b };
    return { y, m: b, d: a };
  }
  const t = Date.parse(str);
  if (!isNaN(t)) {
    const dt = new Date(t);
    return { y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate() };
  }
  return null;
}

function dateKeyOf(p) { return p ? (p.y * 10000 + p.m * 100 + p.d) : 0; }
function dateCmp(a, b) { return dateKeyOf(a) - dateKeyOf(b); }

function daysBetween(p1, p2) {
  if (!p1 || !p2) return 0;
  const d1 = new Date(p1.y, p1.m - 1, p1.d);
  const d2 = new Date(p2.y, p2.m - 1, p2.d);
  const diff = Math.round((d2 - d1) / 86400000) + 1;
  return diff > 0 ? diff : 0;
}
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function fmtDateLong(p) {
  if (!p) return "—";
  return `${MONTH_LONG[p.m - 1]} ${p.d}, ${p.y}`;
}
function fmtDateShort(p) {
  if (!p) return "—";
  return `${String(p.d).padStart(2, "0")} ${MONTH_SHORT[p.m - 1]} ${p.y}`;
}

/* ============================================================
   LAST-2-MONTHS CARD
   ============================================================ */
function buildCompareCard(prevRecs, currRecs, prevLabel, currLabel, prevSheetTotal, currSheetTotal) {
  const mapPrev = groupByName(prevRecs);
  const mapCurr = groupByName(currRecs);
  const cntPrev = mapPrev.size;
  const cntCurr = mapCurr.size;

  const matchedKeys = [], onlyPrevKeys = [], onlyCurrKeys = [];
  const seen = new Set();
  mapPrev.forEach((v, k) => {
    if (seen.has(k)) return; seen.add(k);
    if (mapCurr.has(k)) matchedKeys.push(k); else onlyPrevKeys.push(k);
  });
  mapCurr.forEach((v, k) => {
    if (seen.has(k)) return; seen.add(k);
    onlyCurrKeys.push(k);
  });

  let subPrev = 0, subCurr = 0, sr = 0;
  const page = document.createElement("div");
  page.className = "page";

  page.innerHTML = `
    <div class="rc-head">
      <h1>Monthly Comparison</h1>
      <p>${esc(prevLabel)}  vs  ${esc(currLabel)}</p>
    </div>
    <div class="counts">
      <div><div class="num c1">${cntPrev}</div><div class="lbl">Persons (${esc(prevLabel)})</div></div>
      <div><div class="num c2">${cntCurr}</div><div class="lbl">Persons (${esc(currLabel)})</div></div>
    </div>
    <div class="months">
      <div class="hd sr-h">#</div>
      <div class="hd m1">${esc(prevLabel)}</div>
      <div class="hd m2">${esc(currLabel)}</div>
    </div>
  `;

  const body = document.createElement("div");
  const buildRow = (p, c, srNum, showDiff) => {
    const left = p
      ? `<div class="m1-cell">
           <div class="name-line"><span class="nm">${esc(p.name)}</span></div>
           <div class="amt">${fmt(p.amount)}</div>
         </div>`
      : `<div class="m1-cell"><div class="missing">—</div></div>`;

    let rightName = "";
    if (c) {
      let badge = "";
      if (showDiff && p) {
        const d = c.amount - p.amount;
        if (Math.abs(d) < 0.005) badge = `<span class="diff-badge same">same</span>`;
        else if (d > 0)           badge = `<span class="diff-badge up">▲${fmt(d)}</span>`;
        else                      badge = `<span class="diff-badge down">▼${fmt(Math.abs(d))}</span>`;
      }
      rightName = `<div class="name-line"><span class="nm">${esc(c.name)}</span>${badge}</div>`;
    }
    const right = c
      ? `<div class="m2-cell">${rightName}<div class="amt">${fmt(c.amount)}</div></div>`
      : `<div class="m2-cell"><div class="missing">—</div></div>`;

    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<div class="sr-cell">${srNum}</div>${left}${right}`;
    return row;
  };

  if (matchedKeys.length) {
    const sec = document.createElement("div");
    sec.className = "sec ok";
    sec.textContent = `✓ Matched Persons (${matchedKeys.length})`;
    body.appendChild(sec);
    matchedKeys.forEach(k => {
      const p = mapPrev.get(k), c = mapCurr.get(k);
      subPrev += p.amount; subCurr += c.amount;
      body.appendChild(buildRow(p, c, ++sr, true));
    });
  }

  if (onlyPrevKeys.length || onlyCurrKeys.length) {
    const sec = document.createElement("div");
    sec.className = "sec warn";
    sec.textContent = `⚠ Unmatched Persons (${onlyPrevKeys.length + onlyCurrKeys.length})`;
    body.appendChild(sec);
    const maxLen = Math.max(onlyPrevKeys.length, onlyCurrKeys.length);
    for (let i = 0; i < maxLen; i++) {
      const p = onlyPrevKeys[i] ? mapPrev.get(onlyPrevKeys[i]) : null;
      const c = onlyCurrKeys[i] ? mapCurr.get(onlyCurrKeys[i]) : null;
      if (p) subPrev += p.amount;
      if (c) subCurr += c.amount;
      body.appendChild(buildRow(p, c, ++sr, false));
    }
  }

  const totals = document.createElement("div");
  totals.className = "total-row";
  totals.innerHTML = `
    <div class="sr-blank"></div>
    <div>
      <div class="mname v1">${esc(prevLabel)}</div>
      <div class="val v1">${fmt(subPrev)}</div>
      <div class="cnt">${cntPrev} person${cntPrev === 1 ? "" : "s"}</div>
    </div>
    <div>
      <div class="mname v2">${esc(currLabel)}</div>
      <div class="val v2">${fmt(subCurr)}</div>
      <div class="cnt">${cntCurr} person${cntCurr === 1 ? "" : "s"}</div>
    </div>
  `;
  body.appendChild(totals);

  const grand = document.createElement("div");
  grand.className = "grand";
  grand.innerHTML = `
    <div class="lbl">Grand Total (Both Months)</div>
    <div class="val">${fmt(subPrev + subCurr)}</div>
    <div class="cnt">
      Matched: ${matchedKeys.length} &nbsp;•&nbsp;
      Only ${esc(prevLabel)}: ${onlyPrevKeys.length} &nbsp;•&nbsp;
      Only ${esc(currLabel)}: ${onlyCurrKeys.length}
    </div>
  `;
  body.appendChild(grand);

  /* ---- Monthly Sheet Totals section ---- */
  const sheetWrap = document.createElement("div");
  sheetWrap.className = "sheet-totals-wrap";
  sheetWrap.innerHTML = `
    <div class="sheet-totals-title">Monthly Sheet Totals</div>
    <div class="sheet-totals-grid">
      <div class="sheet-total-cell">
        <div class="st-month">${esc(prevLabel)}</div>
        <div class="st-val">${prevSheetTotal ? fmtInt(prevSheetTotal.amount) : 0} PKR</div>
        <div class="st-sub">${prevSheetTotal ? prevSheetTotal.count : 0} entr${(prevSheetTotal && prevSheetTotal.count === 1) ? "y" : "ies"}</div>
      </div>
      <div class="sheet-total-cell">
        <div class="st-month">${esc(currLabel)}</div>
        <div class="st-val">${currSheetTotal ? fmtInt(currSheetTotal.amount) : 0} PKR</div>
        <div class="st-sub">${currSheetTotal ? currSheetTotal.count : 0} entr${(currSheetTotal && currSheetTotal.count === 1) ? "y" : "ies"}</div>
      </div>
    </div>
  `;
  body.appendChild(sheetWrap);

  /* Difference bar */
  const diff = subCurr - subPrev;
  const diffEl = document.createElement("div");
  diffEl.className = "diffbar " + (diff > 0 ? "pos" : diff < 0 ? "neg" : "zero");
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "=";
  const sign  = diff > 0 ? "+" : "";
  diffEl.innerHTML = `
    <span>Monthly Difference</span>
    <span>${arrow} ${sign}${fmt(diff)}</span>
  `;
  body.appendChild(diffEl);

  page.appendChild(body);
  return page;
}

/* ============================================================
   ALL MONTHS TABLE
   ============================================================ */
function buildAllMonthsTable(monthList) {
  const table = document.getElementById("mtable");
  table.innerHTML = "";

  let grandTotal = 0, grandPersons = 0, totalMonthsWithData = 0;

  monthList.forEach(m => {
    const map = groupByName(m.recs);
    const label = m.label;

    const col = document.createElement("div");
    col.className = "mcol";

    const head = document.createElement("div");
    head.className = "mcol-head";
    head.innerHTML = `
      <div class="mname">${esc(label)}</div>
      <div class="mcount">${map.size} person${map.size === 1 ? "" : "s"}</div>
    `;
    col.appendChild(head);

    const bodyEl = document.createElement("div");
    bodyEl.className = "mcol-body";

    let sr = 0, total = 0;
    map.forEach(v => {
      sr++; total += v.amount;
      const row = document.createElement("div");
      row.className = "mrow";
      row.innerHTML = `
        <div class="top">
          <span class="srn">${sr}</span>
          <span class="nm">${esc(v.name)}</span>
        </div>
        <div class="amt">${fmt(v.amount)}</div>
      `;
      bodyEl.appendChild(row);
    });
    col.appendChild(bodyEl);

    const tot = document.createElement("div");
    tot.className = "mcol-total";
    tot.innerHTML = `
      <div class="lbl">${esc(label)} Total</div>
      <div class="val">${fmt(total)}</div>
      <div class="cnt">${map.size} person${map.size === 1 ? "" : "s"}</div>
    `;
    col.appendChild(tot);

    table.appendChild(col);

    grandTotal += total;
    grandPersons += map.size;
    if (map.size) totalMonthsWithData++;
  });

  const avgPerMonth = totalMonthsWithData ? grandTotal / totalMonthsWithData : 0;

  const grandCol = document.createElement("div");
  grandCol.className = "mcol-grand";
  grandCol.innerHTML = `
    <div class="mcol-head">
      <div class="mname">GRAND TOTAL</div>
      <div class="mcount">${monthList.length} month${monthList.length === 1 ? "" : "s"}</div>
    </div>
    <div class="mcol-body">
      <div class="big-lbl">All Months Combined</div>
      <div class="big-val">${fmt(grandTotal)}</div>
      <div class="sub">${grandPersons} person-entr${grandPersons === 1 ? "y" : "ies"}</div>
      <div class="divider"></div>
      <div class="avg-lbl">Avg / Month</div>
      <div class="avg-val">${fmt(avgPerMonth)}</div>
    </div>
    <div class="mcol-total">
      <div class="lbl" style="color:#ffd54f">GRAND TOTAL</div>
      <div class="val">${fmt(grandTotal)}</div>
      <div class="cnt" style="color:#ffd54f; opacity:0.8;">
        ${monthList.length} month${monthList.length === 1 ? "" : "s"}
      </div>
    </div>
  `;
  table.appendChild(grandCol);
}

/* ============================================================
   REPORT — Overall summary card
   NEW: Title simplified to "Sangi Parking"
   NEW: Row "Total Monthly ÷ 2 + Credit" under "Total Net Credited"
   ============================================================ */
function buildOverallSummaryCard(totals) {
  const { gross, exp, net, days, minStart, maxEnd, monthlySheetTotal } = totals;
  const avgNet = days ? net / days : 0;
  const combinedTotal = (monthlySheetTotal / 2) + net;

  const el = document.createElement("div");
  el.className = "overall-card";
  el.innerHTML = `
    <div class="oc-inner">
      <div class="oc-title">Sangi Parking</div>
      <table class="oc-table">
        <tr><td class="metric">Start Date</td><td class="detail">${esc(fmtDateLong(minStart))}</td></tr>
        <tr><td class="metric">End Date</td><td class="detail">${esc(fmtDateLong(maxEnd))}</td></tr>
        <tr><td class="metric">Total Days</td><td class="detail">${days} Day${days === 1 ? "" : "s"}</td></tr>
        <tr><td class="metric">Total Gross Amount</td><td class="detail">${fmtInt(gross)} PKR</td></tr>
        <tr><td class="metric">Total Expenses</td><td class="detail">${fmtInt(exp)} PKR</td></tr>
        <tr><td class="metric">Total Net Amount<br>Credited</td><td class="detail">${fmtInt(net)} PKR</td></tr>
      </table>

      <div class="oc-row-combined">
        <div>
          <div class="cb-k">Total Monthly ÷ 2 + Credit</div>
          <div class="cb-sub">(Monthly Sheet Total ÷ 2) + Net Credited</div>
        </div>
        <div class="cb-v">${fmtInt(combinedTotal)} PKR</div>
      </div>

      <table class="oc-table" style="margin-top: 14px;">
        <tr>
          <td class="metric">Average Daily<br>Earning (Net)</td>
          <td class="detail highlight">${fmtDec2(avgNet)} PKR / day</td>
        </tr>
      </table>
    </div>
  `;
  return el;
}

/* ============================================================
   SMART MONTHLY SPLIT
   ============================================================ */
function computeMonthlySplit(rows) {
  const buckets = new Map();

  const ensure = (y, m) => {
    const key = y * 100 + m;
    if (!buckets.has(key)) {
      buckets.set(key, {
        y, m,
        minStart: null,
        maxEnd:   null,
        gross: 0, exp: 0, net: 0
      });
    }
    return buckets.get(key);
  };

  rows.forEach(r => {
    const sp = parseDateParts(r.startDate);
    const ep = parseDateParts(r.endDate) || sp;
    if (!sp) return;

    const periodDays = daysBetween(sp, ep) || 1;

    let y = sp.y, m = sp.m;
    while (true) {
      const bucket = ensure(y, m);

      const monthFirst = { y, m, d: 1 };
      const monthLast  = { y, m, d: daysInMonth(y, m) };

      const segStart = dateCmp(sp, monthFirst) > 0 ? sp : monthFirst;
      const segEnd   = (ep && dateCmp(ep, monthLast) < 0) ? ep : monthLast;

      const segDays = daysBetween(segStart, segEnd);
      const frac = periodDays ? segDays / periodDays : 0;

      bucket.gross += r.gross * frac;
      bucket.net   += r.net   * frac;

      if (y === sp.y && m === sp.m) bucket.exp += r.expenses;

      if (sp.y === y && sp.m === m) {
        if (!bucket.minStart || dateCmp(sp, bucket.minStart) < 0) {
          bucket.minStart = { y: sp.y, m: sp.m, d: sp.d };
        }
      } else {
        if (!bucket.minStart || dateCmp(monthFirst, bucket.minStart) < 0) {
          bucket.minStart = monthFirst;
        }
      }

      if (ep && ep.y === y && ep.m === m) {
        if (!bucket.maxEnd || dateCmp(ep, bucket.maxEnd) > 0) {
          bucket.maxEnd = { y: ep.y, m: ep.m, d: ep.d };
        }
      } else {
        if (!bucket.maxEnd || dateCmp(monthLast, bucket.maxEnd) > 0) {
          bucket.maxEnd = monthLast;
        }
      }

      if (ep && y === ep.y && m === ep.m) break;
      if (!ep && y === sp.y && m === sp.m) break;

      m++;
      if (m > 12) { m = 1; y++; }
      if (ep && (y > ep.y || (y === ep.y && m > ep.m))) break;
    }
  });

  const now = new Date();
  const today = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };

  const result = [];
  buckets.forEach(b => {
    let startP = b.minStart || { y: b.y, m: b.m, d: 1 };
    let endP   = b.maxEnd   || { y: b.y, m: b.m, d: daysInMonth(b.y, b.m) };

    const isCurrentMonth = (today.y === b.y && today.m === b.m);
    if (isCurrentMonth && dateCmp(endP, today) > 0) {
      endP = { y: today.y, m: today.m, d: today.d };
    }
    if (dateCmp(startP, endP) > 0) startP = endP;

    const daysCount = daysBetween(startP, endP);

    result.push({
      y: b.y, m: b.m,
      startP, endP,
      daysCount,
      isCurrentMonth,
      gross: b.gross, exp: b.exp, net: b.net
    });
  });

  result.sort((a, b) => (b.y * 100 + b.m) - (a.y * 100 + a.m));
  return result;
}

/* ============================================================
   MONTHLY SHEET TOTALS
   ============================================================ */
function computeMonthlySheetTotals(records) {
  const totals = new Map();
  records.forEach(r => {
    const k = monthKey(r);
    if (!k) return;
    if (!totals.has(k)) totals.set(k, { amount: 0, count: 0 });
    const t = totals.get(k);
    t.amount += r.amount;
    t.count++;
  });
  return totals;
}

function sumMonthlySheetTotals(records) {
  let sum = 0;
  records.forEach(r => { sum += r.amount; });
  return sum;
}

/* ============================================================
   REPORT — Monthly row
   ============================================================ */
function buildMonthRow(info, srNo, sheetTotal) {
  const { y, m, startP, endP, daysCount, isCurrentMonth, gross, exp, net } = info;
  const avgNet = daysCount ? net / daysCount : 0;

  let sheetStrip = "";
  let combinedStrip = "";
  if (sheetTotal) {
    const sheetAmt = sheetTotal.amount;
    const halfSheet = sheetAmt / 2;
    const combined = halfSheet + net;

    sheetStrip = `
      <div class="mr-sheet-strip">
        <div>
          <div class="sheet-lbl">Monthly Sheet Total</div>
          <div class="sheet-sub">${sheetTotal.count} entr${sheetTotal.count === 1 ? "y" : "ies"}</div>
        </div>
        <div style="text-align:right;">
          <div class="sheet-val">${fmtInt(sheetAmt)} PKR</div>
          <div class="sheet-cnt">from Monthly sheet</div>
        </div>
      </div>
    `;

    combinedStrip = `
      <div class="mr-combined-strip">
        <div>
          <div class="c-lbl">Combined Total</div>
          <div class="c-sub">(Monthly Sheet ÷ 2) + Credit</div>
        </div>
        <div class="c-val">${fmtInt(combined)} PKR</div>
      </div>
    `;
  }

  const row = document.createElement("div");
  row.className = "month-row" + (isCurrentMonth ? " current" : "");
  row.innerHTML = `
    <div class="row-sr">${srNo}</div>
    <div>
      <div class="mr-head">
        <div>
          <div class="mr-title">
            ${esc(MONTH_LONG[m - 1])} ${y}
            ${isCurrentMonth ? '<span class="mr-badge">Current</span>' : ''}
          </div>
          <div class="mr-range">
            ${esc(fmtDateShort(startP))} → ${esc(fmtDateShort(endP))}
          </div>
        </div>
        <div class="mr-days">${daysCount}d</div>
      </div>
      <div class="mr-metrics">
        <div class="mr-metric credit">
          <div class="lbl">Credit</div>
          <div class="val">${fmtInt(net)}</div>
        </div>
        <div class="mr-metric exp">
          <div class="lbl">Expenses</div>
          <div class="val">${fmtInt(exp)}</div>
        </div>
        <div class="mr-metric gross">
          <div class="lbl">Gross</div>
          <div class="val">${fmtInt(gross)}</div>
        </div>
        <div class="mr-metric avg">
          <div class="lbl">Avg/Day</div>
          <div class="val">${fmtInt(avgNet)}</div>
        </div>
      </div>
      ${sheetStrip}
      ${combinedStrip}
    </div>
  `;
  return row;
}

/* ============================================================
   REPORT — Period row
   ============================================================ */
function buildPeriodRow(period, srNo) {
  const { startP, endP, startStr, endStr, gross, exp, net } = period;
  const days = daysBetween(startP, endP) || 1;
  const avgNet = net / days;

  const startLabel = startP ? fmtDateShort(startP) : (startStr || "—");
  const endLabel   = endP   ? fmtDateShort(endP)   : (endStr   || "—");

  const row = document.createElement("div");
  row.className = "period-row";
  row.innerHTML = `
    <div class="row-sr">${srNo}</div>
    <div>
      <div class="pr-head">
        <div class="pr-range">${esc(startLabel)} → ${esc(endLabel)}</div>
        <div class="pr-days">${days}d</div>
      </div>
      <div class="pr-metrics">
        <div class="pr-metric credit">
          <div class="lbl">Credit</div>
          <div class="val">${fmtInt(net)}</div>
        </div>
        <div class="pr-metric exp">
          <div class="lbl">Expenses</div>
          <div class="val">${fmtInt(exp)}</div>
        </div>
        <div class="pr-metric gross">
          <div class="lbl">Gross</div>
          <div class="val">${fmtInt(gross)}</div>
        </div>
        <div class="pr-metric avg">
          <div class="lbl">Avg/Day</div>
          <div class="val">${fmtInt(avgNet)}</div>
        </div>
      </div>
    </div>
  `;
  return row;
}

/* ============================================================
   REPORT — main render
   ============================================================ */
function renderReport(rows, monthlyRecords) {
  const statusEl = document.getElementById("dailyStatus");
  const contentEl = document.getElementById("reportContent");

  if (!rows.length) {
    statusEl.textContent = "No daily data found. Make sure the Daily sheet is published as CSV.";
    return;
  }

  let minStart = null, maxEnd = null;
  let totalGross = 0, totalExp = 0, totalNet = 0;

  rows.forEach(r => {
    totalGross += r.gross;
    totalExp   += r.expenses;
    totalNet   += r.net;
    const sp = parseDateParts(r.startDate);
    const ep = parseDateParts(r.endDate) || sp;
    if (sp && (!minStart || dateCmp(sp, minStart) < 0)) minStart = sp;
    if (ep && (!maxEnd   || dateCmp(ep, maxEnd)   > 0)) maxEnd   = ep;
  });

  const totalDays = (minStart && maxEnd) ? daysBetween(minStart, maxEnd) : 0;
  const monthlySheetTotal = sumMonthlySheetTotals(monthlyRecords);

  const overallEl = document.getElementById("overallCard");
  overallEl.innerHTML = "";
  overallEl.appendChild(buildOverallSummaryCard({
    gross: totalGross, exp: totalExp, net: totalNet, days: totalDays,
    minStart, maxEnd,
    monthlySheetTotal
  }));

  const sheetTotals = computeMonthlySheetTotals(monthlyRecords);

  const monthInfos = computeMonthlySplit(rows);
  const monthEl = document.getElementById("monthList");
  monthEl.innerHTML = "";
  monthInfos.forEach((info, i) => {
    const k = info.y * 100 + info.m;
    const sheetTotal = sheetTotals.get(k) || null;
    monthEl.appendChild(buildMonthRow(info, i + 1, sheetTotal));
  });

  const periodEl = document.getElementById("periodList");
  periodEl.innerHTML = "";

  const sortedRows = [...rows].sort((a, b) => {
    const da = parseDateParts(a.startDate), db = parseDateParts(b.startDate);
    if (da && db) return dateCmp(db, da);
    return (b.startDate || "").localeCompare(a.startDate || "");
  });

  sortedRows.forEach((r, i) => {
    const startP = parseDateParts(r.startDate);
    const endP   = parseDateParts(r.endDate) || startP;
    periodEl.appendChild(buildPeriodRow({
      startStr: r.startDate,
      endStr:   r.endDate,
      startP, endP,
      gross: r.gross, exp: r.expenses, net: r.net
    }, i + 1));
  });

  renderDailyTable(sortedRows);

  statusEl.style.display = "none";
  contentEl.style.display = "block";
}

/* ---- Daily data table ---- */
function renderDailyTable(rows) {
  const body = document.getElementById("dailyBody");
  const foot = document.getElementById("dailyFoot");
  body.innerHTML = "";
  foot.innerHTML = "";

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#999;padding:20px;">No data</td></tr>`;
    return;
  }

  let tGross = 0, tExp = 0, tNet = 0;
  rows.forEach(r => {
    tGross += r.gross; tExp += r.expenses; tNet += r.net;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="date">${esc(r.startDate) || "—"}</td>
      <td class="date">${esc(r.endDate) || "—"}</td>
      <td class="num gross">${fmtInt(r.gross)}</td>
      <td class="num exp">${fmtInt(r.expenses)}</td>
      <td class="num net">${fmtInt(r.net)}</td>
    `;
    body.appendChild(tr);
  });

  foot.innerHTML = `
    <tr>
      <td colspan="2">TOTAL (${rows.length} row${rows.length === 1 ? "" : "s"})</td>
      <td class="num gross">${fmtInt(tGross)}</td>
      <td class="num exp">${fmtInt(tExp)}</td>
      <td class="num net">${fmtInt(tNet)}</td>
    </tr>
  `;
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadMonthly() {
  let all = [];
  for (const u of [SHEET1_CSV, SHEET2_CSV]) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      all = all.concat(normalizeRecords(parseCSV(txt)));
    } catch (e) { console.warn("Monthly fetch failed:", u, e); }
  }
  return all;
}

async function loadDaily() {
  try {
    const res = await fetch(SHEET_DAILY_CSV, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const txt = await res.text();
    return normalizeDaily(parseCSV(txt));
  } catch (e) {
    console.warn("Daily fetch failed:", SHEET_DAILY_CSV, e);
    return [];
  }
}

/* ============================================================
   MONTHLY STATE (Last 2 / All Months)
   ============================================================ */
let allKeys = [];
let byMonth = new Map();
let monthlyLoaded = false;
let monthlyRecordsCache = [];

function renderLast2() {
  const statusEl = document.getElementById("statusLast2");
  const carousel = document.getElementById("carousel");
  carousel.innerHTML = "";

  if (allKeys.length < 2) {
    statusEl.textContent = "Need at least two months of data.";
    statusEl.style.display = "block";
    carousel.style.display = "none";
    return;
  }

  const kPrev = allKeys[allKeys.length - 2];
  const kCurr = allKeys[allKeys.length - 1];
  const prevRecs = byMonth.get(kPrev) || [];
  const currRecs = byMonth.get(kCurr) || [];

  const sheetTotals = computeMonthlySheetTotals(monthlyRecordsCache);
  const prevSheetTotal = sheetTotals.get(kPrev) || null;
  const currSheetTotal = sheetTotals.get(kCurr) || null;

  carousel.appendChild(
    buildCompareCard(
      prevRecs, currRecs,
      monthLabel(prevRecs[0]), monthLabel(currRecs[0]),
      prevSheetTotal, currSheetTotal
    )
  );

  statusEl.style.display = "none";
  carousel.style.display = "flex";
}

function renderAllMonths() {
  const statusEl = document.getElementById("statusAll");
  const tableWrap = document.getElementById("tableWrap");
  const hint = document.getElementById("tableHint");

  if (allKeys.length < 2) {
    statusEl.textContent = "Need at least two months of data.";
    statusEl.style.display = "block";
    tableWrap.style.display = "none";
    hint.style.display = "none";
    return;
  }

  const monthList = allKeys.map(k => {
    const recs = byMonth.get(k) || [];
    return { recs, label: monthLabel(recs[0]) };
  }).filter(m => m.recs.length);

  buildAllMonthsTable(monthList);
  statusEl.style.display = "none";
  tableWrap.style.display = "block";
  hint.style.display = monthList.length > 1 ? "block" : "none";
}

async function loadMonthlyOnce() {
  if (monthlyLoaded) return;
  monthlyLoaded = true;

  const records = monthlyRecordsCache.length ? monthlyRecordsCache : await loadMonthly();
  monthlyRecordsCache = records;

  if (!records.length) {
    document.getElementById("statusLast2").textContent = "No monthly data available.";
    document.getElementById("statusAll").textContent = "No monthly data available.";
    return;
  }

  allKeys = [...new Set(records.map(monthKey))].filter(k => k > 0).sort((a,b) => a-b);

  byMonth = new Map();
  records.forEach(r => {
    const k = monthKey(r);
    if (!byMonth.has(k)) byMonth.set(k, []);
    byMonth.get(k).push(r);
  });

  renderLast2();
  renderAllMonths();
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(tab) {
  document.getElementById("tabReport").classList.toggle("active", tab === "report");
  document.getElementById("tabLast2").classList.toggle("active", tab === "last2");
  document.getElementById("tabAll").classList.toggle("active", tab === "all");

  document.getElementById("contentReport").classList.toggle("active", tab === "report");
  document.getElementById("contentLast2").classList.toggle("active", tab === "last2");
  document.getElementById("contentAll").classList.toggle("active", tab === "all");

  if (tab === "last2" || tab === "all") loadMonthlyOnce();
}

document.getElementById("tabReport").addEventListener("click", () => switchTab("report"));
document.getElementById("tabLast2").addEventListener("click", () => switchTab("last2"));
document.getElementById("tabAll").addEventListener("click", () => switchTab("all"));

/* ============================================================
   BOOT
   ============================================================ */
Promise.all([loadDaily(), loadMonthly()])
  .then(([dailyRows, monthlyRecords]) => {
    monthlyRecordsCache = monthlyRecords;
    renderReport(dailyRows, monthlyRecords);
  })
  .catch(e => {
    document.getElementById("dailyStatus").textContent = "Error: " + e.message;
    console.error(e);
  });
</script>
