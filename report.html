<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Reports</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; padding: 12px 0 20px; background: #eef1f5; color: #1a1a1a;
    font-size: 14px;
    overflow-x: hidden;
  }

  /* ============ TAB BAR ============ */
  .tab-bar {
    max-width: 480px; margin: 0 auto 12px;
    background: #fff; border-radius: 12px;
    padding: 6px; display: flex; gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .tab-bar button {
    flex: 1; padding: 10px 8px; border: none;
    background: transparent; color: #666;
    font-size: 13px; font-weight: 600;
    border-radius: 8px; cursor: pointer;
    font-family: inherit;
    transition: all 0.18s;
  }
  .tab-bar button.active {
    background: #1e88e5; color: #fff;
    box-shadow: 0 2px 6px rgba(30,136,229,0.4);
  }

  /* ============ SUB TOGGLE (within Monthly tab) ============ */
  .toggle-bar {
    max-width: 480px; margin: 0 auto 12px;
    background: #fff; border-radius: 12px;
    padding: 10px; display: flex; justify-content: center; gap: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .toggle-bar label {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 9px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    color: #555; background: #f4f6f9; transition: all 0.18s;
    user-select: none;
  }
  .toggle-bar input { display: none; }
  .toggle-bar input:checked + span {
    background: #1e88e5; color: #fff;
    padding: 9px 10px; border-radius: 8px; margin: -9px -10px;
  }
  .toggle-bar span {
    display: block; width: 100%; text-align: center;
    transition: all 0.18s;
  }

  /* ============ TAB CONTENT ============ */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ============ CAROUSEL (last 2 months) ============ */
  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 12px;
    gap: 12px;
  }
  .carousel::-webkit-scrollbar { display: none; }

  .page {
    flex: 0 0 calc(100% - 24px);
    max-width: 480px;
    scroll-snap-align: center;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  /* ============ CARD ============ */
  .rc-head {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff; padding: 14px; text-align: center;
  }
  .rc-head h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .rc-head p { margin: 3px 0 0; font-size: 12px; opacity: 0.9; }

  .counts {
    display: grid; grid-template-columns: 1fr 1fr;
    background: #f7f9fc; border-bottom: 1px solid #e0e4ea;
  }
  .counts > div {
    padding: 10px 8px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .counts > div:last-child { border-right: none; }
  .counts .num { font-size: 20px; font-weight: 800; line-height: 1.1; }
  .counts .lbl { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }
  .counts .c1 { color: #1565c0; }
  .counts .c2 { color: #2e7d32; }

  .months {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    background: #f7f9fc; border-bottom: 2px solid #e0e4ea;
    font-size: 12px; font-weight: 700;
  }
  .months .hd {
    padding: 9px 6px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .months .hd:last-child { border-right: none; }
  .months .m1 { color: #1565c0; }
  .months .m2 { color: #2e7d32; }
  .months .sr-h { color: #999; font-size: 11px; }

  .sec {
    padding: 6px 12px;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    border-top: 1px solid #e0e4ea;
    border-bottom: 1px solid #e0e4ea;
  }
  .sec.ok   { background: #e8f5e9; color: #2e7d32; }
  .sec.warn { background: #fff3e0; color: #e65100; }

  .item {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    border-bottom: 1px dashed #e5e8ee;
    background: #fff;
  }
  .item > div {
    padding: 8px 7px; min-height: 46px;
    display: flex; flex-direction: column; justify-content: center;
    border-right: 1px solid #f0f2f6;
    overflow: hidden;
  }
  .item > div:last-child { border-right: none; }

  .sr-cell {
    font-size: 11px; font-weight: 700; color: #6b7280;
    text-align: center; background: #f4f6f9;
  }

  .name-line {
    display: flex; align-items: baseline; gap: 4px;
    font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden;
  }
  .name-line .nm { overflow: hidden; text-overflow: ellipsis; }
  .amt { font-size: 14px; font-weight: 700; margin-top: 2px; }
  .m1-cell .amt { color: #1565c0; }
  .m2-cell .amt { color: #2e7d32; }

  .missing {
    color: #cbd0d8; font-style: italic; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }

  .diff-badge {
    font-size: 9px; font-weight: 700;
    padding: 1px 4px; border-radius: 4px; margin-left: auto;
    flex-shrink: 0;
  }
  .diff-badge.up { background: #e8f5e9; color: #2e7d32; }
  .diff-badge.down { background: #ffebee; color: #c62828; }
  .diff-badge.same { background: #f0f2f6; color: #666; }

  .total-row {
    display: grid;
    grid-template-columns: 34px 1fr 1fr;
    background: #f7f9fc; border-top: 2px solid #e0e4ea;
    font-weight: 700;
  }
  .total-row > div {
    padding: 10px 6px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .total-row > div:last-child { border-right: none; }
  .total-row .mname {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.4px;
  }
  .total-row .mname.v1 { color: #1565c0; }
  .total-row .mname.v2 { color: #2e7d32; }
  .total-row .val { font-size: 15px; margin-top: 3px; }
  .total-row .val.v1 { color: #1565c0; }
  .total-row .val.v2 { color: #2e7d32; }
  .total-row .cnt {
    font-size: 10px; color: #777; font-weight: 500; margin-top: 2px;
  }
  .total-row .sr-blank { background: #f4f6f9; }

  .grand {
    background: linear-gradient(135deg, #263238, #37474f);
    color: #fff; padding: 14px; text-align: center;
  }
  .grand .lbl { font-size: 11px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.6px; }
  .grand .val { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .grand .cnt { font-size: 11px; opacity: 0.85; margin-top: 6px; }

  .diffbar {
    margin: 10px 12px 14px; padding: 10px 14px;
    border-radius: 10px; display: flex;
    justify-content: space-between; align-items: center;
    font-weight: 700; font-size: 14px;
  }
  .diffbar.pos { background: #e8f5e9; color: #2e7d32; }
  .diffbar.neg { background: #ffebee; color: #c62828; }
  .diffbar.zero { background: #f0f2f6; color: #555; }

  /* ============ ALL MONTHS TABLE ============ */
  .table-wrap {
    display: none;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 12px 12px;
  }
  .table-wrap.active { display: block; }
  .table-wrap::-webkit-scrollbar { height: 6px; }
  .table-wrap::-webkit-scrollbar-thumb { background: #c8d0da; border-radius: 3px; }

  .mtable {
    display: inline-grid;
    grid-auto-flow: column;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    background: #fff;
    min-width: 100%;
  }

  .mcol {
    display: flex; flex-direction: column;
    border-right: 1px solid #e0e4ea;
    min-width: 140px; max-width: 140px;
  }
  .mcol:last-child { border-right: none; }

  .mcol-head {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff; padding: 10px 8px; text-align: center;
    font-weight: 700; font-size: 13px;
  }
  .mcol:nth-child(even) .mcol-head {
    background: linear-gradient(135deg, #43a047, #2e7d32);
  }
  .mcol-head .mname { font-size: 13px; }
  .mcol-head .mcount {
    font-size: 10px; opacity: 0.9; margin-top: 3px; font-weight: 500;
  }
  .mcol-body { flex: 1; }

  .mrow {
    display: flex; flex-direction: column;
    padding: 7px 9px;
    border-bottom: 1px dashed #e5e8ee;
    min-height: 50px;
    justify-content: center;
  }
  .mrow .top {
    display: flex; align-items: center; gap: 5px;
    font-weight: 600; font-size: 12.5px;
    white-space: nowrap; overflow: hidden;
  }
  .mrow .top .srn {
    font-size: 10px; color: #9aa3af; font-weight: 700;
    background: #f0f2f6; padding: 1px 5px; border-radius: 4px;
    flex-shrink: 0;
  }
  .mrow .top .nm { overflow: hidden; text-overflow: ellipsis; }
  .mrow .amt { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .mcol:nth-child(odd) .mrow .amt { color: #1565c0; }
  .mcol:nth-child(even) .mrow .amt { color: #2e7d32; }

  .mcol-total {
    background: #f7f9fc;
    border-top: 2px solid #e0e4ea;
    padding: 10px 8px; text-align: center;
  }
  .mcol-total .lbl {
    font-size: 10px; color: #666; text-transform: uppercase;
    letter-spacing: 0.4px; font-weight: 700;
  }
  .mcol-total .val { font-size: 15px; font-weight: 800; margin-top: 3px; }
  .mcol:nth-child(odd) .mcol-total .val { color: #1565c0; }
  .mcol:nth-child(even) .mcol-total .val { color: #2e7d32; }
  .mcol-total .cnt { font-size: 10px; color: #777; font-weight: 500; margin-top: 2px; }

  .mcol-grand {
    display: flex; flex-direction: column;
    min-width: 150px; max-width: 150px;
    background: #263238; color: #fff;
    border-left: 3px solid #ffb300;
  }
  .mcol-grand .mcol-head { background: linear-gradient(135deg, #ffa726, #ef6c00); }
  .mcol-grand .mcol-body {
    display: flex; flex-direction: column; justify-content: center;
    padding: 14px 10px; text-align: center; flex: 1;
  }
  .mcol-grand .big-lbl { font-size: 10px; opacity: 0.85; text-transform: uppercase; letter-spacing: 0.6px; font-weight: 700; }
  .mcol-grand .big-val { font-size: 20px; font-weight: 800; margin-top: 6px; color: #ffd54f; }
  .mcol-grand .sub { font-size: 10px; opacity: 0.85; margin-top: 8px; }
  .mcol-grand .divider { height: 1px; background: rgba(255,255,255,0.2); margin: 10px 0; }
  .mcol-grand .avg-lbl { font-size: 9px; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.5px; }
  .mcol-grand .avg-val { font-size: 13px; font-weight: 700; margin-top: 3px; }
  .mcol-grand .mcol-total { background: #1a232a; border-top: 2px solid #ffb300; }
  .mcol-grand .mcol-total .val { color: #ffd54f; }

  .table-hint {
    text-align: center; font-size: 11px; color: #888;
    padding: 6px 0 10px;
  }

  /* ============ DAILY REPORT TABLE ============ */
  .daily-wrap {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding: 0 12px 12px;
  }
  .daily-wrap::-webkit-scrollbar { height: 6px; }
  .daily-wrap::-webkit-scrollbar-thumb { background: #c8d0da; border-radius: 3px; }

  .daily-table {
    width: 100%;
    min-width: 640px;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    border-collapse: collapse;
    font-size: 13px;
  }
  .daily-table thead th {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff;
    padding: 12px 10px;
    text-align: left;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .daily-table thead th.num { text-align: right; }
  .daily-table tbody td {
    padding: 10px;
    border-bottom: 1px solid #eef1f5;
    white-space: nowrap;
  }
  .daily-table tbody td.num {
    text-align: right;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .daily-table tbody td.date {
    color: #555;
    font-size: 12px;
  }
  .daily-table tbody tr:nth-child(even) { background: #fafbfd; }
  .daily-table tbody tr:hover { background: #f0f7ff; }

  .daily-table td.gross   { color: #1565c0; }
  .daily-table td.exp     { color: #c62828; }
  .daily-table td.net     { color: #2e7d32; }

  .daily-table tfoot td {
    padding: 12px 10px;
    background: #263238;
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    border-top: 2px solid #ffb300;
    white-space: nowrap;
  }
  .daily-table tfoot td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .daily-table tfoot td.gross { color: #90caf9; }
  .daily-table tfoot td.exp   { color: #ef9a9a; }
  .daily-table tfoot td.net   { color: #a5d6a7; }

  .status { text-align: center; padding: 40px 20px; color: #777; font-size: 14px; }
  .swipe-hint {
    text-align: center; font-size: 11px; color: #888;
    padding: 4px 0 10px;
  }
</style>
</head>
<body>

<!-- Main tabs -->
<div class="tab-bar">
  <button id="tabMonthly" class="active" type="button">Monthly</button>
  <button id="tabReport" type="button">Report</button>
</div>

<!-- ============= MONTHLY TAB ============= -->
<div class="tab-content active" id="contentMonthly">

  <div class="toggle-bar">
    <label>
      <input type="radio" name="view" value="compare" checked>
      <span>Last 2 Months</span>
    </label>
    <label>
      <input type="radio" name="view" value="all">
      <span>Show All Months</span>
    </label>
  </div>

  <div id="status" class="status">Loading data…</div>

  <!-- Last 2 months mode -->
  <div class="carousel" id="carousel" style="display:none;"></div>
  <div class="dots" id="dots" style="display:none;"></div>
  <div class="swipe-hint" id="swipeHint" style="display:none;">← Swipe to see other months →</div>

  <!-- All months table mode -->
  <div class="table-wrap" id="tableWrap">
    <div class="mtable" id="mtable"></div>
  </div>
  <div class="table-hint" id="tableHint" style="display:none;">← Swipe horizontally to see all months →</div>
</div>

<!-- ============= REPORT TAB (DAILY) ============= -->
<div class="tab-content" id="contentReport">
  <div id="dailyStatus" class="status">Loading daily data…</div>
  <div class="daily-wrap" id="dailyWrap" style="display:none;">
    <table class="daily-table" id="dailyTable">
      <thead>
        <tr>
          <th>Start Date</th>
          <th>End Date</th>
          <th class="num">Gross (PKR)</th>
          <th class="num">Expenses (PKR)</th>
          <th class="num">Net Credited (PKR)</th>
        </tr>
      </thead>
      <tbody id="dailyBody"></tbody>
      <tfoot id="dailyFoot"></tfoot>
    </table>
  </div>
  <div class="table-hint" id="dailyHint" style="display:none;">← Swipe horizontally to see all columns →</div>
</div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHEET1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREo2Dzmu7_NM9xgM_xdNzb1TqpgSTn_dj5bgJT2l7WEgzykoT5zNHTOFxrS7UMN08eb2VOLEnaCLV4/pub?output=csv";
const SHEET2_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1452200885";

/* Daily sheet — same workbook, gid 1810247989 */
const SHEET_DAILY_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1810247989";

const COL = {
  name:   ["name/item", "name", "item", "person", "party"],
  amount: ["amount", "amt", "value"],
  month:  ["month", "mnth"],
  year:   ["year", "yr"]
};

const DAILY_COL = {
  startDate: ["start date", "startdate", "from", "from date"],
  endDate:   ["end date", "enddate", "to", "to date"],
  gross:     ["total gross amount (pkr)", "total gross amount", "gross amount", "gross"],
  expenses:  ["total expenses (pkr)", "total expenses", "expenses", "expense"],
  net:       ["total net amount credited (pkr)", "total net amount credited", "net amount credited", "net amount", "net"]
};

/* ============================================================
   CSV UTIL
   ============================================================ */
function parseCSV(text) {
  const rows = [];
  let cur = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(field); field = ""; }
      else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ""; }
      else if (c === '\r') { }
      else field += c;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function findCol(headers, names) {
  for (let i = 0; i < headers.length; i++) {
    const h = (headers[i] || "").trim().toLowerCase().replace(/\s+/g, " ");
    for (const n of names) if (h === n.toLowerCase()) return i;
  }
  return -1;
}

function normalizeRecords(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    name:   findCol(headers, COL.name),
    amount: findCol(headers, COL.amount),
    month:  findCol(headers, COL.month),
    year:   findCol(headers, COL.year)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = (r[idx.name] || "").trim();
    if (!name) continue;
    const amtRaw = (r[idx.amount] || "0").toString().replace(/[^0-9.\-]/g, "");
    out.push({
      name,
      amount: parseFloat(amtRaw) || 0,
      month:  idx.month >= 0 ? (r[idx.month] || "").trim() : "",
      year:   idx.year  >= 0 ? (r[idx.year]  || "").trim() : ""
    });
  }
  return out;
}

function normalizeDaily(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    startDate: findCol(headers, DAILY_COL.startDate),
    endDate:   findCol(headers, DAILY_COL.endDate),
    gross:     findCol(headers, DAILY_COL.gross),
    expenses:  findCol(headers, DAILY_COL.expenses),
    net:       findCol(headers, DAILY_COL.net)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    // skip blank rows
    if (!r.some(c => (c || "").trim() !== "")) continue;

    const startDate = idx.startDate >= 0 ? (r[idx.startDate] || "").trim() : "";
    const endDate   = idx.endDate   >= 0 ? (r[idx.endDate]   || "").trim() : "";
    const gross     = idx.gross     >= 0 ? parseNum(r[idx.gross])     : 0;
    const expenses  = idx.expenses  >= 0 ? parseNum(r[idx.expenses])  : 0;
    const net       = idx.net       >= 0 ? parseNum(r[idx.net])       : 0;

    // skip rows that have no dates and no amounts (e.g. "New" placeholder)
    if (!startDate && !endDate && !gross && !expenses && !net) continue;

    out.push({ startDate, endDate, gross, expenses, net });
  }
  return out;
}

function parseNum(v) {
  if (v == null) return 0;
  const s = v.toString().replace(/[^0-9.\-]/g, "");
  return parseFloat(s) || 0;
}

/* ============================================================
   MONTHLY HELPERS
   ============================================================ */
const MONTH_NUM = {
  jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4,
  may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8, sep:9, sept:9,
  september:9, oct:10, october:10, nov:11, november:11, dec:12, december:12
};
function monthKey(rec) {
  const m = MONTH_NUM[rec.month.toLowerCase()] || 0;
  const y = parseInt(rec.year) || 0;
  return y * 100 + m;
}
function monthLabel(rec) {
  if (!rec) return "—";
  return `${rec.month} ${rec.year}`.trim();
}
function nameKey(name) {
  return name.toLowerCase().replace(/[^a-z0-9]/g, "");
}

function groupByName(recs) {
  const m = new Map();
  recs.forEach(r => {
    const k = nameKey(r.name);
    if (!m.has(k)) m.set(k, { name: r.name, amount: 0 });
    m.get(k).amount += r.amount;
  });
  return m;
}

function fmt(n) {
  const sign = n < 0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ============================================================
   LAST-2-MONTHS PAGE
   ============================================================ */
function buildComparePage(prevRecs, currRecs, prevLabel, currLabel) {
  const mapPrev = groupByName(prevRecs);
  const mapCurr = groupByName(currRecs);
  const cntPrev = mapPrev.size;
  const cntCurr = mapCurr.size;

  const matchedKeys = [], onlyPrevKeys = [], onlyCurrKeys = [];
  const seen = new Set();
  mapPrev.forEach((v, k) => {
    if (seen.has(k)) return; seen.add(k);
    if (mapCurr.has(k)) matchedKeys.push(k); else onlyPrevKeys.push(k);
  });
  mapCurr.forEach((v, k) => {
    if (seen.has(k)) return; seen.add(k);
    onlyCurrKeys.push(k);
  });

  let subPrev = 0, subCurr = 0, sr = 0;
  const page = document.createElement("div");
  page.className = "page";

  page.innerHTML = `
    <div class="rc-head">
      <h1>Monthly Comparison</h1>
      <p>${esc(prevLabel)}  vs  ${esc(currLabel)}</p>
    </div>
    <div class="counts">
      <div><div class="num c1">${cntPrev}</div><div class="lbl">Persons (${esc(prevLabel)})</div></div>
      <div><div class="num c2">${cntCurr}</div><div class="lbl">Persons (${esc(currLabel)})</div></div>
    </div>
    <div class="months">
      <div class="hd sr-h">#</div>
      <div class="hd m1">${esc(prevLabel)}</div>
      <div class="hd m2">${esc(currLabel)}</div>
    </div>
  `;

  const body = document.createElement("div");

  const buildRow = (p, c, srNum, showDiff) => {
    const left = p
      ? `<div class="m1-cell">
           <div class="name-line"><span class="nm">${esc(p.name)}</span></div>
           <div class="amt">${fmt(p.amount)}</div>
         </div>`
      : `<div class="m1-cell"><div class="missing">—</div></div>`;

    let rightName = "";
    if (c) {
      let badge = "";
      if (showDiff && p) {
        const d = c.amount - p.amount;
        if (Math.abs(d) < 0.005) badge = `<span class="diff-badge same">same</span>`;
        else if (d > 0)           badge = `<span class="diff-badge up">▲${fmt(d)}</span>`;
        else                      badge = `<span class="diff-badge down">▼${fmt(Math.abs(d))}</span>`;
      }
      rightName = `<div class="name-line"><span class="nm">${esc(c.name)}</span>${badge}</div>`;
    }

    const right = c
      ? `<div class="m2-cell">${rightName}<div class="amt">${fmt(c.amount)}</div></div>`
      : `<div class="m2-cell"><div class="missing">—</div></div>`;

    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<div class="sr-cell">${srNum}</div>${left}${right}`;
    return row;
  };

  if (matchedKeys.length) {
    const sec = document.createElement("div");
    sec.className = "sec ok";
    sec.textContent = `✓ Matched Persons (${matchedKeys.length})`;
    body.appendChild(sec);
    matchedKeys.forEach(k => {
      const p = mapPrev.get(k), c = mapCurr.get(k);
      subPrev += p.amount; subCurr += c.amount;
      body.appendChild(buildRow(p, c, ++sr, true));
    });
  }

  if (onlyPrevKeys.length || onlyCurrKeys.length) {
    const sec = document.createElement("div");
    sec.className = "sec warn";
    sec.textContent = `⚠ Unmatched Persons (${onlyPrevKeys.length + onlyCurrKeys.length})`;
    body.appendChild(sec);
    const maxLen = Math.max(onlyPrevKeys.length, onlyCurrKeys.length);
    for (let i = 0; i < maxLen; i++) {
      const p = onlyPrevKeys[i] ? mapPrev.get(onlyPrevKeys[i]) : null;
      const c = onlyCurrKeys[i] ? mapCurr.get(onlyCurrKeys[i]) : null;
      if (p) subPrev += p.amount;
      if (c) subCurr += c.amount;
      body.appendChild(buildRow(p, c, ++sr, false));
    }
  }

  const totals = document.createElement("div");
  totals.className = "total-row";
  totals.innerHTML = `
    <div class="sr-blank"></div>
    <div>
      <div class="mname v1">${esc(prevLabel)}</div>
      <div class="val v1">${fmt(subPrev)}</div>
      <div class="cnt">${cntPrev} person${cntPrev === 1 ? "" : "s"}</div>
    </div>
    <div>
      <div class="mname v2">${esc(currLabel)}</div>
      <div class="val v2">${fmt(subCurr)}</div>
      <div class="cnt">${cntCurr} person${cntCurr === 1 ? "" : "s"}</div>
    </div>
  `;
  body.appendChild(totals);

  const grand = document.createElement("div");
  grand.className = "grand";
  grand.innerHTML = `
    <div class="lbl">Grand Total (Both Months)</div>
    <div class="val">${fmt(subPrev + subCurr)}</div>
    <div class="cnt">
      Matched: ${matchedKeys.length} &nbsp;•&nbsp;
      Only ${esc(prevLabel)}: ${onlyPrevKeys.length} &nbsp;•&nbsp;
      Only ${esc(currLabel)}: ${onlyCurrKeys.length}
    </div>
  `;
  body.appendChild(grand);

  const diff = subCurr - subPrev;
  const diffEl = document.createElement("div");
  diffEl.className = "diffbar " + (diff > 0 ? "pos" : diff < 0 ? "neg" : "zero");
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "=";
  const sign  = diff > 0 ? "+" : "";
  diffEl.innerHTML = `
    <span>Monthly Difference</span>
    <span>${arrow} ${sign}${fmt(diff)}</span>
  `;
  body.appendChild(diffEl);

  page.appendChild(body);
  return page;
}

/* ============================================================
   ALL MONTHS TABLE
   ============================================================ */
function buildTable(monthList) {
  const table = document.getElementById("mtable");
  table.innerHTML = "";

  let grandTotal = 0;
  let grandPersons = 0;
  let totalMonthsWithData = 0;

  monthList.forEach(m => {
    const map = groupByName(m.recs);
    const label = m.label;

    const col = document.createElement("div");
    col.className = "mcol";

    const head = document.createElement("div");
    head.className = "mcol-head";
    head.innerHTML = `
      <div class="mname">${esc(label)}</div>
      <div class="mcount">${map.size} person${map.size === 1 ? "" : "s"}</div>
    `;
    col.appendChild(head);

    const bodyEl = document.createElement("div");
    bodyEl.className = "mcol-body";

    let sr = 0, total = 0;
    map.forEach(v => {
      sr++; total += v.amount;
      const row = document.createElement("div");
      row.className = "mrow";
      row.innerHTML = `
        <div class="top">
          <span class="srn">${sr}</span>
          <span class="nm">${esc(v.name)}</span>
        </div>
        <div class="amt">${fmt(v.amount)}</div>
      `;
      bodyEl.appendChild(row);
    });
    col.appendChild(bodyEl);

    const tot = document.createElement("div");
    tot.className = "mcol-total";
    tot.innerHTML = `
      <div class="lbl">${esc(label)} Total</div>
      <div class="val">${fmt(total)}</div>
      <div class="cnt">${map.size} person${map.size === 1 ? "" : "s"}</div>
    `;
    col.appendChild(tot);

    table.appendChild(col);

    grandTotal += total;
    grandPersons += map.size;
    if (map.size) totalMonthsWithData++;
  });

  const avgPerMonth = totalMonthsWithData ? grandTotal / totalMonthsWithData : 0;

  const grandCol = document.createElement("div");
  grandCol.className = "mcol-grand";
  grandCol.innerHTML = `
    <div class="mcol-head">
      <div class="mname">GRAND TOTAL</div>
      <div class="mcount">${monthList.length} month${monthList.length === 1 ? "" : "s"}</div>
    </div>
    <div class="mcol-body">
      <div class="big-lbl">All Months Combined</div>
      <div class="big-val">${fmt(grandTotal)}</div>
      <div class="sub">${grandPersons} person-entr${grandPersons === 1 ? "y" : "ies"}</div>
      <div class="divider"></div>
      <div class="avg-lbl">Avg / Month</div>
      <div class="avg-val">${fmt(avgPerMonth)}</div>
    </div>
    <div class="mcol-total">
      <div class="lbl" style="color:#ffd54f">GRAND TOTAL</div>
      <div class="val">${fmt(grandTotal)}</div>
      <div class="cnt" style="color:#ffd54f; opacity:0.8;">
        ${monthList.length} month${monthList.length === 1 ? "" : "s"}
      </div>
    </div>
  `;
  table.appendChild(grandCol);
}

/* ============================================================
   DAILY REPORT TABLE
   ============================================================ */
function renderDaily(rows) {
  const statusEl = document.getElementById("dailyStatus");
  const wrap     = document.getElementById("dailyWrap");
  const hint     = document.getElementById("dailyHint");
  const body     = document.getElementById("dailyBody");
  const foot     = document.getElementById("dailyFoot");

  if (!rows.length) {
    statusEl.textContent = "No daily data found. Make sure the Daily sheet is published as CSV.";
    return;
  }

  /* Sort by start date ascending (fallback: string sort) */
  rows.sort((a, b) => {
    const da = parseDate(a.startDate);
    const db = parseDate(b.startDate);
    if (da && db) return da - db;
    return (a.startDate || "").localeCompare(b.startDate || "");
  });

  body.innerHTML = "";
  let tGross = 0, tExp = 0, tNet = 0;

  rows.forEach(r => {
    tGross += r.gross;
    tExp   += r.expenses;
    tNet   += r.net;

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="date">${esc(r.startDate) || "—"}</td>
      <td class="date">${esc(r.endDate) || "—"}</td>
      <td class="num gross">${fmt(r.gross)}</td>
      <td class="num exp">${fmt(r.expenses)}</td>
      <td class="num net">${fmt(r.net)}</td>
    `;
    body.appendChild(tr);
  });

  foot.innerHTML = `
    <tr>
      <td colspan="2">TOTAL (${rows.length} row${rows.length === 1 ? "" : "s"})</td>
      <td class="num gross">${fmt(tGross)}</td>
      <td class="num exp">${fmt(tExp)}</td>
      <td class="num net">${fmt(tNet)}</td>
    </tr>
  `;

  statusEl.style.display = "none";
  wrap.style.display = "block";
  hint.style.display = "block";
}

function parseDate(s) {
  if (!s) return null;
  /* Try DD/MM/YYYY, DD-MM-YYYY, YYYY-MM-DD, or JS-native */
  const t = Date.parse(s);
  if (!isNaN(t)) return t;
  const m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let dd = +m[1], mm = +m[2], yy = +m[3];
    if (yy < 100) yy += 2000;
    return new Date(yy, mm - 1, dd).getTime();
  }
  return null;
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadMonthly() {
  let all = [];
  for (const u of [SHEET1_CSV, SHEET2_CSV]) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      all = all.concat(normalizeRecords(parseCSV(txt)));
    } catch (e) { console.warn("Monthly fetch failed:", u, e); }
  }
  return all;
}

async function loadDaily() {
  try {
    const res = await fetch(SHEET_DAILY_CSV, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const txt = await res.text();
    return normalizeDaily(parseCSV(txt));
  } catch (e) {
    console.warn("Daily fetch failed:", SHEET_DAILY_CSV, e);
    return [];
  }
}

/* ============================================================
   MONTHLY VIEW STATE
   ============================================================ */
let allKeys = [];
let byMonth = new Map();
let currentView = "compare";

function renderMonthlyView() {
  const carousel   = document.getElementById("carousel");
  const dotsEl     = document.getElementById("dots");
  const swipeHint  = document.getElementById("swipeHint");
  const tableWrap  = document.getElementById("tableWrap");
  const tableHint  = document.getElementById("tableHint");

  carousel.style.display   = "none";
  dotsEl.style.display     = "none";
  swipeHint.style.display  = "none";
  tableWrap.style.display  = "none";
  tableHint.style.display  = "none";

  carousel.innerHTML = "";
  dotsEl.innerHTML = "";
  document.getElementById("mtable").innerHTML = "";

  if (currentView === "compare") {
    if (allKeys.length < 2) return;
    const kPrev = allKeys[allKeys.length - 2];
    const kCurr = allKeys[allKeys.length - 1];
    const prevRecs = byMonth.get(kPrev) || [];
    const currRecs = byMonth.get(kCurr) || [];
    const prevLabel = monthLabel(prevRecs[0]);
    const currLabel = monthLabel(currRecs[0]);

    carousel.appendChild(buildComparePage(prevRecs, currRecs, prevLabel, currLabel));
    carousel.style.display = "flex";
  } else {
    const monthList = allKeys.map(k => {
      const recs = byMonth.get(k) || [];
      return { recs, label: monthLabel(recs[0]) };
    }).filter(m => m.recs.length);

    buildTable(monthList);
    tableWrap.style.display = "block";
    tableHint.style.display = monthList.length > 1 ? "block" : "none";
  }
}

function renderMonthly(records) {
  const statusEl = document.getElementById("status");
  if (!records.length) {
    statusEl.textContent = "No data available. Please make sure the sheets are published as CSV.";
    return;
  }

  allKeys = [...new Set(records.map(monthKey))].filter(k => k > 0).sort((a,b) => a-b);
  if (allKeys.length < 2) {
    statusEl.textContent = "Need at least two months of data.";
    return;
  }

  byMonth = new Map();
  records.forEach(r => {
    const k = monthKey(r);
    if (!byMonth.has(k)) byMonth.set(k, []);
    byMonth.get(k).push(r);
  });

  statusEl.style.display = "none";
  renderMonthlyView();

  document.querySelectorAll('input[name="view"]').forEach(rb => {
    rb.addEventListener("change", e => {
      currentView = e.target.value;
      renderMonthlyView();
    });
  });
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
let reportLoaded = false;
function switchTab(tab) {
  document.getElementById("tabMonthly").classList.toggle("active", tab === "monthly");
  document.getElementById("tabReport").classList.toggle("active", tab === "report");
  document.getElementById("contentMonthly").classList.toggle("active", tab === "monthly");
  document.getElementById("contentReport").classList.toggle("active", tab === "report");

  if (tab === "report" && !reportLoaded) {
    reportLoaded = true;
    loadDaily().then(renderDaily);
  }
}
document.getElementById("tabMonthly").addEventListener("click", () => switchTab("monthly"));
document.getElementById("tabReport").addEventListener("click", () => switchTab("report"));

/* ============================================================
   BOOT
   ============================================================ */
loadMonthly().then(renderMonthly).catch(e => {
  document.getElementById("status").textContent = "Error: " + e.message;
  console.error(e);
});
</script>
