<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Parking Reports · Sangi</title>
<style>
  /* ---------- GLOBAL MODERN RESET / MOBILE FRIENDLY ---------- */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f2f5f9;
    color: #0b1a2e;
    font-size: 15px;
    line-height: 1.4;
    padding: 8px 0 24px;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ---------- TAB BAR (modern, pill) ---------- */
  .tab-bar {
    max-width: 520px;
    margin: 8px auto 14px;
    background: #ffffff;
    border-radius: 100px;
    padding: 5px;
    display: flex;
    gap: 5px;
    box-shadow: 0 8px 20px rgba(0, 20, 40, 0.08), 0 0 0 1px rgba(0,0,0,0.02);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .tab-bar button {
    flex: 1;
    padding: 12px 8px;
    border: none;
    background: transparent;
    color: #4a5e74;
    font-size: 14px;
    font-weight: 600;
    border-radius: 40px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s ease;
    letter-spacing: -0.2px;
    white-space: nowrap;
    touch-action: manipulation;
  }

  .tab-bar button.active {
    background: #0a66c2;
    color: #ffffff;
    box-shadow: 0 6px 14px rgba(10, 102, 194, 0.3);
  }

  /* ---------- TAB CONTENT ---------- */
  .tab-content {
    display: none;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .tab-content.active {
    display: block;
    opacity: 1;
  }

  /* ---------- STATUS / LOADING ---------- */
  .status {
    text-align: center;
    padding: 48px 24px;
    color: #6b7d92;
    font-size: 15px;
    font-weight: 500;
    background: #ffffff;
    border-radius: 20px;
    margin: 0 12px 20px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.03);
  }

  /* ---------- REPORT WRAP ---------- */
  .report-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 12px 24px;
  }

  /* ---------- OVERALL CARD (clean, light, modern) ---------- */
  .overall-card {
    background: #ffffff;
    border-radius: 24px;
    padding: 4px;
    box-shadow: 0 10px 28px rgba(0, 20, 40, 0.08), 0 0 0 1px rgba(0,0,0,0.02);
    margin-bottom: 24px;
  }

  .oc-inner {
    background: #fafcff;
    border-radius: 20px;
    padding: 22px 18px 18px;
    border: 1px solid #eef2f6;
  }

  .oc-title {
    text-align: center;
    font-size: 24px;
    font-weight: 800;
    color: #0a2a44;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
    line-height: 1.2;
  }

  .oc-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 15px;
  }

  .oc-table tr {
    border-bottom: 1px solid #e8edf3;
  }
  .oc-table tr:last-child {
    border-bottom: none;
  }

  .oc-table td {
    padding: 14px 2px;
    vertical-align: middle;
  }

  .oc-table td.metric {
    font-weight: 600;
    color: #1f3a57;
    width: 48%;
    font-size: 14.5px;
    line-height: 1.3;
  }

  .oc-table td.detail {
    color: #0b1a2e;
    font-weight: 600;
    text-align: right;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
  }

  .oc-table td.detail.highlight {
    font-weight: 800;
    color: #0a66c2;
    font-size: 17px;
  }

  /* combined row (Total Monthly ÷2 + Credit) */
  .oc-row-combined {
    background: linear-gradient(135deg, #e5f5e9 0%, #d4eed9 100%);
    border-radius: 16px;
    padding: 16px 18px;
    margin: 18px -18px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-left: 5px solid #1e7e34;
    box-shadow: 0 4px 12px rgba(30, 126, 52, 0.08);
  }

  .oc-row-combined .cb-k {
    font-size: 13px;
    font-weight: 800;
    color: #0f4b1e;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .oc-row-combined .cb-sub {
    font-size: 11px;
    color: #1e7e34;
    font-weight: 500;
    margin-top: 3px;
  }

  .oc-row-combined .cb-v {
    font-size: 22px;
    font-weight: 800;
    color: #0f4b1e;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    letter-spacing: -0.3px;
  }

  /* ---------- SECTION LABELS ---------- */
  .section-label {
    font-size: 13px;
    font-weight: 700;
    color: #3f5a73;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 24px 4px 10px;
    opacity: 0.8;
  }
  .section-label:first-of-type {
    padding-top: 0;
  }

  /* ---------- MONTH & PERIOD LISTS ---------- */
  .month-list,
  .period-list {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0, 20, 40, 0.05);
    overflow: hidden;
    border: 1px solid #eef2f6;
    margin-bottom: 6px;
  }

  .month-row,
  .period-row {
    padding: 16px 16px;
    border-bottom: 1px solid #f0f4f9;
    display: grid;
    grid-template-columns: 32px 1fr;
    gap: 12px;
    align-items: start;
    transition: background 0.15s;
  }
  .month-row:last-child,
  .period-row:last-child {
    border-bottom: none;
  }

  .month-row.current {
    background: #fffcf2;
    border-left: 5px solid #f5a623;
    padding-left: 11px;
  }

  .row-sr {
    font-size: 13px;
    font-weight: 700;
    color: #7d8f9f;
    text-align: center;
    background: #f1f6fb;
    border-radius: 8px;
    padding: 4px 0;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
    width: 32px;
  }

  .mr-head,
  .pr-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .mr-title {
    font-size: 16px;
    font-weight: 800;
    color: #0e2c47;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    line-height: 1.2;
  }

  .mr-badge {
    background: #f5a623;
    color: #ffffff;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 20px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  .mr-range {
    font-size: 12.5px;
    color: #5b7085;
    font-weight: 500;
    margin-top: 4px;
    letter-spacing: -0.1px;
  }

  .pr-range {
    font-size: 14.5px;
    font-weight: 700;
    color: #0e2c47;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: -0.2px;
  }

  .mr-days,
  .pr-days {
    background: #e5eff9;
    color: #0a66c2;
    padding: 4px 11px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 800;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* metric grids – 4 columns, modern cards */
  .mr-metrics,
  .pr-metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 2px;
  }

  .mr-metric,
  .pr-metric {
    text-align: center;
    padding: 10px 3px;
    border-radius: 12px;
    background: #f7fafd;
    min-width: 0;
    transition: background 0.1s;
    border: 1px solid #edf2f8;
  }

  .mr-metric .lbl,
  .pr-metric .lbl {
    font-size: 9.5px;
    color: #5b7085;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0.8;
  }

  .mr-metric .val,
  .pr-metric .val {
    font-size: 14px;
    font-weight: 800;
    margin-top: 5px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.3px;
  }

  .mr-metric.credit .val,
  .pr-metric.credit .val { color: #1e7e34; }
  .mr-metric.exp .val,
  .pr-metric.exp .val       { color: #c0392b; }
  .mr-metric.gross .val,
  .pr-metric.gross .val   { color: #0a66c2; }
  .mr-metric.avg,
  .pr-metric.avg                 { background: #e7f0fd; border-color: #d0e2fa; }
  .mr-metric.avg .val,
  .pr-metric.avg .val       { color: #0a3d7a; }

  /* sheet strip inside month */
  .mr-sheet-strip {
    margin-top: 14px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #f3e9fd 0%, #ede2fc 100%);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-left: 5px solid #8e44ad;
    box-shadow: 0 3px 10px rgba(142, 68, 173, 0.08);
  }

  .mr-sheet-strip .sheet-lbl {
    font-size: 10.5px;
    color: #5e2a7e;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 800;
  }

  .mr-sheet-strip .sheet-sub {
    font-size: 10px;
    color: #8e44ad;
    font-weight: 600;
    margin-top: 2px;
  }

  .mr-sheet-strip .sheet-val {
    font-size: 17px;
    font-weight: 800;
    color: #5e2a7e;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    letter-spacing: -0.3px;
  }

  .mr-sheet-strip .sheet-cnt {
    font-size: 10.5px;
    color: #8e44ad;
    font-weight: 600;
    text-align: right;
    margin-top: 2px;
  }

  .mr-combined-strip {
    margin-top: 8px;
    padding: 12px 14px;
    background: linear-gradient(135deg, #e5f5e9 0%, #d4eed9 100%);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border-left: 5px solid #1e7e34;
    box-shadow: 0 3px 10px rgba(30, 126, 52, 0.08);
  }

  .mr-combined-strip .c-lbl {
    font-size: 10.5px;
    color: #0f4b1e;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    font-weight: 800;
  }

  .mr-combined-strip .c-sub {
    font-size: 10px;
    color: #1e7e34;
    font-weight: 600;
    margin-top: 2px;
  }

  .mr-combined-strip .c-val {
    font-size: 18px;
    font-weight: 800;
    color: #0f4b1e;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    letter-spacing: -0.3px;
  }

  /* ---------- DAILY SECTION ---------- */
  .daily-section-title {
    font-size: 15px;
    font-weight: 700;
    color: #0e2c47;
    padding: 18px 4px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: -0.2px;
  }
  .daily-section-title::before {
    content: '';
    width: 5px;
    height: 20px;
    background: #0a66c2;
    border-radius: 4px;
  }

  .table-scroll {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(0, 20, 40, 0.06);
    background: #ffffff;
    border: 1px solid #eef2f6;
  }
  .table-scroll::-webkit-scrollbar {
    height: 5px;
  }
  .table-scroll::-webkit-scrollbar-thumb {
    background: #c8d4e0;
    border-radius: 20px;
  }

  .data-table {
    width: 100%;
    min-width: 620px;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  .data-table thead th {
    background: #0a66c2;
    color: #ffffff;
    padding: 14px 10px;
    text-align: left;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .data-table thead th.num {
    text-align: right;
  }

  .data-table tbody td {
    padding: 12px 10px;
    border-bottom: 1px solid #f0f4f9;
    white-space: nowrap;
  }
  .data-table tbody td.num {
    text-align: right;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .data-table tbody td.date {
    color: #445e75;
    font-size: 12.5px;
    font-weight: 500;
  }
  .data-table tbody tr:nth-child(even) {
    background: #fafcff;
  }
  .data-table td.gross { color: #0a66c2; }
  .data-table td.exp   { color: #c0392b; }
  .data-table td.net   { color: #1e7e34; }

  .data-table tfoot td {
    padding: 14px 10px;
    background: #1f2e3d;
    color: #ffffff;
    font-weight: 800;
    font-size: 13.5px;
    border-top: 3px solid #f5a623;
    white-space: nowrap;
    letter-spacing: -0.2px;
  }
  .data-table tfoot td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .data-table tfoot td.gross { color: #90caf9; }
  .data-table tfoot td.exp   { color: #ef9a9a; }
  .data-table tfoot td.net   { color: #a5d6a7; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: #7d8f9f;
    padding: 14px 0 6px;
    font-weight: 500;
    letter-spacing: -0.1px;
  }

  /* ---------- CAROUSEL (Last 2 Months) ---------- */
  .carousel {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 12px 10px;
    gap: 16px;
  }
  .carousel::-webkit-scrollbar {
    display: none;
  }

  .page {
    flex: 0 0 calc(100% - 24px);
    max-width: 520px;
    scroll-snap-align: center;
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(0, 20, 40, 0.10);
    overflow: hidden;
    border: 1px solid #eef2f6;
  }

  .rc-head {
    background: linear-gradient(145deg, #0a66c2, #0a4a8c);
    color: #ffffff;
    padding: 20px 16px 16px;
    text-align: center;
  }
  .rc-head h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .rc-head p {
    margin: 6px 0 0;
    font-size: 13px;
    opacity: 0.9;
    font-weight: 500;
  }

  .counts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: #f8fafc;
    border-bottom: 1px solid #e8edf3;
  }
  .counts > div {
    padding: 14px 8px;
    text-align: center;
    border-right: 1px solid #e8edf3;
  }
  .counts > div:last-child {
    border-right: none;
  }
  .counts .num {
    font-size: 24px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.5px;
  }
  .counts .lbl {
    font-size: 10.5px;
    color: #5b7085;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-top: 4px;
    font-weight: 700;
  }
  .counts .c1 { color: #0a66c2; }
  .counts .c2 { color: #1e7e34; }

  .months {
    display: grid;
    grid-template-columns: 38px 1fr 1fr;
    background: #f8fafc;
    border-bottom: 2px solid #e8edf3;
    font-size: 12.5px;
    font-weight: 700;
  }
  .months .hd {
    padding: 12px 6px;
    text-align: center;
    border-right: 1px solid #e8edf3;
  }
  .months .hd:last-child {
    border-right: none;
  }
  .months .m1 { color: #0a66c2; }
  .months .m2 { color: #1e7e34; }
  .months .sr-h { color: #8fa0b2; font-size: 11px; }

  .sec {
    padding: 10px 14px;
    font-size: 11.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    border-top: 1px solid #e8edf3;
    border-bottom: 1px solid #e8edf3;
  }
  .sec.ok   { background: #e5f5e9; color: #1e7e34; }
  .sec.warn { background: #fff5e6; color: #b85e00; }

  .item {
    display: grid;
    grid-template-columns: 38px 1fr 1fr;
    border-bottom: 1px dashed #eef2f6;
    background: #ffffff;
  }
  .item > div {
    padding: 10px 8px;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-right: 1px solid #f5f8fc;
    overflow: hidden;
  }
  .item > div:last-child {
    border-right: none;
  }

  .sr-cell {
    font-size: 12px;
    font-weight: 700;
    color: #6b7d92;
    text-align: center;
    background: #f6f9fd;
  }

  .name-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    font-weight: 600;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
  }
  .name-line .nm {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .amt {
    font-size: 15px;
    font-weight: 700;
    margin-top: 4px;
    letter-spacing: -0.2px;
  }
  .m1-cell .amt { color: #0a66c2; }
  .m2-cell .amt { color: #1e7e34; }

  .missing {
    color: #cbd5e1;
    font-style: italic;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .diff-badge {
    font-size: 10px;
    font-weight: 800;
    padding: 2px 6px;
    border-radius: 12px;
    margin-left: auto;
    flex-shrink: 0;
    letter-spacing: -0.1px;
  }
  .diff-badge.up { background: #e5f5e9; color: #1e7e34; }
  .diff-badge.down { background: #ffeaea; color: #c0392b; }
  .diff-badge.same { background: #eef2f6; color: #5b7085; }

  .total-row {
    display: grid;
    grid-template-columns: 38px 1fr 1fr;
    background: #f8fafc;
    border-top: 2px solid #e8edf3;
    font-weight: 700;
  }
  .total-row > div {
    padding: 14px 6px;
    text-align: center;
    border-right: 1px solid #e8edf3;
  }
  .total-row > div:last-child {
    border-right: none;
  }
  .total-row .mname {
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .total-row .mname.v1 { color: #0a66c2; }
  .total-row .mname.v2 { color: #1e7e34; }
  .total-row .val {
    font-size: 17px;
    margin-top: 5px;
    letter-spacing: -0.3px;
  }
  .total-row .val.v1 { color: #0a66c2; }
  .total-row .val.v2 { color: #1e7e34; }
  .total-row .cnt {
    font-size: 10.5px;
    color: #6b7d92;
    font-weight: 500;
    margin-top: 3px;
  }
  .total-row .sr-blank {
    background: #f6f9fd;
  }

  .grand {
    background: #1f2e3d;
    color: #ffffff;
    padding: 18px 16px;
    text-align: center;
  }
  .grand .lbl {
    font-size: 11.5px;
    opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 700;
  }
  .grand .val {
    font-size: 26px;
    font-weight: 800;
    margin-top: 6px;
    letter-spacing: -0.5px;
  }
  .grand .cnt {
    font-size: 11.5px;
    opacity: 0.85;
    margin-top: 8px;
    font-weight: 500;
  }

  .diffbar {
    margin: 14px 16px 18px;
    padding: 14px 18px;
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.2px;
  }
  .diffbar.pos { background: #e5f5e9; color: #1e7e34; }
  .diffbar.neg { background: #ffeaea; color: #c0392b; }
  .diffbar.zero { background: #eef2f6; color: #5b7085; }

  /* sheet total strips in Last 2 Months */
  .sheet-totals-wrap {
    padding: 14px 16px 18px;
    background: #f8fafc;
    border-top: 2px solid #e8edf3;
  }
  .sheet-totals-title {
    font-size: 11px;
    color: #5e2a7e;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 800;
    margin-bottom: 10px;
    text-align: center;
  }
  .sheet-totals-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .sheet-total-cell {
    background: linear-gradient(135deg, #f3e9fd 0%, #ede2fc 100%);

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const SHEET1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREo2Dzmu7_NM9xgM_xdNzb1TqpgSTn_dj5bgJT2l7WEgzykoT5zNHTOFxrS7UMN08eb2VOLEnaCLV4/pub?output=csv";
const SHEET2_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1452200885";
const SHEET_DAILY_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1810247989";

const COL = {
  name:   ["name/item", "name", "item", "person", "party"],
  amount: ["amount", "amt", "value"],
  month:  ["month", "mnth"],
  year:   ["year", "yr"]
};

const DAILY_COL = {
  startDate: ["start date", "startdate", "from", "from date"],
  endDate:   ["end date", "enddate", "to", "to date"],
  gross:     ["total gross amount (pkr)", "total gross amount", "gross amount", "gross"],
  expenses:  ["total expenses (pkr)", "total expenses", "expenses", "expense"],
  net:       ["total net amount credited (pkr)", "total net amount credited", "net amount credited", "net amount", "net"]
};

/* ============================================================
   CSV UTIL
   ============================================================ */
function parseCSV(text) {
  const rows = [];
  let cur = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(field); field = ""; }
      else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ""; }
      else if (c === '\r') { }
      else field += c;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function findCol(headers, names) {
  for (let i = 0; i < headers.length; i++) {
    const h = (headers[i] || "").trim().toLowerCase().replace(/\s+/g, " ");
    for (const n of names) if (h === n.toLowerCase()) return i;
  }
  return -1;
}

function normalizeRecords(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    name:   findCol(headers, COL.name),
    amount: findCol(headers, COL.amount),
    month:  findCol(headers, COL.month),
    year:   findCol(headers, COL.year)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = (r[idx.name] || "").trim();
    if (!name) continue;
    const amtRaw = (r[idx.amount] || "0").toString().replace(/[^0-9.\-]/g, "");
    out.push({
      name,
      amount: parseFloat(amtRaw) || 0,
      month:  idx.month >= 0 ? (r[idx.month] || "").trim() : "",
      year:   idx.year  >= 0 ? (r[idx.year]  || "").trim() : ""
    });
  }
  return out;
}

function normalizeDaily(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    startDate: findCol(headers, DAILY_COL.startDate),
    endDate:   findCol(headers, DAILY_COL.endDate),
    gross:     findCol(headers, DAILY_COL.gross),
    expenses:  findCol(headers, DAILY_COL.expenses),
    net:       findCol(headers, DAILY_COL.net)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (!r.some(c => (c || "").trim() !== "")) continue;

    const startDate = idx.startDate >= 0 ? (r[idx.startDate] || "").trim() : "";
    const endDate   = idx.endDate   >= 0 ? (r[idx.endDate]   || "").trim() : "";
    const gross     = idx.gross     >= 0 ? parseNum(r[idx.gross])     : 0;
    const expenses  = idx.expenses  >= 0 ? parseNum(r[idx.expenses])  : 0;
    const net       = idx.net       >= 0 ? parseNum(r[idx.net])       : 0;

    if (!startDate && !endDate && !gross && !expenses && !net) continue;

    out.push({ startDate, endDate, gross, expenses, net });
  }
  return out;
}

function parseNum(v) {
  if (v == null) return 0;
  const s = v.toString().replace(/[^0-9.\-]/g, "");
  return parseFloat(s) || 0;
}

/* ============================================================
   HELPERS
   ============================================================ */
const MONTH_NUM = {
  jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4,
  may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8, sep:9, sept:9,
  september:9, oct:10, october:10, nov:11, november:11, dec:12, december:12
};
const MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_LONG  = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function monthKey(rec) {
  const m = MONTH_NUM[rec.month.toLowerCase()] || 0;
  const y = parseInt(rec.year) || 0;
  return y * 100 + m;
}
function monthLabel(rec) {
  if (!rec) return "—";
  return `${rec.month} ${rec.year}`.trim();
}
function nameKey(name) { return name.toLowerCase().replace(/[^a-z0-9]/g, ""); }
function groupByName(recs) {
  const m = new Map();
  recs.forEach(r => {
    const k = nameKey(r.name);
    if (!m.has(k)) m.set(k, { name: r.name, amount: 0 });
    m.get(k).amount += r.amount;
  });
  return m;
}
function fmt(n) {
  const sign = n < 0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function fmtInt(n) { return Math.round(n).toLocaleString(); }
function fmtDec2(n) {
  return n.toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

/* ============================================================
   DATE PARSING
   ============================================================ */
function parseDateParts(s) {
  if (!s) return null;
  const str = s.toString().trim();
  if (!str) return null;

  let m = str.match(/^([A-Za-z]+)\s+(\d{1,2})(?:,)?\s+(\d{4})$/);
  if (m) {
    const mo = MONTH_NUM[m[1].toLowerCase()];
    if (mo) return { y: +m[3], m: mo, d: +m[2] };
  }
  m = str.match(/^(\d{1,2})\s+([A-Za-z]+)(?:,)?\s+(\d{4})$/);
  if (m) {
    const mo = MONTH_NUM[m[2].toLowerCase()];
    if (mo) return { y: +m[3], m: mo, d: +m[1] };
  }
  m = str.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return { y: +m[1], m: +m[2], d: +m[3] };

  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (m) {
    let a = +m[1], b = +m[2], y = +m[3];
    if (y < 100) y += 2000;
    if (a > 12) return { y, m: b, d: a };
    if (b > 12) return { y, m: a, d: b };
    return { y, m: b, d: a };
  }
  const t = Date.parse(str);
  if (!isNaN(t)) {
    const dt = new Date(t);
    return { y: dt.getFullYear(), m: dt.getMonth() + 1, d: dt.getDate() };
  }
  return null;
}

function dateKeyOf(p) { return p ? (p.y * 10000 + p.m * 100 + p.d) : 0; }
function dateCmp(a, b) { return dateKeyOf(a) - dateKeyOf(b); }

function daysBetween(p1, p2) {
  if (!p1 || !p2) return 0;
  const d1 = new Date(p1.y, p1.m - 1, p1.d);
  const d2 = new Date(p2.y, p2.m - 1, p2.d);
  const diff = Math.round((d2 - d1) / 86400000) + 1;
  return diff > 0 ? diff : 0;
}
function daysInMonth(y, m) { return new Date(y, m, 0).getDate(); }
function fmtDateLong(p) {
  if (!p) return "—";
  return `${MONTH_LONG[p.m - 1]} ${p.d}, ${p.y}`;
}
function fmtDateShort(p) {
  if (!p) return "—";
  return `${String(p.d).padStart(2, "0")} ${MONTH_SHORT[p.m - 1]} ${p.y}`;
}

/* ============================================================
   LAST-2-MONTHS CARD
   ============================================================ */
function buildCompareCard(prevRecs, currRecs, prevLabel, currLabel, prevSheetTotal, currSheetTotal) {
  const mapPrev = groupByName(prevRecs);
  const mapCurr = groupByName(currRecs);
  const cntPrev = mapPrev.size;
  const cntCurr = mapCurr.size;

  const matchedKeys = [], onlyPrevKeys = [], onlyCurrKeys = [];
  const seen = new Set();
  mapPrev.forEach((v, k) => {
    if (seen.has(k)) return; seen.add(k);
    if (mapCurr.has(k)) matchedKeys.push(k); else onlyPrevKeys.push(k);
  });
  mapCurr.forEach((v, k) => {
    if (seen.has(k)) return; seen.add(k);
    onlyCurrKeys.push(k);
  });

  let subPrev = 0, subCurr = 0, sr = 0;
  const page = document.createElement("div");
  page.className = "page";

  page.innerHTML = `
    <div class="rc-head">
      <h1>Monthly Comparison</h1>
      <p>${esc(prevLabel)}  vs  ${esc(currLabel)}</p>
    </div>
    <div class="counts">
      <div><div class="num c1">${cntPrev}</div><div class="lbl">Persons (${esc(prevLabel)})</div></div>
      <div><div class="num c2">${cntCurr}</div><div class="lbl">Persons (${esc(currLabel)})</div></div>
    </div>
    <div class="months">
      <div class="hd sr-h">#</div>
      <div class="hd m1">${esc(prevLabel)}</div>
      <div class="hd m2">${esc(currLabel)}</div>
    </div>
  `;

  const body = document.createElement("div");
  const buildRow = (p, c, srNum, showDiff) => {
    const left = p
      ? `<div class="m1-cell">
           <div class="name-line"><span class="nm">${esc(p.name)}</span></div>
           <div class="amt">${fmt(p.amount)}</div>
         </div>`
      : `<div class="m1-cell"><div class="missing">—</div></div>`;

    let rightName = "";
    if (c) {
      let badge = "";
      if (showDiff && p) {
        const d = c.amount - p.amount;
        if (Math.abs(d) < 0.005) badge = `<span class="diff-badge same">same</span>`;
        else if (d > 0)           badge = `<span class="diff-badge up">▲${fmt(d)}</span>`;
        else                      badge = `<span class="diff-badge down">▼${fmt(Math.abs(d))}</span>`;
      }
      rightName = `<div class="name-line"><span class="nm">${esc(c.name)}</span>${badge}</div>`;
    }
    const right = c
      ? `<div class="m2-cell">${rightName}<div class="amt">${fmt(c.amount)}</div></div>`
      : `<div class="m2-cell"><div class="missing">—</div></div>`;

    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `<div class="sr-cell">${srNum}</div>${left}${right}`;
    return row;
  };

  if (matchedKeys.length) {
    const sec = document.createElement("div");
    sec.className = "sec ok";
    sec.textContent = `✓ Matched Persons (${matchedKeys.length})`;
    body.appendChild(sec);
    matchedKeys.forEach(k => {
      const p = mapPrev.get(k), c = mapCurr.get(k);
      subPrev += p.amount; subCurr += c.amount;
      body.appendChild(buildRow(p, c, ++sr, true));
    });
  }

  if (onlyPrevKeys.length || onlyCurrKeys.length) {
    const sec = document.createElement("div");
    sec.className = "sec warn";
    sec.textContent = `⚠ Unmatched Persons (${onlyPrevKeys.length + onlyCurrKeys.length})`;
    body.appendChild(sec);
    const maxLen = Math.max(onlyPrevKeys.length, onlyCurrKeys.length);
    for (let i = 0; i < maxLen; i++) {
      const p = onlyPrevKeys[i] ? mapPrev.get(onlyPrevKeys[i]) : null;
      const c = onlyCurrKeys[i] ? mapCurr.get(onlyCurrKeys[i]) : null;
      if (p) subPrev += p.amount;
      if (c) subCurr += c.amount;
      body.appendChild(buildRow(p, c, ++sr, false));
    }
  }

  const totals = document.createElement("div");
  totals.className = "total-row";
  totals.innerHTML = `
    <div class="sr-blank"></div>
    <div>
      <div class="mname v1">${esc(prevLabel)}</div>
      <div class="val v1">${fmt(subPrev)}</div>
      <div class="cnt">${cntPrev} person${cntPrev === 1 ? "" : "s"}</div>
    </div>
    <div>
      <div class="mname v2">${esc(currLabel)}</div>
      <div class="val v2">${fmt(subCurr)}</div>
      <div class="cnt">${cntCurr} person${cntCurr === 1 ? "" : "s"}</div>
    </div>
  `;
  body.appendChild(totals);

  const grand = document.createElement("div");
  grand.className = "grand";
  grand.innerHTML = `
    <div class="lbl">Grand Total (Both Months)</div>
    <div class="val">${fmt(subPrev + subCurr)}</div>
    <div class="cnt">
      Matched: ${matchedKeys.length} &nbsp;•&nbsp;
      Only ${esc(prevLabel)}: ${onlyPrevKeys.length} &nbsp;•&nbsp;
      Only ${esc(currLabel)}: ${onlyCurrKeys.length}
    </div>
  `;
  body.appendChild(grand);

  const sheetWrap = document.createElement("div");
  sheetWrap.className = "sheet-totals-wrap";
  sheetWrap.innerHTML = `
    <div class="sheet-totals-title">Monthly Sheet Totals</div>
    <div class="sheet-totals-grid">
      <div class="sheet-total-cell">
        <div class="st-month">${esc(prevLabel)}</div>
        <div class="st-val">${prevSheetTotal ? fmtInt(prevSheetTotal.amount) : 0} PKR</div>
        <div class="st-sub">${prevSheetTotal ? prevSheetTotal.count : 0} entr${(prevSheetTotal && prevSheetTotal.count === 1) ? "y" : "ies"}</div>
      </div>
      <div class="sheet-total-cell">
        <div class="st-month">${esc(currLabel)}</div>
        <div class="st-val">${currSheetTotal ? fmtInt(currSheetTotal.amount) : 0} PKR</div>
        <div class="st-sub">${currSheetTotal ? currSheetTotal.count : 0} entr${(currSheetTotal && currSheetTotal.count === 1) ? "y" : "ies"}</div>
      </div>
    </div>
  `;
  body.appendChild(sheetWrap);

  const diff = subCurr - subPrev;
  const diffEl = document.createElement("div");
  diffEl.className = "diffbar " + (diff > 0 ? "pos" : diff < 0 ? "neg" : "zero");
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "=";
  const sign  = diff > 0 ? "+" : "";
  diffEl.innerHTML = `
    <span>Monthly Difference</span>
    <span>${arrow} ${sign}${fmt(diff)}</span>
  `;
  body.appendChild(diffEl);

  page.appendChild(body);
  return page;
}

/* ============================================================
   SMART MONTHLY SPLIT
   ============================================================ */
function computeMonthlySplit(rows) {
  const buckets = new Map();

  const ensure = (y, m) => {
    const key = y * 100 + m;
    if (!buckets.has(key)) {
      buckets.set(key, {
        y, m,
        minStart: null,
        maxEnd:   null,
        gross: 0, exp: 0, net: 0
      });
    }
    return buckets.get(key);
  };

  rows.forEach(r => {
    const sp = parseDateParts(r.startDate);
    const ep = parseDateParts(r.endDate) || sp;
    if (!sp) return;

    const periodDays = daysBetween(sp, ep) || 1;

    let y = sp.y, m = sp.m;
    while (true) {
      const bucket = ensure(y, m);

      const monthFirst = { y, m, d: 1 };
      const monthLast  = { y, m, d: daysInMonth(y, m) };

      const segStart = dateCmp(sp, monthFirst) > 0 ? sp : monthFirst;
      const segEnd   = (ep && dateCmp(ep, monthLast) < 0) ? ep : monthLast;

      const segDays = daysBetween(segStart, segEnd);
      const frac = periodDays ? segDays / periodDays : 0;

      bucket.gross += r.gross * frac;
      bucket.net   += r.net   * frac;

      if (y === sp.y && m === sp.m) bucket.exp += r.expenses;

      if (sp.y === y && sp.m === m) {
        if (!bucket.minStart || dateCmp(sp, bucket.minStart) < 0) {
          bucket.minStart = { y: sp.y, m: sp.m, d: sp.d };
        }
      } else {
        if (!bucket.minStart || dateCmp(monthFirst, bucket.minStart) < 0) {
          bucket.minStart = monthFirst;
        }
      }

      if (ep && ep.y === y && ep.m === m) {
        if (!bucket.maxEnd || dateCmp(ep, bucket.maxEnd) > 0) {
          bucket.maxEnd = { y: ep.y, m: ep.m, d: ep.d };
        }
      } else {
        if (!bucket.maxEnd || dateCmp(monthLast, bucket.maxEnd) > 0) {
          bucket.maxEnd = monthLast;
        }
      }

      if (ep && y === ep.y && m === ep.m) break;
      if (!ep && y === sp.y && m === sp.m) break;

      m++;
      if (m > 12) { m = 1; y++; }
      if (ep && (y > ep.y || (y === ep.y && m > ep.m))) break;
    }
  });

  const now = new Date();
  const today = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };

  const result = [];
  buckets.forEach(b => {
    let startP = b.minStart || { y: b.y, m: b.m, d: 1 };
    let endP   = b.maxEnd   || { y: b.y, m: b.m, d: daysInMonth(b.y, b.m) };

    const isCurrentMonth = (today.y === b.y && today.m === b.m);
    if (isCurrentMonth && dateCmp(endP, today) > 0) {
      endP = { y: today.y, m: today.m, d: today.d };
    }
    if (dateCmp(startP, endP) > 0) startP = endP;

    const daysCount = daysBetween(startP, endP);

    result.push({
      y: b.y, m: b.m,
      startP, endP,
      daysCount,
      isCurrentMonth,
      gross: b.gross, exp: b.exp, net: b.net
    });
  });

  result.sort((a, b) => (b.y * 100 + b.m) - (a.y * 100 + a.m));
  return result;
}

/* ============================================================
   MONTHLY SHEET TOTALS
   ============================================================ */
function computeMonthlySheetTotals(records) {
  const totals = new Map();
  records.forEach(r => {
    const k = monthKey(r);
    if (!k) return;
    if (!totals.has(k)) totals.set(k, { amount: 0, count: 0 });
    const t = totals.get(k);
    t.amount += r.amount;
    t.count++;
  });
  return totals;
}

function sumMonthlySheetTotals(records) {
  let sum = 0;
  records.forEach(r => { sum += r.amount; });
  return sum;
}

/* ============================================================
   REPORT — main render
   ============================================================ */
function renderReport(rows, monthlyRecords) {
  const statusEl = document.getElementById("dailyStatus");
  const contentEl = document.getElementById("reportContent");

  if (!rows.length) {
    statusEl.textContent = "No daily data found. Make sure the Daily sheet is published as CSV.";
    return;
  }

  let minStart = null, maxEnd = null;
  let totalGross = 0, totalExp = 0, totalNet = 0;

  rows.forEach(r => {
    totalGross += r.gross;
    totalExp   += r.expenses;
    totalNet   += r.net;
    const sp = parseDateParts(r.startDate);
    const ep = parseDateParts(r.endDate) || sp;
    if (sp && (!minStart || dateCmp(sp, minStart) < 0)) minStart = sp;
    if (ep && (!maxEnd   || dateCmp(ep, maxEnd)   > 0)) maxEnd   = ep;
  });

  const totalDays = (minStart && maxEnd) ? daysBetween(minStart, maxEnd) : 0;
  const monthlySheetTotal = sumMonthlySheetTotals(monthlyRecords);

  const overallEl = document.getElementById("overallCard");
  overallEl.innerHTML = "";
  overallEl.appendChild(buildOverallSummaryCard({
    gross: totalGross, exp: totalExp, net: totalNet, days: totalDays,
    minStart, maxEnd,
    monthlySheetTotal
  }));

  const sheetTotals = computeMonthlySheetTotals(monthlyRecords);

  const monthInfos = computeMonthlySplit(rows);
  const monthEl = document.getElementById("monthList");
  monthEl.innerHTML = "";
  monthInfos.forEach((info, i) => {
    const k = info.y * 100 + info.m;
    const sheetTotal = sheetTotals.get(k) || null;
    monthEl.appendChild(buildMonthRow(info, i + 1, sheetTotal));
  });

  const periodEl = document.getElementById("periodList");
  periodEl.innerHTML = "";

  const sortedRows = [...rows].sort((a, b) => {
    const da = parseDateParts(a.startDate), db = parseDateParts(b.startDate);
    if (da && db) return dateCmp(db, da);
    return (b.startDate || "").localeCompare(a.startDate || "");
  });

  sortedRows.forEach((r, i) => {
    const startP = parseDateParts(r.startDate);
    const endP   = parseDateParts(r.endDate) || startP;
    periodEl.appendChild(buildPeriodRow({
      startStr: r.startDate,
      endStr:   r.endDate,
      startP, endP,
      gross: r.gross, exp: r.expenses, net: r.net
    }, i + 1));
  });

  renderDailyTable(sortedRows);

  statusEl.style.display = "none";
  contentEl.style.display = "block";
}

/* ---- Daily data table ---- */
function renderDailyTable(rows) {
  const body = document.getElementById("dailyBody");
  const foot = document.getElementById("dailyFoot");
  body.innerHTML = "";
  foot.innerHTML = "";

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="5" style="text-align:center;color:#999;padding:20px;">No data</td></tr>`;
    return;
  }

  let tGross = 0, tExp = 0, tNet = 0;
  rows.forEach(r => {
    tGross += r.gross; tExp += r.expenses; tNet += r.net;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="date">${esc(r.startDate) || "—"}</td>
      <td class="date">${esc(r.endDate) || "—"}</td>
      <td class="num gross">${fmtInt(r.gross)}</td>
      <td class="num exp">${fmtInt(r.expenses)}</td>
      <td class="num net">${fmtInt(r.net)}</td>
    `;
    body.appendChild(tr);
  });

  foot.innerHTML = `
    <tr>
      <td colspan="2">TOTAL (${rows.length} row${rows.length === 1 ? "" : "s"})</td>
      <td class="num gross">${fmtInt(tGross)}</td>
      <td class="num exp">${fmtInt(tExp)}</td>
      <td class="num net">${fmtInt(tNet)}</td>
    </tr>
  `;
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadMonthly() {
  let all = [];
  for (const u of [SHEET1_CSV, SHEET2_CSV]) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      all = all.concat(normalizeRecords(parseCSV(txt)));
    } catch (e) { console.warn("Monthly fetch failed:", u, e); }
  }
  return all;
}

async function loadDaily() {
  try {
    const res = await fetch(SHEET_DAILY_CSV, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const txt = await res.text();
    return normalizeDaily(parseCSV(txt));
  } catch (e) {
    console.warn("Daily fetch failed:", SHEET_DAILY_CSV, e);
    return [];
  }
}

/* ============================================================
   MONTHLY STATE (Last 2 / All Months)
   ============================================================ */
let allKeys = [];
let byMonth = new Map();
let monthlyLoaded = false;
let monthlyRecordsCache = [];

function renderLast2() {
  const statusEl = document.getElementById("statusLast2");
  const carousel = document.getElementById("carousel");
  carousel.innerHTML = "";

  if (allKeys.length < 2) {
    statusEl.textContent = "Need at least two months of data.";
    statusEl.style.display = "block";
    carousel.style.display = "none";
    return;
  }

  const kPrev = allKeys[allKeys.length - 2];
  const kCurr = allKeys[allKeys.length - 1];
  const prevRecs = byMonth.get(kPrev) || [];
  const currRecs = byMonth.get(kCurr) || [];

  const sheetTotals = computeMonthlySheetTotals(monthlyRecordsCache);
  const prevSheetTotal = sheetTotals.get(kPrev) || null;
  const currSheetTotal = sheetTotals.get(kCurr) || null;

  carousel.appendChild(
    buildCompareCard(
      prevRecs, currRecs,
      monthLabel(prevRecs[0]), monthLabel(currRecs[0]),
      prevSheetTotal, currSheetTotal
    )
  );

  statusEl.style.display = "none";
  carousel.style.display = "flex";
}

function renderAllMonths() {
  const statusEl = document.getElementById("statusAll");
  const tableWrap = document.getElementById("tableWrap");
  const hint = document.getElementById("tableHint");

  if (allKeys.length < 2) {
    statusEl.textContent = "Need at least two months of data.";
    statusEl.style.display = "block";
    tableWrap.style.display = "none";
    hint.style.display = "none";
    return;
  }

  const monthList = allKeys.map(k => {
    const recs = byMonth.get(k) || [];
    return { recs, label: monthLabel(recs[0]) };
  }).filter(m => m.recs.length);

  buildAllMonthsTable(monthList);
  statusEl.style.display = "none";
  tableWrap.style.display = "block";
  hint.style.display = monthList.length > 1 ? "block" : "none";
}

async function loadMonthlyOnce() {
  if (monthlyLoaded) return;
  monthlyLoaded = true;

  const records = monthlyRecordsCache.length ? monthlyRecordsCache : await loadMonthly();
  monthlyRecordsCache = records;

  if (!records.length) {
    document.getElementById("statusLast2").textContent = "No monthly data available.";
    document.getElementById("statusAll").textContent = "No monthly data available.";
    return;
  }

  allKeys = [...new Set(records.map(monthKey))].filter(k => k > 0).sort((a,b) => a-b);

  byMonth = new Map();
  records.forEach(r => {
    const k = monthKey(r);
    if (!byMonth.has(k)) byMonth.set(k, []);
    byMonth.get(k).push(r);
  });

  renderLast2();
  renderAllMonths();
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function switchTab(tab) {
  document.getElementById("tabReport").classList.toggle("active", tab === "report");
  document.getElementById("tabLast2").classList.toggle("active", tab === "last2");
  document.getElementById("tabAll").classList.toggle("active", tab === "all");

  document.getElementById("contentReport").classList.toggle("active", tab === "report");
  document.getElementById("contentLast2").classList.toggle("active", tab === "last2");
  document.getElementById("contentAll").classList.toggle("active", tab === "all");

  if (tab === "last2" || tab === "all") loadMonthlyOnce();
}

document.getElementById("tabReport").addEventListener("click", () => switchTab("report"));
document.getElementById("tabLast2").addEventListener("click", () => switchTab("last2"));
document.getElementById("tabAll").addEventListener("click", () => switchTab("all"));

/* ============================================================
   BOOT
   ============================================================ */
Promise.all([loadDaily(), loadMonthly()])
  .then(([dailyRows, monthlyRecords]) => {
    monthlyRecordsCache = monthlyRecords;
    renderReport(dailyRows, monthlyRecords);
  })
  .catch(e => {
    document.getElementById("dailyStatus").textContent = "Error: " + e.message;
    console.error(e);
  });
