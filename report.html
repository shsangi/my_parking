<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monthly Comparison — Last 12 Months</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; padding: 12px; background: #eef1f5; color: #1a1a1a;
    font-size: 14px;
  }

  .receipt {
    max-width: 100%; margin: 0 auto;
    background: #fff; border-radius: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .rc-head {
    background: linear-gradient(135deg, #1e88e5, #1565c0);
    color: #fff; padding: 16px; text-align: center;
  }
  .rc-head h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .rc-head p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }

  /* Counts strip — horizontal scroll too */
  .counts-wrap {
    overflow-x: auto; background: #f7f9fc;
    border-bottom: 1px solid #e0e4ea;
    -webkit-overflow-scrolling: touch;
  }
  .counts {
    display: flex; min-width: max-content;
  }
  .counts > div {
    min-width: 90px; padding: 8px 6px; text-align: center;
    border-right: 1px solid #e0e4ea;
  }
  .counts > div:last-child { border-right: none; }
  .counts .num { font-size: 16px; font-weight: 800; line-height: 1.1; color: #1565c0; }
  .counts .lbl { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 2px; }

  /* Hint bar */
  .hint {
    background: #fff8e1; color: #8d6e00;
    font-size: 11px; text-align: center; padding: 6px;
    border-bottom: 1px solid #f0e0a0;
  }

  /* Main horizontal scroll container */
  .grid-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    position: relative;
  }

  /* Grid: sticky cols (SR + Name) then month cells */
  .grid {
    display: grid;
    min-width: max-content;
  }

  /* Header row */
  .head-row {
    position: sticky; top: 0; z-index: 5;
  }
  .head-cell {
    background: #f7f9fc; border-bottom: 2px solid #e0e4ea;
    border-right: 1px solid #e0e4ea;
    padding: 10px 6px; text-align: center;
    font-weight: 700; font-size: 12px;
    white-space: nowrap;
  }
  .head-sr   { background: #eef1f5; color: #999; font-size: 11px; }
  .head-name { background: #eef1f5; color: #555; text-align: left; padding-left: 10px; }

  /* Sticky columns */
  .sticky-sr {
    position: sticky; left: 0; z-index: 3;
    background: #f4f6f9;
  }
  .sticky-name {
    position: sticky; left: 36px; z-index: 3;
    background: #fff; box-shadow: 2px 0 4px rgba(0,0,0,0.06);
  }

  /* Data rows */
  .row-cell {
    padding: 8px 6px; min-height: 46px;
    border-bottom: 1px dashed #e5e8ee;
    border-right: 1px solid #f0f2f6;
    display: flex; flex-direction: column; justify-content: center;
    overflow: hidden;
    background: #fff;
  }
  .sr-cell {
    text-align: center; font-size: 11px; font-weight: 700;
    color: #6b7280; background: #f4f6f9;
    min-width: 36px;
  }
  .name-cell {
    font-weight: 600; font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 130px; max-width: 130px;
    padding-left: 10px;
  }
  .amt-cell {
    font-size: 13px; font-weight: 700; color: #1565c0;
    text-align: right; min-width: 88px;
    white-space: nowrap;
  }
  .amt-cell.zero { color: #c8cdd4; font-weight: 500; }
  .amt-cell.missing { color: #c8cdd4; font-weight: 400; font-style: italic; font-size: 11px; text-align: center; }

  /* Highlight recent 2 months */
  .col-recent { background: #f0f8ff; }
  .col-recent.head-cell { background: #e3f2fd; color: #0d47a1; }
  .col-latest { background: #f0fbf3; }
  .col-latest.head-cell { background: #e8f5e9; color: #1b5e20; }
  .col-latest .amt-cell { color: #2e7d32; }

  /* Diff chip on latest column */
  .diff-chip {
    font-size: 9px; font-weight: 700;
    padding: 1px 4px; border-radius: 4px;
    margin-left: 4px;
  }
  .diff-chip.up { background: #e8f5e9; color: #2e7d32; }
  .diff-chip.down { background: #ffebee; color: #c62828; }
  .diff-chip.same { background: #f0f2f6; color: #666; }

  /* Totals row */
  .total-row {
    position: sticky; bottom: 0; z-index: 4;
    background: #f7f9fc;
    border-top: 2px solid #e0e4ea;
  }
  .total-cell {
    padding: 12px 6px; text-align: center;
    font-weight: 700; font-size: 12px;
    border-right: 1px solid #e0e4ea;
    white-space: nowrap;
  }
  .total-cell .lbl { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.4px; }
  .total-cell .val { font-size: 13px; margin-top: 2px; color: #1565c0; }

  /* Grand total banner */
  .grand {
    background: linear-gradient(135deg, #263238, #37474f);
    color: #fff; padding: 16px; text-align: center;
  }
  .grand .lbl { font-size: 11px; opacity: 0.75; text-transform: uppercase; letter-spacing: 0.6px; }
  .grand .val { font-size: 24px; font-weight: 800; margin-top: 4px; }
  .grand .cnt { font-size: 11px; opacity: 0.85; margin-top: 6px; }

  .status { text-align: center; padding: 40px 20px; color: #777; }
</style>
</head>
<body>

<div class="receipt" id="receipt" style="display:none;">
  <div class="rc-head">
    <h1>Monthly Comparison</h1>
    <p id="subtitle">Last 12 months</p>
  </div>

  <div class="counts-wrap">
    <div class="counts" id="counts"></div>
  </div>

  <div class="hint">← Swipe left/right to see all months →</div>

  <div class="grid-wrap">
    <div class="grid" id="grid"></div>
  </div>

  <div class="grand" id="grand"></div>
</div>

<div class="status" id="status">Loading data…</div>

<script>
/* ============================================================
   CONFIG — paste your CSV export URLs here
   ============================================================ */
const SHEET1_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vREo2Dzmu7_NM9xgM_xdNzb1TqpgSTn_dj5bgJT2l7WEgzykoT5zNHTOFxrS7UMN08eb2VOLEnaCLV4/pub?output=csv";
const SHEET2_CSV = "https://docs.google.com/spreadsheets/d/1B4lO7kO8DXxhyuh2tEfs3RQB0SJwXOikVirlIURo00k/export?format=csv&gid=1452200885";

const MAX_MONTHS = 12;  // how many months to show

const COL = {
  name:   ["name/item", "name", "item", "person", "party"],
  amount: ["amount", "amt", "value"],
  month:  ["month", "mnth"],
  year:   ["year", "yr"]
};

/* ============================================================
   CSV PARSER
   ============================================================ */
function parseCSV(text) {
  const rows = [];
  let cur = [], field = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQ = false;
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ',') { cur.push(field); field = ""; }
      else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ""; }
      else if (c === '\r') { }
      else field += c;
    }
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}

function findCol(headers, names) {
  for (let i = 0; i < headers.length; i++) {
    const h = (headers[i] || "").trim().toLowerCase().replace(/\s+/g, " ");
    for (const n of names) if (h === n.toLowerCase()) return i;
  }
  return -1;
}

function normalizeRecords(rows) {
  if (!rows.length) return [];
  const headers = rows[0];
  const idx = {
    name:   findCol(headers, COL.name),
    amount: findCol(headers, COL.amount),
    month:  findCol(headers, COL.month),
    year:   findCol(headers, COL.year)
  };
  const out = [];
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const name = (r[idx.name] || "").trim();
    if (!name) continue;
    const amtRaw = (r[idx.amount] || "0").toString().replace(/[^0-9.\-]/g, "");
    out.push({
      name,
      amount: parseFloat(amtRaw) || 0,
      month:  idx.month >= 0 ? (r[idx.month] || "").trim() : "",
      year:   idx.year  >= 0 ? (r[idx.year]  || "").trim() : ""
    });
  }
  return out;
}

/* ============================================================
   MONTH HELPERS
   ============================================================ */
const MONTH_NUM = {
  jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4,
  may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8, sep:9, sept:9,
  september:9, oct:10, october:10, nov:11, november:11, dec:12, december:12
};
const MONTH_SHORT = ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function monthKey(rec) {
  const m = MONTH_NUM[rec.month.toLowerCase()] || 0;
  const y = parseInt(rec.year) || 0;
  return y * 100 + m;
}
function monthLabelShort(key) {
  const y = Math.floor(key / 100);
  const m = key % 100;
  return `${MONTH_SHORT[m]} ${String(y).slice(-2)}`;
}
function nameKey(name) {
  return name.toLowerCase().replace(/[^a-z0-9]/g, "");
}

/* ============================================================
   LOAD + RENDER
   ============================================================ */
async function loadAll() {
  let all = [];
  for (const u of [SHEET1_CSV, SHEET2_CSV]) {
    try {
      const res = await fetch(u, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const txt = await res.text();
      all = all.concat(normalizeRecords(parseCSV(txt)));
    } catch (e) { console.warn("Fetch failed:", u, e); }
  }
  return all;
}

function fmt(n) {
  const sign = n < 0 ? "-" : "";
  return sign + Math.abs(n).toLocaleString(undefined, {
    minimumFractionDigits: 2, maximumFractionDigits: 2
  });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function render(records) {
  const statusEl = document.getElementById("status");
  if (!records.length) {
    statusEl.textContent = "No data available. Please make sure the sheets are published as CSV.";
    return;
  }

  /* ---- Pick last N months ---- */
  const allKeys = [...new Set(records.map(monthKey))].filter(k => k > 0).sort((a,b) => a-b);
  const monthKeys = allKeys.slice(-MAX_MONTHS);
  if (monthKeys.length < 2) {
    statusEl.textContent = "Need at least two months of data to compare.";
    return;
  }

  /* ---- Group by name × month ---- */
  const mapByMonth = new Map();   // monthKey -> Map(nameKey -> {name, amount})
  monthKeys.forEach(k => mapByMonth.set(k, new Map()));

  records.forEach(r => {
    const k = monthKey(r);
    if (!mapByMonth.has(k)) return;
    const nk = nameKey(r.name);
    const m = mapByMonth.get(k);
    if (!m.has(nk)) m.set(nk, { name: r.name, amount: 0 });
    m.get(nk).amount += r.amount;
  });

  /* ---- Collect all person keys, ordered by first appearance (earliest month first) ---- */
  const orderedPersons = [];
  const seenPerson = new Set();
  monthKeys.forEach(k => {
    mapByMonth.get(k).forEach((v, nk) => {
      if (!seenPerson.has(nk)) { seenPerson.add(nk); orderedPersons.push(nk); }
    });
  });

  /* ---- Count persons per month ---- */
  const countsEl = document.getElementById("counts");
  countsEl.innerHTML = "";
  monthKeys.forEach((k, idx) => {
    const cnt = mapByMonth.get(k).size;
    const isLatest = idx === monthKeys.length - 1;
    const isRecent = idx === monthKeys.length - 2;
    const div = document.createElement("div");
    if (isLatest) div.style.background = "#e8f5e9";
    else if (isRecent) div.style.background = "#e3f2fd";
    div.innerHTML = `
      <div class="num" style="${isLatest ? 'color:#2e7d32;' : ''}">${cnt}</div>
      <div class="lbl">${monthLabelShort(k)}</div>
    `;
    countsEl.appendChild(div);
  });

  /* ---- Build grid ---- */
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  /* grid-template-columns: 36px (sr) 130px (name) + N columns for months */
  const cols = `36px 130px repeat(${monthKeys.length}, 92px)`;
  grid.style.gridTemplateColumns = cols;

  /* ---- Header row ---- */
  const hRow = document.createElement("div");
  hRow.className = "head-row";
  hRow.style.display = "contents";
  hRow.innerHTML = `
    <div class="head-cell head-sr sticky-sr">#</div>
    <div class="head-cell head-name sticky-name">Name</div>
    ${monthKeys.map((k, i) => {
      const isLatest = i === monthKeys.length - 1;
      const isRecent = i === monthKeys.length - 2;
      const cls = isLatest ? "col-latest" : isRecent ? "col-recent" : "";
      return `<div class="head-cell ${cls}">${monthLabelShort(k)}</div>`;
    }).join("")}
  `;
  grid.appendChild(hRow);

  /* ---- Data rows ---- */
  let sr = 0;
  const totalsByMonth = monthKeys.map(() => 0);

  orderedPersons.forEach(nk => {
    sr++;
    const row = document.createElement("div");
    row.style.display = "contents";

    row.innerHTML = `
      <div class="row-cell sr-cell sticky-sr">${sr}</div>
      <div class="row-cell name-cell sticky-name">${esc(mapByMonth.get(monthKeys[0]).get(nk)?.name || 
        monthKeys.map(k => mapByMonth.get(k).get(nk)).find(v => v)?.name || "")}</div>
    `;

    monthKeys.forEach((k, i) => {
      const rec = mapByMonth.get(k).get(nk);
      const isLatest = i === monthKeys.length - 1;
      const isRecent = i === monthKeys.length - 2;
      const cls = isLatest ? "col-latest" : isRecent ? "col-recent" : "";

      const cell = document.createElement("div");
      cell.className = "row-cell amt-cell " + cls;

      if (rec) {
        totalsByMonth[i] += rec.amount;
        let amtHtml = fmt(rec.amount);
        if (rec.amount === 0) cell.classList.add("zero");

        /* Diff chip only on the LATEST column */
        if (isLatest && isRecent) {
          const prevRec = mapByMonth.get(monthKeys[i-1]).get(nk);
          if (prevRec) {
            const d = rec.amount - prevRec.amount;
            let chip = "";
            if (Math.abs(d) < 0.005) chip = `<span class="diff-chip same">=</span>`;
            else if (d > 0)          chip = `<span class="diff-chip up">▲</span>`;
            else                     chip = `<span class="diff-chip down">▼</span>`;
            amtHtml += " " + chip;
          }
        }
        cell.innerHTML = amtHtml;
      } else {
        cell.classList.add("missing");
        cell.textContent = "—";
      }

      row.appendChild(cell);
    });

    grid.appendChild(row);
  });

  /* ---- Totals row (sticky bottom) ---- */
  const totalRow = document.createElement("div");
  totalRow.className = "total-row";
  totalRow.style.display = "contents";

  totalRow.innerHTML = `
    <div class="total-cell sticky-sr"> </div>
    <div class="total-cell sticky-name" style="text-align:left; padding-left:10px;">TOTAL</div>
    ${totalsByMonth.map(v => `<div class="total-cell"><div class="lbl">Total</div><div class="val">${fmt(v)}</div></div>`).join("")}
  `;
  grid.appendChild(totalRow);

  /* ---- Grand total ---- */
  const grandTotal = totalsByMonth.reduce((a,b) => a+b, 0);
  document.getElementById("grand").innerHTML = `
    <div class="lbl">Grand Total (${monthKeys.length} months)</div>
    <div class="val">${fmt(grandTotal)}</div>
    <div class="cnt">${orderedPersons.length} unique persons across all months</div>
  `;

  /* ---- Subtitle ---- */
  document.getElementById("subtitle").textContent =
    `${monthLabelShort(monthKeys[0])} — ${monthLabelShort(monthKeys[monthKeys.length-1])}  (${monthKeys.length} months)`;

  statusEl.style.display = "none";
  document.getElementById("receipt").style.display = "block";
}

loadAll().then(render).catch(e => {
  document.getElementById("status").textContent = "Error: " + e.message;
  console.error(e);
});
</script>
</body>
</html>
